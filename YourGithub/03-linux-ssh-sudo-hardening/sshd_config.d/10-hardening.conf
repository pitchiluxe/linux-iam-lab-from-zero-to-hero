# /etc/ssh/sshd_config.d/10-hardening.conf   (ticket SEC-6003, SSH baseline)
# Drop-in file: the vendor's sshd_config stays untouched, so package updates don't overwrite it.
# Apply safely:  sudo sshd -t && sudo systemctl reload ssh
#   sshd -t validates first; reload (not restart) keeps the sessions already open, including yours.
#   Keep a second session open while you change SSH, in case you lock yourself out.

# Nobody logs in as root directly. Admins log in as themselves and use sudo,
# so every root action has a named person in the logs.
PermitRootLogin no

# 3 wrong attempts per connection, then disconnect. Slows down password guessing.
MaxAuthTries 3

# 30 seconds to finish logging in; idle half-open connections don't pile up.
LoginGraceTime 30

# No graphical forwarding on a server: less attack surface, nobody needs it.
X11Forwarding no

# Allow-list: only members of ssh-users may log in over SSH, whatever their password or key.
# Access is granted by group membership, so it is reviewed with the other roles.
AllowGroups ssh-users
