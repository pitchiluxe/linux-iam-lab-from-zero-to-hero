# /etc/ssh/sshd_config.d/20-revoked-keys.conf   (ticket SEC-6004, stolen laptop)
# Deleting the key from authorized_keys is not enough: the user (or an attacker with their
# password) could add it back. Keys listed here are refused for EVERY account, even if re-added.
# /etc/ssh/revoked_keys holds the public half of each revoked key, one per line, owned by root.
# Apply:  sudo sshd -t && sudo systemctl reload ssh
RevokedKeys /etc/ssh/revoked_keys
