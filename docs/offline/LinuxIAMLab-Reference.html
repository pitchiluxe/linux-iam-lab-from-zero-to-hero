 active (running) since Tue 2026-11-11 09:00:01 UTC; 1h ago\n   Main PID: 1234 (python3)\n```\n\n```linux\nsystemctl show -p User,MainPID,ActiveState,UnitFileState falcon-web\n```\n`show -p` prints selected properties as `Name=value` - easy to read and to script.\n```text\nUser=svc-falcon\nMainPID=1234\nActiveState=active\nUnitFileState=enabled\n```\n\n```linux\nps -o user,pid,cmd -p 1234\n```\n`ps -o` chooses columns; `-p` selects a PID. Confirms the process really runs as that user.\n\n```linux\nsudo ss -ltnp | grep python3\n```\n`ss -l` listening sockets, `-t` TCP, `-n` numeric ports, `-p` owning process (needs `sudo` for other users' processes). Look at the *Local Address:Port* column.\n```text\nLISTEN 0 5 127.0.0.1:8000 0.0.0.0:* users:((\"python3\",pid=1234,fd=3))\n```\n`127.0.0.1` means only programs on this server can connect - a good default.\n\n```linux\njournalctl -u falcon-web -n 10 --no-pager\n```\nThe service's last 10 log lines.\n\n```linux\ncat /etc/systemd/system/falcon-web.service\n```\nThe unit file shows the `User=` setting that makes systemd drop root privileges before starting the app.\n\n### Your task\nCreate `~/lab/m02/falcon.txt`:\n```text\nuser=<account the service runs as>\npid=<its current main PID>\nport=<TCP port it listens on>\nstate=<active or inactive>\nboot=<enabled or disabled>\n```\n\n### Verify\nCompare each line with `systemctl show -p User,MainPID,ActiveState,UnitFileState falcon-web`. Then **Check my work**. (If you restart the service, its PID changes: update the file.)\n\n### If it fails\n- *pid is not right*: the PID changes on every restart. Re-read it.\n- *ss shows nothing*: add `sudo`, or check the service is running.\n- *Unit not found*: the service name is `falcon-web` (with a dash).\n\n### Hint 1\n`systemctl status falcon-web` answers most questions at once.\n\n### Hint 2\n`systemctl show -p User,MainPID falcon-web` gives exact values; `sudo ss -ltnp` shows the port next to the PID.\n\n### Hint 3\n`user=svc-falcon`, `port=8000`, `state=active`, `boot=enabled`, and `pid=` is the `MainPID` value on your VM.\n\n### Walkthrough\n```linux\nsystemctl status falcon-web --no-pager\nsystemctl show -p User,MainPID,ActiveState,UnitFileState falcon-web\nsudo ss -ltnp | grep 8000\nPID=$(systemctl show -p MainPID --value falcon-web)\nps -o user,pid,cmd -p \"$PID\"\nmkdir -p ~/lab/m02\nprintf 'user=svc-falcon\\npid=%s\\nport=8000\\nstate=active\\nboot=enabled\\n' \"$PID\" > ~/lab/m02/falcon.txt\nlab check m02-processes-services\n```\n`--value` prints just the value without `MainPID=`.\n\n**Why it matters:** service accounts are identities too. Knowing which account a service runs as, and that it is not `root`, is the core of a non-human identity inventory.", "group": "Module 2 exercises"}, {"id": "m02-bash-script", "title": "m02-bash-script: Script - list accounts that can log in", "md": "### Ticket\n**AUD-2004** - *From: Internal Audit* - \"Every month we ask which local accounts have an interactive shell. Write a reusable script `~/bin/login-accounts.sh` that prints one line per account in `/etc/passwd` whose shell is **not** `nologin` or `false`, as `username shell`, sorted by username.\"\n\n### Objective\nWrite, make executable and run a small, safe Bash script that answers an access question.\n\n### Before you start\nLinux terminal. `~/bin` is on your `PATH` (create it if it does not exist; open a new terminal tab if `login-accounts.sh` is \"not found\" after creating `~/bin`).\n\n### Concepts and commands\n```linux\nhead -3 /etc/passwd\n```\n```text\nroot:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\nbin:x:2:2:bin:/bin:/usr/sbin/nologin\n```\nSeven fields separated by `:`: name, password placeholder (`x` = stored in `/etc/shadow`), UID, GID, comment, home, **shell** (field 7). A shell of `/usr/sbin/nologin` or `/bin/false` blocks interactive logins - typical for service accounts.\n\n```linux\nawk -F: '$7 !~ /(nologin|false)$/ {print $1, $7}' /etc/passwd | sort\n```\n- `-F:` splits fields on `:`.\n- `$7 !~ /(nologin|false)$/` keeps lines whose 7th field does **not** end with `nologin` or `false` (`~` = matches, `!~` = does not match, `$` = end of text).\n- `{print $1, $7}` prints name and shell separated by a space.\n\n```linux\nmkdir -p ~/bin\nnano ~/bin/login-accounts.sh\nchmod +x ~/bin/login-accounts.sh\n~/bin/login-accounts.sh\n```\n`chmod +x` adds the execute permission so you can run the file as a program.\n\nA good script skeleton:\n```linux\n#!/usr/bin/env bash\n# login-accounts.sh - list local accounts with an interactive shell\nset -euo pipefail\nawk -F: '$7 !~ /(nologin|false)$/ {print $1, $7}' /etc/passwd | sort\n```\n- `#!/usr/bin/env bash` - run with Bash.\n- `set -euo pipefail` - stop on the first error instead of printing a half-true report.\n- Comments start with `#` and explain *why*.\n\n### Your task\n1. Create `~/bin/login-accounts.sh`, starting with a shebang line and `set -euo pipefail`.\n2. It prints `username shell` for every account in `/etc/passwd` whose shell does not end in `nologin` or `false`, sorted by username, nothing else.\n3. Make it executable and run it.\n4. Look at the result. Is anything surprising there (for example `sync`)? Note it in a comment in your script.\n\n### Verify\nRun it twice: same output both times, and it changes nothing. Then **Check my work** - the check runs your script and compares its output with `/etc/passwd`.\n\n### If it fails\n- *Permission denied when running*: `chmod +x ~/bin/login-accounts.sh`.\n- *`bash: login-accounts.sh: command not found`*: run it with its path `~/bin/login-accounts.sh`.\n- *Output differs*: run the script and the `awk` line by hand and compare. Watch for extra `echo` lines or headers.\n- *`$'\\r': command not found`*: the file has Windows line endings (pasted from Windows). Fix with `sed -i 's/\\r$//' ~/bin/login-accounts.sh`.\n\n### Hint 1\nThe shell is field 7 of `/etc/passwd`. `awk -F:` splits on colons.\n\n### Hint 2\nKeep lines where `$7` does not end with `nologin` or `false`: `$7 !~ /(nologin|false)$/`. Print `$1, $7`, then `| sort`.\n\n### Hint 3\nThe whole script is three lines: the shebang, `set -euo pipefail`, and `awk -F: '$7 !~ /(nologin|false)$/ {print $1, $7}' /etc/passwd | sort`.\n\n### Walkthrough\n```linux\nmkdir -p ~/bin\ncat > ~/bin/login-accounts.sh <<'EOF'\n#!/usr/bin/env bash\n# login-accounts.sh - local accounts that have an interactive shell (AUD-2004)\n# Note: 'sync' has /bin/sync as its shell - a legacy account worth flagging.\nset -euo pipefail\nawk -F: '$7 !~ /(nologin|false)$/ {print $1, $7}' /etc/passwd | sort\nEOF\nchmod +x ~/bin/login-accounts.sh\n~/bin/login-accounts.sh\nlab check m02-bash-script\n```\n`cat > FILE <<'EOF' ... EOF` (a *here-document*) writes several lines into a file without an editor; the quotes around `EOF` stop the shell from expanding `$7` while writing.\n```text\naokafor /bin/bash\nbtran /bin/bash\n...\nstudent /bin/bash\nsync /bin/sync\n```", "group": "Module 2 exercises"}, {"id": "m03", "title": "Module 3: Manage the identity lifecycle", "md": "*Users, groups, UID/GID, primary and supplementary groups, service accounts, expiry, lockout and offboarding - the Joiner-Mover-Leaver process on Linux.*\n\nIn IAM, an identity goes through a **lifecycle**: a **joiner** gets an account and the right roles, a **mover** changes roles (and must *lose* the old ones), and a **leaver** is disabled promptly and cleanly. On a Linux server that lifecycle is managed with a handful of commands and three files.\n\n## The three identity files\n\n| File | Readable by | One line per | Key fields |\n|---|---|---|---|\n| `/etc/passwd` | everyone | account | `name:x:UID:GID:comment:home:shell` |\n| `/etc/group` | everyone | group | `name:x:GID:member1,member2` (supplementary members) |\n| `/etc/shadow` | root and group `shadow` only | account | `name:hash:lastchange:min:max:warn:inactive:expire:` |\n\n```text\nbtran:x:2003:2003:Ben Tran - Software Engineer:/home/btran:/bin/bash\nengineering:x:3003:btran,enovak\nbtran:$y$j9T$...:20403:0:99999:7:::\n```\n- **UID** (user ID) is what the kernel actually checks. Names are labels for humans. Two accounts with the same UID are the *same* identity to the kernel - an audit finding.\n- **UID ranges** on Ubuntu: `0` is root; `1-999` are system/service accounts; `1000+` are people. This lab uses `2001+` for staff and `10001+` for directory users.\n- A password hash starting with `!` or `*` means the password is **locked** or never set. The 8th shadow field is the **account expiry** day (days since 1970-01-01).\n\n## Groups are roles\n\n- Every user has one **primary group** (the GID in `/etc/passwd`). New files get this group. Ubuntu creates a private group with the same name as the user (\"user private group\").\n- **Supplementary groups** (listed in `/etc/group`) are how you grant roles: put `jkim` in `finance` and she gets whatever `finance` can do.\n- Group changes apply to **new logins**. A user already logged in must log out and back in (or run `newgrp`). `id USER` reads the database, so it shows the change immediately.\n\n## Lifecycle commands\n\n| Task | Command |\n|---|---|\n| inspect | `id btran`, `getent passwd btran`, `getent group finance`, `groups btran`, `sudo chage -l btran`, `sudo passwd -S btran` |\n| create a user | `sudo useradd -m -c \"Full Name - Role\" -s /bin/bash -G finance jdoe` (`-m` home, `-c` comment, `-s` shell, `-G` supplementary groups, `-e YYYY-MM-DD` expiry) |\n| set a password | `sudo passwd jdoe` |\n| force change at next login | `sudo chage -d 0 jdoe` |\n| add a role | `sudo usermod -aG webops btran` (**`-a` append is essential**: `-G` alone *replaces* all supplementary groups) or `sudo gpasswd -a btran webops` |\n| remove a role | `sudo gpasswd -d btran engineering` |\n| expiry | `sudo chage -E 2027-06-30 jdoe`; `-E -1` removes it; `-E 0` expires now |\n| lock / unlock password | `sudo usermod -L jdoe` / `sudo usermod -U jdoe` (key-based SSH still works when only the password is locked!) |\n| block interactive shell | `sudo usermod -s /usr/sbin/nologin jdoe` |\n| create a group | `sudo groupadd webops` |\n| delete (only after retention) | `sudo userdel -r jdoe` (`-r` also removes the home folder) |\n\n> **Careful** `usermod -G webops btran` without `-a` removes btran from every other supplementary group. Always re-check with `id btran` after a change.\n\n## Disabling vs deleting\n\nOrganisations usually **disable** a leaver first (lock, expire, remove roles, kill sessions, keep data) and **delete** after a retention period. Deleting immediately loses evidence and can leave **orphaned files** owned by a bare UID that a future account could inherit.\n\n## Lockout\n\nThis lab's Ubuntu uses **pam_faillock**: after 5 failed passwords within 15 minutes an account stays locked until an administrator resets it (`unlock_time = 0` in `/etc/security/faillock.conf`). `sudo faillock --user NAME` shows the failures; `sudo faillock --user NAME --reset` clears them. Unlock only after the identity of the requester is verified.\n\n> **Careful** This applies to you too: five wrong passwords at the `sudo` prompt lock `student`. If that happens, use **Progress & lab tools > Unlock student** in the portal (or `lab rescue faillock`).\n", "group": "Lessons"}, {"id": "m03-inspect-identities", "title": "m03-inspect-identities: Answer an auditor's questions about accounts", "md": "### Ticket\n**IAM-3001** - *From: External auditor* - \"Please confirm, from the server itself, the following facts about accounts on `iamlab01`. Answers in `~/lab/m03/identity-answers.txt`.\"\n\n### Objective\nRead `/etc/passwd`, `/etc/group` and `/etc/shadow` (with the right privilege), and use `id`, `getent` and `chage` to answer identity questions precisely.\n\n### Before you start\nLinux terminal. Some answers need `sudo` (reading `/etc/shadow` and `chage -l`). Type your own password when asked; it is not shown while you type.\n\n### Concepts and commands\n```linux\nid btran\n```\n```text\nuid=2003(btran) gid=2003(btran) groups=2003(btran),3003(engineering),3006(proj-falcon),3008(ssh-users)\n```\n`gid=` is the **primary** group; `groups=` lists the primary group first, then the **supplementary** groups.\n\n```linux\ngetent passwd btran\ngetent group finance\n```\n`getent` asks the system's identity sources (local files *and* the directory, see module 7), so it is the right tool even when users do not live in `/etc/passwd`.\n```text\nbtran:x:2003:2003:Ben Tran - Software Engineer:/home/btran:/bin/bash\nfinance:x:3001:aokafor,jkim\n```\nThe last field of a group line lists its **supplementary** members.\n\n```linux\nls -l /etc/shadow\nsudo grep '^kwright:' /etc/shadow\nsudo chage -l kwright\n```\n`ls -l` shows who may read the shadow file. `chage -l` turns the shadow numbers into dates:\n```text\nLast password change                                    : Nov 11, 2026\nPassword expires                                        : never\nAccount expires                                         : Dec 31, 2025\n```\n\n```linux\ndate -d \"Dec 31, 2025\" +%F\n```\nConverts a date to ISO format `YYYY-MM-DD` (`%F`).\n\n### Your task\nCreate `~/lab/m03/identity-answers.txt`:\n```text\nbtran_uid=<numeric UID of btran>\nbtran_primary_group=<name of btran's primary group>\nbtran_groups=<btran's SUPPLEMENTARY groups, sorted, comma-separated>\nfinance_members=<supplementary members of group finance, sorted, comma-separated>\nkwright_expires=<kwright's account expiry date as YYYY-MM-DD>\nsvc_falcon_shell=<login shell of the service account svc-falcon>\nshadow_readable_by_student=<yes or no: can student read /etc/shadow without sudo?>\n```\n\n### Verify\nRe-run the commands and compare. **Check my work** recomputes every answer from the live system (so if you change accounts in later exercises, the answers change too).\n\n### If it fails\n- *btran_groups*: exclude the primary group `btran`; sort alphabetically; no spaces.\n- *kwright_expires*: must be ISO format, e.g. `2025-12-31`.\n- *shadow_readable_by_student*: try `cat /etc/shadow` without sudo and read the error.\n\n### Hint 1\n`id btran` answers three questions. `getent group finance` answers one. `sudo chage -l kwright` answers one.\n\n### Hint 2\n`id -nG btran` prints only group names; drop the first one (primary) and sort the rest: `id -nG btran | tr ' ' '\\n' | grep -vx btran | sort | paste -sd, -`.\n\n### Hint 3\n`getent passwd svc-falcon | cut -d: -f7` gives the shell. `cat /etc/shadow` as student says `Permission denied`, so the answer is `no`.\n\n### Walkthrough\n```linux\nmkdir -p ~/lab/m03\nid btran\nid -nG btran | tr ' ' '\\n' | grep -vx btran | sort | paste -sd, -\ngetent group finance\nsudo chage -l kwright | grep 'Account expires'\ndate -d \"Dec 31, 2025\" +%F\ngetent passwd svc-falcon | cut -d: -f7\ncat /etc/shadow\n```\n```text\ncat: /etc/shadow: Permission denied\n```\n```linux\nnano ~/lab/m03/identity-answers.txt\n```\n```text\nbtran_uid=2003\nbtran_primary_group=btran\nbtran_groups=engineering,proj-falcon,ssh-users\nfinance_members=aokafor,jkim\nkwright_expires=2025-12-31\nsvc_falcon_shell=/usr/sbin/nologin\nshadow_readable_by_student=no\n```\n```linux\nlab check m03-inspect-identities\n```\n(Your values can differ if you already completed later exercises - always read the live system.)", "group": "Module 3 exercises"}, {"id": "m03-onboard", "title": "m03-onboard: Onboard a new finance analyst (joiner)", "md": "### Ticket\n**HR-3002** - *Approved by: Amara Okafor (Finance Manager)* - \"Fatima Garcia joins Finance as an analyst on Monday. Create her Linux account with the standard finance role. She is on probation until 31 Dec 2027, so the account must expire then unless renewed. Set a temporary password and make her choose her own at first login. No admin rights.\"\n\n| Field | Value |\n|---|---|\n| Username | `fgarcia` |\n| Comment (GECOS) | `Fatima Garcia - Finance Analyst` |\n| Shell | `/bin/bash` |\n| Home | `/home/fgarcia`, private (mode `750`) |\n| Role groups | `finance` only |\n| Account expiry | `2027-12-31` |\n| Password | temporary, must be changed at first login |\n\n### Objective\nCreate a user correctly the first time with `useradd`, set and expire a temporary password with `passwd` and `chage`, and prove the access works - and only that access.\n\n### Before you start\nLinux terminal; you need `sudo`. Group `finance` exists. Choose any temporary password (it is a fictional account). Never put real passwords in tickets or chat.\n\n### Concepts and commands\n```linux\nsudo useradd -m -c \"Fatima Garcia - Finance Analyst\" -s /bin/bash -G finance -e 2027-12-31 fgarcia\n```\n- `-m` create the home folder (copied from `/etc/skel`).\n- `-c` the comment / full name field (quote it: it contains spaces).\n- `-s` login shell.\n- `-G finance` supplementary group(s), comma-separated. The primary group `fgarcia` is created automatically.\n- `-e YYYY-MM-DD` account expiry date.\nNo output means success. Errors look like `useradd: user 'fgarcia' already exists`.\n\n```linux\nsudo passwd fgarcia\n```\nSets the password interactively (typed twice, not shown).\n```text\nNew password:\nRetype new password:\npasswd: password updated successfully\n```\n\n```linux\nsudo chage -d 0 fgarcia\nsudo chage -l fgarcia\n```\n`chage -d 0` sets \"last password change\" to the beginning of time, so the password is treated as expired and must be changed at the next login. `chage -l` shows the result:\n```text\nLast password change                                    : password must be changed\nPassword expires                                        : password must be changed\nAccount expires                                         : Dec 31, 2027\n```\n\n```linux\nsudo passwd -S fgarcia\nls -ld /home/fgarcia\n```\n`passwd -S` prints a status line; the 2nd field is `P` (usable password), `L` (locked) or `NP` (no password).\n```text\nfgarcia P 01/01/1970 0 99999 7 -1\ndrwxr-x--- 2 fgarcia fgarcia 4096 Nov 11 10:30 /home/fgarcia\n```\n\n```linux\nsudo -u fgarcia cat /srv/finance/budget-2027.csv\nsudo -u fgarcia ls /srv/hr\n```\n`sudo -u USER CMD` runs a command **as that user** - the standard way to test access. The first should work, the second must fail with `Permission denied`.\n\n### Your task\n1. Create `fgarcia` exactly as specified in the table.\n2. Give her a temporary password and force a change at first login.\n3. Test as `fgarcia`: she can read `/srv/finance/budget-2027.csv` and cannot list `/srv/hr`.\n\n### Verify\n`id fgarcia`, `getent passwd fgarcia`, `sudo chage -l fgarcia`, `sudo passwd -S fgarcia`, `ls -ld /home/fgarcia`, and the two `sudo -u fgarcia` tests. Then **Check my work**.\n\n### If it fails\n- *useradd: user already exists*: you ran it twice. Fix the existing account with `usermod` (same options) instead of deleting it.\n- *Wrong comment*: `sudo usermod -c \"Fatima Garcia - Finance Analyst\" fgarcia`.\n- *Not in finance*: `sudo usermod -aG finance fgarcia` (remember `-a`).\n- *Expiry wrong*: `sudo chage -E 2027-12-31 fgarcia`.\n- *Home mode not 750*: `sudo chmod 750 /home/fgarcia`.\n- *password must be changed is missing*: run `sudo chage -d 0 fgarcia` **after** `passwd` (setting a password resets that date).\n- Want to start over? **Retry exercise** deletes `fgarcia`.\n\n### Hint 1\nOne `useradd` command with five options can do almost everything in the table. Then two more commands handle the password.\n\n### Hint 2\nOptions: `-m`, `-c \"...\"`, `-s /bin/bash`, `-G finance`, `-e 2027-12-31`. Then `sudo passwd fgarcia`, then `sudo chage -d 0 fgarcia` (order matters).\n\n### Hint 3\n`sudo useradd -m -c \"Fatima Garcia - Finance Analyst\" -s /bin/bash -G finance -e 2027-12-31 fgarcia && sudo passwd fgarcia && sudo chage -d 0 fgarcia`, then check `ls -ld /home/fgarcia` shows `drwxr-x---`.\n\n### Walkthrough\n```linux\nsudo useradd -m -c \"Fatima Garcia - Finance Analyst\" -s /bin/bash -G finance -e 2027-12-31 fgarcia\nsudo passwd fgarcia\nsudo chage -d 0 fgarcia\nsudo chmod 750 /home/fgarcia\nid fgarcia\n```\n```text\nuid=2010(fgarcia) gid=2010(fgarcia) groups=2010(fgarcia),3001(finance)\n```\n```linux\nsudo chage -l fgarcia\nsudo passwd -S fgarcia\nsudo -u fgarcia cat /srv/finance/budget-2027.csv\nsudo -u fgarcia ls /srv/hr\n```\n```text\ncost_center,owner,amount\nCC-100,aokafor,125000\nCC-200,jkim,48000\nls: cannot open directory '/srv/hr': Permission denied\n```\n```linux\nlab check m03-onboard\n```\n**Evidence for the ticket:** paste the `id`, `chage -l` and the two access tests (one allowed, one denied). Testing both directions is what separates \"I created an account\" from \"I granted exactly the approved access\".", "group": "Module 3 exercises"}, {"id": "m03-mover", "title": "m03-mover: Ben moves from Engineering to Web Operations (mover)", "md": "### Ticket\n**HR-3003** - *Approved by: Head of Web Operations* - \"Ben Tran (`btran`) transfers from Engineering to Web Operations effective today. Remove his Engineering role, give him the Web Operations role. He stays on Project Falcon and keeps remote access (`ssh-users`).\"\n\n### Objective\nChange role membership without collateral damage, and prove the old access is gone and the new access works.\n\n### Before you start\nLinux terminal with `sudo`. Folders `/srv/lab03/engineering-design` (group `engineering`) and `/srv/lab03/webops-runbooks` (group `webops`) exist for testing.\n\n### Concepts and commands\n```linux\nid btran\n```\n```text\nuid=2003(btran) gid=2003(btran) groups=2003(btran),3003(engineering),3006(proj-falcon),3008(ssh-users)\n```\n\n```linux\nsudo gpasswd -d btran engineering\n```\n`gpasswd -d USER GROUP` removes one user from one group and nothing else.\n```text\nRemoving user btran from group engineering\n```\n\n```linux\nsudo usermod -aG webops btran\n```\n`-G` sets supplementary groups; `-a` makes it **append**. Without `-a` the command replaces the whole list, silently removing `proj-falcon` and `ssh-users` too. `sudo gpasswd -a btran webops` does the same as `usermod -aG` for a single group.\n\n```linux\nsudo -u btran ls /srv/lab03/webops-runbooks\nsudo -u btran ls /srv/lab03/engineering-design\n```\nTest both directions. A process started *before* the change keeps the old groups - that is why real users must log out and in again, and why leavers' sessions must be killed.\n\n### Your task\n1. Remove `btran` from `engineering`.\n2. Add `btran` to `webops`.\n3. Keep `proj-falcon` and `ssh-users`.\n4. Prove: he can list `/srv/lab03/webops-runbooks` and can no longer list `/srv/lab03/engineering-design`.\n\n### Verify\n`id btran` and the two `sudo -u btran ls` tests. Then **Check my work**.\n\n### If it fails\n- *lost proj-falcon or ssh-users*: you used `usermod -G` without `-a`. Add them back: `sudo usermod -aG proj-falcon,ssh-users btran`.\n- *still in engineering*: `sudo gpasswd -d btran engineering`.\n- *webops folder still denied*: check `id btran` shows `webops`; check the folder with `ls -ld /srv/lab03/webops-runbooks`.\n\n### Hint 1\nOne command removes a single group membership, another appends one. Look at `gpasswd -d` and `usermod -aG`.\n\n### Hint 2\nNever use `usermod -G` without `-a` for a mover - it replaces the entire list.\n\n### Hint 3\n`sudo gpasswd -d btran engineering && sudo usermod -aG webops btran && id btran`.\n\n### Walkthrough\n```linux\nid btran\nsudo gpasswd -d btran engineering\nsudo usermod -aG webops btran\nid btran\n```\n```text\nuid=2003(btran) gid=2003(btran) groups=2003(btran),3006(proj-falcon),3007(webops),3008(ssh-users)\n```\n```linux\nsudo -u btran ls /srv/lab03/webops-runbooks\nsudo -u btran ls /srv/lab03/engineering-design\n```\n```text\nrestart-falcon.md\nls: cannot open directory '/srv/lab03/engineering-design': Permission denied\n```\n```linux\nlab check m03-mover\n```\n**Why it matters:** \"privilege creep\" - movers who keep every old role - is one of the most common access-review findings.", "group": "Module 3 exercises"}, {"id": "m03-service-account", "title": "m03-service-account: Create a service account for the reporting job", "md": "### Ticket\n**OPS-3004** - *Approved by: Finance Manager* - \"The nightly finance report job must stop running as a person's account. Create a dedicated **non-interactive** service account `svc-reports` with a system UID, home folder `/var/lib/svc-reports` (private), no usable password and no login shell. It needs read access to the finance share.\"\n\n### Objective\nUnderstand the difference between human and service (non-human) accounts and create one that cannot be used to log in.\n\n### Before you start\nLinux terminal with `sudo`.\n\n### Concepts and commands\n```linux\nsudo useradd --system --home-dir /var/lib/svc-reports --create-home --shell /usr/sbin/nologin --comment \"Finance reporting job (OPS-3004)\" svc-reports\n```\n- `--system` picks a UID below 1000 (from `SYS_UID_MIN`-`SYS_UID_MAX` in `/etc/login.defs`) and does not set password ageing.\n- `--home-dir` + `--create-home` give the job a place for its files.\n- `--shell /usr/sbin/nologin` blocks interactive logins: anyone who manages to log in is told *This account is currently not available*.\n- No `passwd` step: the password field stays `!` (locked).\n\n```linux\nsudo usermod -aG finance svc-reports\nsudo chmod 750 /var/lib/svc-reports\n```\nGrant the role, make the home private.\n\n```linux\nid svc-reports\ngetent passwd svc-reports\nsudo passwd -S svc-reports\n```\n```text\nuid=998(svc-reports) gid=998(svc-reports) groups=998(svc-reports),3001(finance)\nsvc-reports:x:998:998:Finance reporting job (OPS-3004):/var/lib/svc-reports:/usr/sbin/nologin\nsvc-reports L 11/11/2026 -1 -1 -1 -1\n```\n`L` = locked password. The UID on your VM may differ but is below 1000.\n\n```linux\nsudo -u svc-reports cat /srv/finance/budget-2027.csv\nsudo su - svc-reports\n```\nThe job itself is started by a scheduler or systemd **as** that user (like `sudo -u` does), so it works. `su -` tries to start the login shell, which is `nologin`, so it is refused.\n\n### Your task\n1. Create `svc-reports` as a system account: UID below 1000, home `/var/lib/svc-reports` owned by `svc-reports` with mode `750`, shell `/usr/sbin/nologin`, locked password.\n2. Make it a member of `finance` and nothing else.\n3. Prove it can read `/srv/finance/budget-2027.csv` but cannot read `/srv/hr`.\n\n### Verify\n`id svc-reports`, `sudo passwd -S svc-reports`, `ls -ld /var/lib/svc-reports`, then the access tests. **Check my work**.\n\n### If it fails\n- *UID is 1000 or more*: you forgot `--system`. Delete and recreate: `sudo userdel -r svc-reports`.\n- *password is not locked*: `sudo usermod -L svc-reports` (and never set one).\n- *shell*: `sudo usermod -s /usr/sbin/nologin svc-reports`.\n\n### Hint 1\n`useradd` has options for a system account, a custom home folder and a shell. `man useradd`, search `/system`.\n\n### Hint 2\n`--system --home-dir /var/lib/svc-reports --create-home --shell /usr/sbin/nologin`, then `usermod -aG finance` and `chmod 750` on the home.\n\n### Hint 3\n`sudo useradd --system --home-dir /var/lib/svc-reports --create-home --shell /usr/sbin/nologin --comment \"Finance reporting job\" svc-reports && sudo usermod -aG finance svc-reports && sudo chmod 750 /var/lib/svc-reports`.\n\n### Walkthrough\n```linux\nsudo useradd --system --home-dir /var/lib/svc-reports --create-home --shell /usr/sbin/nologin --comment \"Finance reporting job (OPS-3004)\" svc-reports\nsudo usermod -aG finance svc-reports\nsudo chmod 750 /var/lib/svc-reports\nid svc-reports\nsudo passwd -S svc-reports\nsudo -u svc-reports cat /srv/finance/budget-2027.csv\nsudo -u svc-reports ls /srv/hr\nsudo su - svc-reports\n```\n```text\nls: cannot open directory '/srv/hr': Permission denied\nThis account is currently not available.\n```\n```linux\nlab check m03-service-account\n```\n**Why it matters:** non-human identities usually outnumber people. Each should be owned, documented (the comment field), least-privileged and unable to log in interactively.", "group": "Module 3 exercises"}, {"id": "m03-lockout", "title": "m03-lockout: Two locked-out users - unlock one, refuse the other", "md": "### Ticket\n**HELP-3005** - *From: Service Desk* -\n1. \"Eli Novak (`enovak`) says he can't log in after typing an old password a few times. The desk verified his identity by calling him back on his registered number. Please investigate and unlock.\"\n2. \"Kai Wright (`kwright`) also says his login stopped working and asks us to unlock it.\"\n\nRecord your decisions in `~/lab/m03/lockout.txt`.\n\n### Objective\nTell apart the reasons a login fails (failed-attempt lockout, locked password, expired account), fix the one that is legitimate, and refuse the one that is not.\n\n### Before you start\nLinux terminal with `sudo`. Policy: 5 failures in 15 minutes lock an account until an admin resets it.\n\n### Concepts and commands\n```linux\nsudo faillock --user enovak\n```\nLists recorded failures. `V` in the last column means the record counts towards the lock.\n```text\nenovak:\nWhen                Type  Source                                           Valid\n2026-11-11 10:01:02 RHOST 127.0.0.1                                            V\n...\n```\n\n```linux\nsudo grep enovak /var/log/auth.log | tail -5\n```\nThe authentication log shows *why*:\n```text\n... pam_unix(sshd:auth): authentication failure; ... user=enovak\n... pam_faillock(sshd:auth): Consecutive login failures for user enovak account temporarily locked\n```\n\n```linux\nsudo passwd -S enovak\nsudo chage -l kwright\n```\nRule out other causes: is the password itself locked (`L`)? Is the **account** expired?\n```text\nAccount expires                                         : Dec 31, 2025\n```\nAn expired account is a business decision (the contract ended), not a technical fault.\n\n```linux\nsudo faillock --user enovak --reset\n```\nClears the failure records, which unlocks the account. It does **not** change the password.\n\n### Your task\n1. Find out why `enovak` cannot log in and fix it with the least change (do not change his password).\n2. Find out why `kwright` cannot log in. Decide whether to unlock him.\n3. Create `~/lab/m03/lockout.txt`:\n```text\nenovak_cause=<faillock, password-locked or expired>\nkwright_cause=<faillock, password-locked or expired>\nkwright_action=<unlock or deny>\n```\n\n### Verify\n`sudo faillock --user enovak` shows no valid failures. **Check my work** logs in as `enovak` with his real (lab-held) password, and confirms `kwright` is still refused.\n\n### If it fails\n- *enovak still locked*: reset with `faillock --reset`; `usermod -U` only helps if the **password** was locked.\n- *kwright login now works*: you changed his expiry. The contract ended: set it back with `sudo chage -E 2025-12-31 kwright`.\n\n### Hint 1\nCheck three things for each user: `sudo faillock --user NAME`, `sudo passwd -S NAME`, `sudo chage -l NAME`.\n\n### Hint 2\nOne user has failure records; the other has an account expiry date in the past. Only one of those is a fault you should fix.\n\n### Hint 3\n`sudo faillock --user enovak --reset`; leave `kwright` alone. Answers: `enovak_cause=faillock`, `kwright_cause=expired`, `kwright_action=deny`.\n\n### Walkthrough\n```linux\nsudo faillock --user enovak\nsudo grep -E 'enovak' /var/log/auth.log | tail -5\nsudo passwd -S enovak\nsudo chage -l enovak | grep 'Account expires'\nsudo faillock --user enovak --reset\nsudo faillock --user enovak\nsudo faillock --user kwright\nsudo passwd -S kwright\nsudo chage -l kwright | grep 'Account expires'\nmkdir -p ~/lab/m03\nprintf 'enovak_cause=faillock\\nkwright_cause=expired\\nkwright_action=deny\\n' > ~/lab/m03/lockout.txt\nlab check m03-lockout\n```\n**Reply to the desk:** \"enovak: locked by 6 failed attempts (faillock), reset after identity verification. kwright: account expired 2025-12-31 at contract end - unlock needs a new approved contract (new ticket), not a helpdesk reset.\"", "group": "Module 3 exercises"}, {"id": "m03-offboard", "title": "m03-offboard: Offboard Chloe Diaz (leaver)", "md": "### Ticket\n**HR-3006** - *Approved by: Hana Lopez (HR Manager)* - \"Chloe Diaz (`cdiaz`) leaves today at 17:00. Disable all her access now. Policy LV-1: **do not delete** the account for 30 days (legal hold). Archive her home folder to `/srv/archive/offboarded/cdiaz-home.tar.gz`, and hand any HR files she owns over to me (`hlopez`).\"\n\n### Objective\nRun a complete, verifiable leaver procedure: block every way in (password, SSH key, scheduled jobs, running sessions), remove roles, preserve data and ownership, keep the account for retention.\n\n### Before you start\nLinux terminal with `sudo`. Chloe currently has: a password, an SSH key, the `hr` role, a scheduled job (crontab), a running process, and files under `/srv/hr`.\n\n### Concepts and commands\n```linux\nid cdiaz; sudo chage -l cdiaz; sudo passwd -S cdiaz\nsudo ls -la /home/cdiaz/.ssh\nsudo crontab -l -u cdiaz\npgrep -u cdiaz -l\nsudo find /srv/hr -user cdiaz\n```\nInventory first: you cannot remove access you have not found. `crontab -l -u USER` lists a user's scheduled jobs; `pgrep -u USER -l` lists their running processes; `find -user` finds their files.\n\n```linux\nsudo usermod -L -e 1 -s /usr/sbin/nologin cdiaz\n```\n- `-L` locks the password (puts `!` in front of the hash).\n- `-e 1` sets the account expiry to 2 Jan 1970 - expired. (`sudo chage -E 0 cdiaz` is equivalent.) **Expiry also blocks SSH key logins**, which a password lock alone does not.\n- `-s /usr/sbin/nologin` removes the interactive shell.\n\n```linux\nsudo gpasswd -d cdiaz hr\n```\nRemove every supplementary role (check `id cdiaz` for all of them). `sudo usermod -G \"\" cdiaz` removes all at once.\n\n```linux\nsudo crontab -r -u cdiaz\nsudo pkill -KILL -u cdiaz\n```\n`crontab -r` removes the scheduled jobs; `pkill -u` ends the user's processes (`-KILL` cannot be ignored). On systems with logind you can also use `sudo loginctl terminate-user cdiaz`.\n\n```linux\nsudo mkdir -p /srv/archive/offboarded\nsudo tar -czf /srv/archive/offboarded/cdiaz-home.tar.gz -C /home cdiaz\nsudo tar -tzf /srv/archive/offboarded/cdiaz-home.tar.gz | head\n```\n`tar -c` create, `-z` gzip, `-f` file name, `-C /home` change to `/home` first so the archive contains `cdiaz/...` rather than `/home/cdiaz/...`. `-t` lists the archive to verify it.\n\n```linux\nsudo find /srv/hr -user cdiaz -exec chown hlopez {} +\n```\nTransfers ownership of each file found. `{}` stands for the file names; `+` passes many names per `chown` call.\n\n### Your task\nLeave `cdiaz` **existing** but completely disabled:\n1. Password locked, account expired, shell `/usr/sbin/nologin`.\n2. No supplementary groups.\n3. No crontab, no running processes.\n4. Home archived to `/srv/archive/offboarded/cdiaz-home.tar.gz` (containing `cdiaz/...`).\n5. No files under `/srv/hr` owned by `cdiaz`; they are owned by `hlopez` now.\n6. Her SSH key must no longer work (test it via the check).\n\n### Verify\nRe-run the inventory commands from the first block; each should come back empty or show the disabled state. **Check my work** also tries a real SSH key login and a password login as `cdiaz` - both must be refused.\n\n### If it fails\n- *SSH key login still works*: a password lock (`-L`) does not stop keys. Expire the account (`chage -E 0`) and/or remove `~cdiaz/.ssh/authorized_keys`.\n- *process still running*: `pgrep -u cdiaz -l`, then `sudo pkill -KILL -u cdiaz`.\n- *archive check fails*: list it with `tar -tzf`. Paths must start with `cdiaz/`.\n- *account deleted*: policy says keep it - press **Retry exercise**.\n\n### Hint 1\nWork through the list in order and re-check each item: password, expiry, shell, groups, cron, processes, archive, file ownership.\n\n### Hint 2\n`usermod -L -e 1 -s /usr/sbin/nologin cdiaz` does the first three in one go; `crontab -r -u`, `pkill -KILL -u`, `tar -czf ... -C /home cdiaz`, and `find /srv/hr -user cdiaz -exec chown hlopez {} +` do the rest.\n\n### Hint 3\nSee the Walkthrough - but try the inventory commands yourself first; finding *everything* is the real skill.\n\n### Walkthrough\n```linux\nid cdiaz; sudo crontab -l -u cdiaz; pgrep -u cdiaz -l; sudo find /srv/hr -user cdiaz\nsudo usermod -L -e 1 -s /usr/sbin/nologin cdiaz\nsudo usermod -G \"\" cdiaz\nsudo crontab -r -u cdiaz\nsudo pkill -KILL -u cdiaz\nsudo mkdir -p /srv/archive/offboarded\nsudo tar -czf /srv/archive/offboarded/cdiaz-home.tar.gz -C /home cdiaz\nsudo tar -tzf /srv/archive/offboarded/cdiaz-home.tar.gz | head -3\nsudo find /srv/hr -user cdiaz -exec chown hlopez {} +\nid cdiaz; sudo passwd -S cdiaz; sudo chage -l cdiaz | grep 'Account expires'; pgrep -u cdiaz -l\n```\n```text\nuid=2004(cdiaz) gid=2004(cdiaz) groups=2004(cdiaz)\ncdiaz L 11/11/2026 0 99999 7 -1\nAccount expires                                         : Jan 02, 1970\n```\n```linux\nlab check m03-offboard\n```\n**Evidence for the ticket:** the before/after inventory, the archive listing, and the failed login tests. After 30 days, a second ticket deletes the account with `sudo userdel -r cdiaz`.", "group": "Module 3 exercises"}, {"id": "m04", "title": "Module 4: Control access to files and directories", "md": "*Ownership, symbolic and numeric permissions, directory traversal, umask, setgid shared folders and ACLs - tested as two users with different entitlements.*\n\nGroups decide **who** has a role; file permissions decide **what** that role can touch. Every \"I can't open the share\" ticket ends here.\n\n## Reading `ls -l`\n\n```text\n-rw-r----- 1 aokafor finance 812 Nov 11 10:00 payroll.csv\ndrwxrws--- 2 root    finance 4096 Nov 11 10:00 finance-team\n```\n| Part | Meaning |\n|---|---|\n| first character | `-` file, `d` directory, `l` symbolic link |\n| next 9 characters | three triplets: **u**ser (owner), **g**roup, **o**thers - each `r` read, `w` write, `x` execute |\n| `aokafor finance` | owner and group |\n\nThe kernel checks **one** triplet: owner if you are the owner; else group if you are in the group; else others. It does not \"add them up\".\n\n## What r, w, x mean\n\n| | On a file | On a directory |\n|---|---|---|\n| `r` | read the content | list the names inside (`ls`) |\n| `w` | change the content | create, delete, rename entries inside |\n| `x` | run it as a program | **enter / pass through** it (`cd`, or reach anything below it) |\n\nTo open `/srv/a/b/file.txt` you need `x` on `/srv`, `/srv/a`, `/srv/a/b` **and** `r` on the file. `namei -l /srv/a/b/file.txt` shows every step - the fastest way to find the broken link in the chain.\n\n## Changing permissions\n\nNumeric (octal): `r=4, w=2, x=1`, add them per triplet.\n\n| Mode | Means | Typical use |\n|---|---|---|\n| `640` | `rw-r-----` | confidential file: owner edits, group reads |\n| `660` | `rw-rw----` | team-editable file |\n| `750` | `rwxr-x---` | private folder the group may enter and list |\n| `2770` | `rwxrws---` | shared team folder (`2` = setgid, see below) |\n\nSymbolic: `chmod g+w file`, `chmod o-rwx dir`, `chmod u=rw,g=r,o= file`, `chmod -R g+rX dir` (`X` = execute only on directories).\n\nOwnership: `sudo chown aokafor:finance payroll.csv` (owner and group), `sudo chgrp finance file`.\n\n## Special bits\n\n- **setgid on a directory** (`chmod g+s`, the `2` in `2770`): new files inside get the directory's **group** instead of the creator's primary group. Essential for team folders.\n- **sticky bit** (`chmod +t`, `1777` on `/tmp`): in a writable folder, only a file's owner can delete it.\n- **setuid on a program** (`4755`, e.g. `/usr/bin/passwd`): it runs with the owner's (root's) privileges. Unexpected setuid files are a red flag: `find / -perm -4000 -type f 2>/dev/null`.\n\n## umask\n\n`umask` removes permissions from new files. With the default `022`, new files are `644` and folders `755` - **others can read**. With `027` new files are `640`. Check with `umask`; it is set per user/session (for example in `~/.profile` or `/etc/login.defs`).\n\n## ACLs (access control lists)\n\nWhen owner/group/others is not enough - \"the auditor needs read access, but must not join HR\" - add named entries:\n\n```linux\nsudo setfacl -m u:rmorgan:r-- /srv/hr/reviews/2026-q4.txt\ngetfacl /srv/hr/reviews/2026-q4.txt\n```\n```text\nuser::rw-\nuser:rmorgan:r--\ngroup::rw-\nmask::rw-\nother::---\n```\n- `-m` modify/add, `-x` remove an entry, `-b` remove all ACLs, `-R` recursive, `-d` set the **default** ACL that new files in a directory inherit.\n- A `+` at the end of the `ls -l` mode (`-rw-rw----+`) means \"this file has an ACL - run `getfacl`\".\n- The **mask** caps what named users and groups can get. `chmod g-w` on a file with an ACL lowers the mask.\n\n## Test as the user\n\nAlways prove access with the real identity: `sudo -u btran cat FILE` (allowed?) and `sudo -u dpatel cat FILE` (denied?). Two users, two results - that is your evidence.\n", "group": "Lessons"}, {"id": "m04-permissions", "title": "m04-permissions: The payroll file is readable by everyone", "md": "### Ticket\n**FIN-4001** - *From: Amara Okafor (Finance Manager)* - \"`/srv/lab04/payroll-2026-11.csv` was copied to the server by root and **anyone** can read it. I own this data. I must be able to edit it, my finance team may read it, nobody else may see it.\"\n\n### Objective\nFix ownership and permissions with `chown` and `chmod`, then prove the result as three different users.\n\n### Before you start\nLinux terminal with `sudo`. Users: `aokafor` (owner, finance), `jkim` (finance), `btran` (not finance).\n\n### Concepts and commands\n```linux\nls -l /srv/lab04/payroll-2026-11.csv\n```\n```text\n-rw-r--r-- 1 root root 96 Nov 11 10:00 /srv/lab04/payroll-2026-11.csv\n```\nOwner `root`, group `root`, and `r--` for others: everyone can read.\n\n```linux\nsudo chown aokafor:finance /srv/lab04/payroll-2026-11.csv\n```\n`chown OWNER:GROUP FILE` - changes both at once. Only root can give a file away.\n\n```linux\nsudo chmod 640 /srv/lab04/payroll-2026-11.csv\n```\n`6` = `rw-` for the owner, `4` = `r--` for the group, `0` = `---` for others. Symbolic equivalent: `chmod u=rw,g=r,o= FILE`.\n\n```linux\nsudo -u jkim cat /srv/lab04/payroll-2026-11.csv\nsudo -u btran cat /srv/lab04/payroll-2026-11.csv\n```\n```text\ncat: /srv/lab04/payroll-2026-11.csv: Permission denied\n```\nThe second must be denied.\n\n```linux\nsudo -u jkim sh -c 'echo test >> /srv/lab04/payroll-2026-11.csv'\n```\nTests **write** access as jkim (it should be denied). `sh -c '...'` is needed so the `>>` redirection runs as jkim, not as you.\n\n### Your task\n1. Owner `aokafor`, group `finance`.\n2. Owner read+write, group read only, others nothing.\n3. Prove: aokafor can read and write; jkim can read but not write; btran cannot read.\n\n### Verify\n`ls -l` should show `-rw-r----- 1 aokafor finance`. Run the tests above. **Check my work** runs them for you.\n\n### If it fails\n- *`chown: changing ownership ... Operation not permitted`*: you forgot `sudo`.\n- *jkim denied reading*: is jkim in finance (`id jkim`)? Is the group `finance`?\n- *btran can read*: others still have `r` - remove it (`chmod o-r`).\n\n### Hint 1\nTwo commands: one changes owner and group, one changes the mode.\n\n### Hint 2\nThe mode is three digits: owner rw (4+2), group r (4), others none (0).\n\n### Hint 3\n`sudo chown aokafor:finance /srv/lab04/payroll-2026-11.csv && sudo chmod 640 /srv/lab04/payroll-2026-11.csv`.\n\n### Walkthrough\n```linux\nls -l /srv/lab04/payroll-2026-11.csv\nsudo chown aokafor:finance /srv/lab04/payroll-2026-11.csv\nsudo chmod 640 /srv/lab04/payroll-2026-11.csv\nls -l /srv/lab04/payroll-2026-11.csv\nsudo -u aokafor cat /srv/lab04/payroll-2026-11.csv\nsudo -u jkim cat /srv/lab04/payroll-2026-11.csv\nsudo -u jkim sh -c 'echo test >> /srv/lab04/payroll-2026-11.csv'\nsudo -u btran cat /srv/lab04/payroll-2026-11.csv\nlab check m04-permissions\n```\n```text\n-rw-r----- 1 aokafor finance 96 Nov 11 10:00 /srv/lab04/payroll-2026-11.csv\nsh: 1: cannot create /srv/lab04/payroll-2026-11.csv: Permission denied\ncat: /srv/lab04/payroll-2026-11.csv: Permission denied\n```", "group": "Module 4 exercises"}, {"id": "m04-traversal", "title": "m04-traversal: Ben can't open the Falcon spec (directory traversal)", "md": "### Ticket\n**ENG-4002** - *From: Ben Tran* - \"I'm on Project Falcon but `cat /srv/lab04/falcon/specs/spec-v2.txt` says Permission denied. The file itself looks fine?!\" - *Note from the data owner:* only `proj-falcon` members may get in; Dev from Helpdesk (`dpatel`) must stay out.\n\n### Objective\nDiagnose a \"Permission denied\" that is caused by a **directory** in the path, using `namei -l`, and fix it without opening access to others.\n\n### Before you start\nLinux terminal with `sudo`. `btran` is in `proj-falcon`; `dpatel` is not.\n\n### Concepts and commands\n```linux\nsudo -u btran cat /srv/lab04/falcon/specs/spec-v2.txt\n```\n```text\ncat: /srv/lab04/falcon/specs/spec-v2.txt: Permission denied\n```\n\n```linux\nnamei -l /srv/lab04/falcon/specs/spec-v2.txt\n```\n`namei` walks the path one component at a time; `-l` shows each one's permissions and owners. Read it top to bottom as btran: which step does not grant him `x` (directories) or `r` (the file)?\n```text\nf: /srv/lab04/falcon/specs/spec-v2.txt\ndrwxr-xr-x root root        /\ndrwxr-xr-x root root        srv\ndrwxr-xr-x root root        lab04\ndrwxrw---- root proj-falcon falcon\ndrwxrws--- root proj-falcon specs\n-rw-r----- root proj-falcon spec-v2.txt\n```\n`falcon` gives the group `rw-` but **no `x`**: btran can see the names inside but cannot pass through.\n\n```linux\nsudo chmod g+x /srv/lab04/falcon\n```\nAdds only the group execute (traverse) bit. Others stay at `---`.\n\n```linux\nstat -c '%A %a %U:%G %n' /srv/lab04/falcon\n```\n`stat -c` prints chosen fields: symbolic mode, octal mode, owner:group, name.\n\n### Your task\n1. Find which path component blocks `btran`.\n2. Fix it so proj-falcon members can read `spec-v2.txt`.\n3. Do not give anything to \"others\": `dpatel` must still be denied.\n\n### Verify\n`sudo -u btran cat ...` works; `sudo -u dpatel cat ...` is denied. **Check my work**.\n\n### If it fails\n- *dpatel can read too*: you added permissions for others (`o+x`/`o+r`). Remove them: `sudo chmod o-rwx /srv/lab04/falcon`.\n- *still denied for btran*: run `namei -l` again and check every directory has `x` for the group, and that `id btran` lists `proj-falcon`.\n\n### Hint 1\nThe file's own permissions are fine. Look at the folders above it with `namei -l`.\n\n### Hint 2\nOn a directory, `r` lists names but `x` is what lets you go through it. One folder is missing `x` for its group.\n\n### Hint 3\n`sudo chmod g+x /srv/lab04/falcon`.\n\n### Walkthrough\n```linux\nsudo -u btran cat /srv/lab04/falcon/specs/spec-v2.txt\nnamei -l /srv/lab04/falcon/specs/spec-v2.txt\nsudo chmod g+x /srv/lab04/falcon\nnamei -l /srv/lab04/falcon/specs/spec-v2.txt\nsudo -u btran cat /srv/lab04/falcon/specs/spec-v2.txt\nsudo -u dpatel cat /srv/lab04/falcon/specs/spec-v2.txt\nlab check m04-traversal\n```\n```text\nFalcon spec v2 (fictional)\ncat: /srv/lab04/falcon/specs/spec-v2.txt: Permission denied\n```\n**Why it matters:** many \"access broken\" tickets are a single missing `x` on a parent folder. Fix the narrowest thing; never \"fix\" it with `chmod -R 777`.", "group": "Module 4 exercises"}, {"id": "m04-shared-dir", "title": "m04-shared-dir: Build a shared folder for the finance team", "md": "### Ticket\n**FIN-4003** - *Approved by: Finance Manager* - \"Create `/srv/finance-team` where everyone in `finance` can create files and edit **each other's** files. Nobody outside finance may even list it. Last time we tried, Jae couldn't edit Amara's files.\"\n\n### Objective\nCombine group ownership, the **setgid** bit and a **default ACL** so collaboration works regardless of each user's `umask`; test it as two finance members and one outsider.\n\n### Before you start\nLinux terminal with `sudo`. Finance members: `aokafor`, `jkim`. Outsider: `btran`.\n\n### Concepts and commands\n```linux\nsudo mkdir /srv/finance-team\nsudo chown root:finance /srv/finance-team\nsudo chmod 2770 /srv/finance-team\nls -ld /srv/finance-team\n```\n```text\ndrwxrws--- 2 root finance 4096 Nov 11 10:00 /srv/finance-team\n```\n`2770`: owner and group get `rwx`, others nothing, and the leading `2` sets **setgid** - shown as `s` in the group triplet. New files inside will belong to group `finance` instead of the creator's own private group.\n\nWhy that is not enough: users have `umask 022`, so a new file is `rw-r--r--` - the group can read but **not write**. That is the \"Jae couldn't edit\" bug.\n\n```linux\nsudo setfacl -d -m g:finance:rwX /srv/finance-team\ngetfacl /srv/finance-team\n```\n`-d` sets a **default ACL**: every new file and folder created inside inherits it, and the creator's umask no longer strips the group's write bit. `rwX`: read, write, and execute only for directories.\n```text\n# file: srv/finance-team\n# owner: root\n# group: finance\n# flags: -s-\nuser::rwx\ngroup::rwx\nother::---\ndefault:user::rwx\ndefault:group::rwx\ndefault:group:finance:rwx\ndefault:mask::rwx\ndefault:other::---\n```\n\n```linux\nsudo -u aokafor sh -c 'echo \"draft\" > /srv/finance-team/forecast.txt'\nls -l /srv/finance-team/forecast.txt\nsudo -u jkim sh -c 'echo \"edited by jkim\" >> /srv/finance-team/forecast.txt'\nsudo -u btran ls /srv/finance-team\n```\nCreate as one member, edit as another, list as an outsider.\n\n### Your task\n1. Create `/srv/finance-team` owned by `root:finance`, mode `2770`.\n2. Make sure files created inside by any finance member are writable by the other members (default ACL).\n3. Test: aokafor creates a file, jkim appends to it, btran cannot list the folder. Clean up your test files afterwards if you like.\n\n### Verify\n`ls -ld`, `getfacl`, and the three tests. **Check my work** repeats the tests with new files.\n\n### If it fails\n- *new file has group aokafor*: the setgid bit is missing (`chmod g+s`).\n- *jkim cannot append*: the default ACL is missing - `getfacl` must show `default:group:finance:rwx`.\n- *btran can list*: others have permissions; `chmod o-rwx`.\n\n### Hint 1\nThree ingredients: the right group owner, the setgid bit on the folder, and a default ACL.\n\n### Hint 2\n`chmod 2770` gives the setgid bit plus rwx for owner and group. `setfacl -d -m g:finance:rwX DIR` handles the write bit for future files.\n\n### Hint 3\n`sudo mkdir -p /srv/finance-team && sudo chown root:finance /srv/finance-team && sudo chmod 2770 /srv/finance-team && sudo setfacl -d -m g:finance:rwX /srv/finance-team`.\n\n### Walkthrough\n```linux\nsudo mkdir -p /srv/finance-team\nsudo chown root:finance /srv/finance-team\nsudo chmod 2770 /srv/finance-team\nsudo setfacl -d -m g:finance:rwX /srv/finance-team\ngetfacl /srv/finance-team\nsudo -u aokafor sh -c 'echo draft > /srv/finance-team/forecast.txt'\nsudo ls -l /srv/finance-team\nsudo -u jkim sh -c 'echo \"edited by jkim\" >> /srv/finance-team/forecast.txt'\nsudo -u btran ls /srv/finance-team\nlab check m04-shared-dir\n```\n```text\n-rw-rw----+ 1 aokafor finance 6 Nov 11 10:05 forecast.txt\nls: cannot open directory '/srv/finance-team': Permission denied\n```\nThe `+` shows the file inherited an ACL; the group is `finance` thanks to setgid.", "group": "Module 4 exercises"}, {"id": "m04-acl", "title": "m04-acl: Read-only access for the auditor (ACLs)", "md": "### Ticket\n**AUD-4004** - *Approved by: Hana Lopez (HR Manager)* - \"Internal Audit (Riley Morgan, `rmorgan`) needs **read-only** access to the performance reviews in `/srv/hr/reviews`, including reviews we add later, until the audit ends. Riley must **not** join the HR group and must not see anything else in `/srv/hr`.\"\n\n### Objective\nGrant a precise, individual exception with POSIX ACLs - including inheritance for future files and traverse-only access on the parent - and test it from both sides.\n\n### Before you start\nLinux terminal with `sudo`. `/srv/hr` and `/srv/hr/reviews` are `2770 root:hr`. HR staff: `hlopez`. Auditor: `rmorgan`. Outsider: `dpatel`.\n\n### Concepts and commands\n```linux\nsudo -u rmorgan cat /srv/hr/reviews/2026-q4-reviews.txt\n```\n```text\ncat: /srv/hr/reviews/2026-q4-reviews.txt: Permission denied\n```\n\n```linux\nsudo setfacl -m u:rmorgan:--x /srv/hr\n```\nTraverse only: rmorgan can pass **through** `/srv/hr` to reach `reviews`, but cannot list `/srv/hr` or open other files there.\n\n```linux\nsudo setfacl -R -m u:rmorgan:rX /srv/hr/reviews\n```\n`-R` applies to the folder and everything already in it; `rX` = read, plus execute on directories only (so files do not become executable).\n\n```linux\nsudo setfacl -d -m u:rmorgan:rX /srv/hr/reviews\n```\n`-d` default ACL: files created later inherit read access for rmorgan.\n\n```linux\ngetfacl /srv/hr/reviews\nls -l /srv/hr/reviews\n```\n```text\nuser::rwx\nuser:rmorgan:r-x\ngroup::rwx\nmask::rwx\nother::---\ndefault:user::rwx\ndefault:user:rmorgan:r-x\ndefault:group::rwx\ndefault:mask::rwx\ndefault:other::---\n```\n`ls -l` shows a `+` after the mode of entries that carry an ACL.\n\n```linux\nsudo setfacl -x u:rmorgan /srv/hr\n```\nFor later: `-x` removes a single entry - how you revoke the access when the audit ends (`-R` and `-d` variants for the folder).\n\n### Your task\n1. rmorgan can read every existing file in `/srv/hr/reviews` and any **new** file created there later.\n2. rmorgan cannot modify anything there.\n3. rmorgan cannot list `/srv/hr` or read other HR files (for example `/srv/hr/salaries-2026.txt`).\n4. rmorgan is **not** added to `hr`. HR staff keep their access; `dpatel` stays out.\n\n### Verify\nAs rmorgan: `cat` a review (works), `ls /srv/hr` (denied), `cat /srv/hr/salaries-2026.txt` (denied), append to a review (denied). **Check my work** also creates a brand-new review as hlopez and reads it as rmorgan.\n\n### If it fails\n- *rmorgan cannot reach reviews*: the parent `/srv/hr` needs `x` for rmorgan.\n- *rmorgan can list /srv/hr*: you gave `r` on `/srv/hr`; use `--x` only.\n- *new reviews unreadable*: add the **default** ACL (`-d`).\n- *rmorgan can write*: you granted `rw`; set `rX` instead (`setfacl -R -m u:rmorgan:rX ...`).\n\n### Hint 1\nYou need three ACL changes: one on `/srv/hr`, two on `/srv/hr/reviews` (current content and future content).\n\n### Hint 2\nParent: `u:rmorgan:--x`. Reviews: `-R -m u:rmorgan:rX` and `-d -m u:rmorgan:rX`.\n\n### Hint 3\n`sudo setfacl -m u:rmorgan:--x /srv/hr && sudo setfacl -R -m u:rmorgan:rX /srv/hr/reviews && sudo setfacl -d -m u:rmorgan:rX /srv/hr/reviews`.\n\n### Walkthrough\n```linux\nsudo setfacl -m u:rmorgan:--x /srv/hr\nsudo setfacl -R -m u:rmorgan:rX /srv/hr/reviews\nsudo setfacl -d -m u:rmorgan:rX /srv/hr/reviews\ngetfacl /srv/hr/reviews\nsudo -u rmorgan cat /srv/hr/reviews/2026-q4-reviews.txt\nsudo -u rmorgan ls /srv/hr\nsudo -u rmorgan cat /srv/hr/salaries-2026.txt\nsudo -u rmorgan sh -c 'echo x >> /srv/hr/reviews/2026-q4-reviews.txt'\nid rmorgan\nlab check m04-acl\n```\n```text\nQ4 reviews (fictional)\nls: cannot open directory '/srv/hr': Permission denied\ncat: /srv/hr/salaries-2026.txt: Permission denied\nsh: 1: cannot create /srv/hr/reviews/2026-q4-reviews.txt: Permission denied\nuid=2007(rmorgan) gid=2007(rmorgan) groups=2007(rmorgan),3005(auditors)\n```\n**Why it matters:** ACLs are precise but invisible in a plain `ls -l` (only a `+`). Access reviews must include `getfacl -R`, or exceptions like this one are never revoked.", "group": "Module 4 exercises"}, {"id": "m05", "title": "Module 5: Delegate administrative privileges", "md": "*sudo, visudo, command-scoped rules, least privilege, verifying who can run what, and recovering when a bad edit breaks sudo.*\n\n`root` can do anything. Nobody should log in as root; instead **sudo** lets named people run named commands as root, with their own password, and **logs every use**. Designing and reviewing sudo rules is daily privileged-access work.\n\n## How a sudo rule reads\n\n```text\n%helpdesk  ALL = (root)  /usr/bin/systemctl restart falcon-web.service\n   WHO     HOST  AS-WHOM  WHICH COMMAND(S)\n```\n- **WHO**: a user (`dpatel`) or a group (`%helpdesk`).\n- **HOST**: `ALL` here; rules can be shared across servers.\n- **AS-WHOM**: `(root)`, or `(ALL)` for any user. `(ALL:ALL)` also allows any group.\n- **COMMANDS**: full paths. With arguments listed, **only those exact arguments** are allowed. Without arguments, **any** arguments are allowed.\n- `NOPASSWD:` before the command skips the password prompt - acceptable for automation, risky for people.\n\nUbuntu's default `/etc/sudoers` contains `%sudo ALL=(ALL:ALL) ALL`: members of group `sudo` are full administrators. Extra rules live as separate files in `/etc/sudoers.d/` (file names must not contain `.` or end in `~`, and files must be mode `0440`).\n\n## Always edit with visudo\n\n```linux\nsudo visudo -f /etc/sudoers.d/50-helpdesk-falcon\n```\n`visudo` locks the file, opens an editor (nano here) and **refuses to save a file with a syntax error** (\"What now?\" - press `e` to edit again, `x` to discard). Editing sudoers files with a plain editor can break sudo for everyone.\n\n```linux\nsudo visudo -c\n```\nChecks every sudoers file and prints `parsed OK` for each.\n\n## Who can run what?\n\n```linux\nsudo -l\nsudo -l -U dpatel\nsudo -l -U dpatel /usr/bin/systemctl stop falcon-web.service\ngetent group sudo\nsudo grep -rv '^#' /etc/sudoers /etc/sudoers.d/ | grep -v '^\\S*:$'\n```\n- `sudo -l` lists your own rights; `-U USER` lists someone else's (needs root).\n- Adding a command after `-l -U USER` asks \"may USER run exactly this?\" - it prints the command if yes, nothing and exit code 1 if no.\n- Do not forget group-based rights: members of `sudo` (and `admin` on old systems) are full admins.\n\n## Dangerous rules (privilege escalation)\n\nMany programs can start a shell or write any file. Allowing them via sudo is the same as giving full root:\n- editors: `vim`, `vi`, `nano`, `less`, `more` (`:!bash` in vim)\n- `find` (`-exec`), `awk`, `tar` (`--checkpoint-action`), `rsync` (`-e`), `cp`/`tee`/`dd` (overwrite `/etc/sudoers`)\n- `systemctl` **without** fixed arguments, `bash`, `sh`, `su`, `python3`, wildcards (`*`) in arguments\n\nPrefer fixed commands with fixed arguments, or `sudoedit` for file edits.\n\n## Logging\n\nEach sudo use is logged:\n```text\nNov 11 10:12:01 iamlab01 sudo:   dpatel : TTY=pts/1 ; PWD=/home/dpatel ; USER=root ; COMMAND=/usr/bin/systemctl restart falcon-web.service\nNov 11 10:13:44 iamlab01 sudo:   dpatel : command not allowed ; TTY=pts/1 ; PWD=/home/dpatel ; USER=root ; COMMAND=/usr/bin/systemctl stop falcon-web.service\n```\n`sudo journalctl _COMM=sudo` or `sudo grep 'sudo:' /var/log/auth.log`.\n\n## If you lock yourself out\n\nPractise changes in a **second** terminal and keep the first one open with a working `sudo -s` until you have tested. If sudo is broken anyway:\n- real servers: console access, recovery mode, or another administrator;\n- this lab: **Progress & lab tools > Fix broken sudo policy** in the portal, or `lab rescue sudoers` - a logged break-glass action that quarantines invalid files.\n", "group": "Lessons"}, {"id": "m05-sudo-review", "title": "m05-sudo-review: Who can run what as root?", "md": "### Ticket\n**AUD-5001** - *From: Internal Audit* - \"Privileged access review for `iamlab01`: who are the full administrators, what can the helpdesk analyst Dev Patel run as root, and is any rule risky? Answers in `~/lab/m05/sudo-review.txt`.\"\n\n### Objective\nEnumerate sudo rights from group membership and rule files, query a user's rights with `sudo -l -U`, and recognise a privilege-escalation risk.\n\n### Before you start\nLinux terminal with `sudo`. This exercise only **reads**; the next one fixes what you find.\n\n### Concepts and commands\n```linux\ngetent group sudo\n```\n```text\nsudo:x:27:student\n```\nMembers of `sudo` match `%sudo ALL=(ALL:ALL) ALL` in `/etc/sudoers`.\n\n```linux\nsudo ls -l /etc/sudoers.d/\nsudo cat /etc/sudoers.d/40-legacy-helpdesk\n```\n```text\n# Legacy rule from 2019 - \"helpdesk needs to edit hosts\"\ndpatel ALL=(root) NOPASSWD: /usr/bin/vim /etc/hosts\n```\n\n```linux\nsudo -l -U dpatel\n```\n```text\nUser dpatel may run the following commands on iamlab01:\n    (root) NOPASSWD: /usr/bin/vim /etc/hosts\n```\n\n**Why this is risky:** inside vim, `:!bash` starts a shell - *as root*. `vim` can also `:e /etc/shadow`. A rule for \"edit one file\" is really full root. The safe pattern is `sudoedit /etc/hosts` (it edits a temporary copy as the user).\n\n### Your task\nCreate `~/lab/m05/sudo-review.txt`:\n```text\nsudo_group_members=<members of group sudo, comma-separated, sorted>\ndpatel_command=<the program dpatel may run as root, full path, without arguments>\ndpatel_needs_password=<yes or no>\nrisky_rule_file=<full path of the file that contains dpatel's rule>\nwhy_risky=<a few words: why that rule is dangerous>\n```\n\n### Verify\nRe-run `sudo -l -U dpatel` and `getent group sudo`. **Check my work** compares your answers to the live configuration.\n\n### If it fails\n- *sudo_group_members*: only the 4th field of `getent group sudo`.\n- *dpatel_command*: just the program path, e.g. `/usr/bin/something`.\n- *why_risky*: mention that the editor can start a shell / escape to root.\n\n### Hint 1\n`getent group sudo` and `sudo -l -U dpatel` answer most questions. `NOPASSWD:` answers one.\n\n### Hint 2\n`sudo grep -l dpatel /etc/sudoers.d/*` tells you which file contains the rule.\n\n### Hint 3\n`dpatel_command=/usr/bin/vim`, `dpatel_needs_password=no`, `risky_rule_file=/etc/sudoers.d/40-legacy-helpdesk`, `why_risky=vim can run a shell escape as root`.\n\n### Walkthrough\n```linux\ngetent group sudo\nsudo ls -l /etc/sudoers.d/\nsudo grep -l dpatel /etc/sudoers.d/*\nsudo -l -U dpatel\nmkdir -p ~/lab/m05\ncat > ~/lab/m05/sudo-review.txt <<'EOF'\nsudo_group_members=student\ndpatel_command=/usr/bin/vim\ndpatel_needs_password=no\nrisky_rule_file=/etc/sudoers.d/40-legacy-helpdesk\nwhy_risky=vim can run a shell escape (:!bash) as root, so the rule equals full root\nEOF\nlab check m05-sudo-review\n```", "group": "Module 5 exercises"}, {"id": "m05-delegate", "title": "m05-delegate: Let the helpdesk restart Falcon - nothing more", "md": "### Ticket\n**OPS-5002** - *Approved by: Head of IT Operations* - \"The helpdesk team must be able to **restart** the falcon-web service and **view its status** outside office hours. Nothing else. Replace the legacy vim rule found in AUD-5001. Grant it to the helpdesk **group**, with their own password, so new helpdesk staff get it automatically.\"\n\n### Objective\nWrite a least-privilege, command-scoped sudo rule with `visudo`, remove an over-broad one, and verify with both `sudo -l -U` and a real allowed/denied test.\n\n### Before you start\nLinux terminal with `sudo`. `dpatel` is the only member of `helpdesk`. Keep this terminal open while you work; if sudo breaks, see the module lesson (\"If you lock yourself out\").\n\n### Concepts and commands\n```linux\nsudo visudo -f /etc/sudoers.d/50-helpdesk-falcon\n```\nCreates the file safely. Type the rule, save (`Ctrl+O`, Enter), exit (`Ctrl+X`). If you made a syntax error visudo asks *What now?* - press `e` to fix it.\n```text\n# OPS-5002: helpdesk may restart and check the Falcon web service only\nCmnd_Alias FALCON_OPS = /usr/bin/systemctl restart falcon-web.service, \\\n                        /usr/bin/systemctl status falcon-web.service\n%helpdesk ALL=(root) FALCON_OPS\n```\n- `Cmnd_Alias NAME = cmd1, cmd2` names a list of commands (alias names are UPPERCASE). `\\` continues the line.\n- Each command has its **exact arguments**, so `systemctl stop ...` or `systemctl restart sshd` do not match.\n- No `NOPASSWD:` - people re-enter their own password, which also confirms it is really them.\n\n```linux\nsudo rm /etc/sudoers.d/40-legacy-helpdesk\nsudo visudo -c\nls -l /etc/sudoers.d/\n```\n`visudo -c` must report `parsed OK` for every file. Files should be `-r--r----- root root` (0440); visudo creates them that way.\n\n```linux\nsudo -l -U dpatel\nsudo -l -U dpatel /usr/bin/systemctl stop falcon-web.service; echo \"exit code $?\"\n```\n```text\nUser dpatel may run the following commands on iamlab01:\n    (root) /usr/bin/systemctl restart falcon-web.service, /usr/bin/systemctl status falcon-web.service\nexit code 1\n```\nExit code `1` with no output = not allowed.\n\n### Your task\n1. Remove the legacy rule `/etc/sudoers.d/40-legacy-helpdesk`.\n2. Create `/etc/sudoers.d/50-helpdesk-falcon` with visudo granting group `helpdesk` exactly: `systemctl restart falcon-web.service` and `systemctl status falcon-web.service`, as root, **with** password.\n3. Confirm `sudo visudo -c` passes and check dpatel's rights.\n\n### Verify\n`sudo -l -U dpatel` shows exactly two commands and no `NOPASSWD`. **Check my work** then logs in as dpatel with his password and really restarts the service (allowed), tries to stop it (must be denied) and tries vim (denied).\n\n### If it fails\n- *`>>> /etc/sudoers.d/50-helpdesk-falcon: syntax error near line N <<<`*: commas between commands, closing `)` after `root`, `\\` must be the last character on its line.\n- *dpatel still allowed vim*: the legacy file still exists.\n- *restart denied*: the path must be `/usr/bin/systemctl` and the unit exactly `falcon-web.service` (users must type the same form: `sudo systemctl restart falcon-web.service`).\n- *NOPASSWD found*: remove it; the ticket asks for password re-entry.\n\n### Hint 1\nTwo changes: delete one file in `/etc/sudoers.d/`, create another with `sudo visudo -f`.\n\n### Hint 2\nA group rule starts with `%helpdesk`. List both commands with full paths and exact arguments, separated by a comma (a `Cmnd_Alias` keeps it readable).\n\n### Hint 3\nFile content: `%helpdesk ALL=(root) /usr/bin/systemctl restart falcon-web.service, /usr/bin/systemctl status falcon-web.service`.\n\n### Walkthrough\n```linux\nsudo rm /etc/sudoers.d/40-legacy-helpdesk\nsudo visudo -f /etc/sudoers.d/50-helpdesk-falcon\n```\nType:\n```text\n# OPS-5002: helpdesk may restart and check the Falcon web service only\nCmnd_Alias FALCON_OPS = /usr/bin/systemctl restart falcon-web.service, /usr/bin/systemctl status falcon-web.service\n%helpdesk ALL=(root) FALCON_OPS\n```\n```linux\nsudo visudo -c\nls -l /etc/sudoers.d/\nsudo -l -U dpatel\nsudo -l -U dpatel /usr/bin/systemctl stop falcon-web.service; echo \"exit code $?\"\nsudo -l -U dpatel /usr/bin/vim /etc/hosts; echo \"exit code $?\"\nlab check m05-delegate\n```\n```text\n/etc/sudoers: parsed OK\n/etc/sudoers.d/00-labctl: parsed OK\n/etc/sudoers.d/50-helpdesk-falcon: parsed OK\n```\n**Evidence:** the rule file, `visudo -c`, `sudo -l -U dpatel`, and the check output showing one ALLOWED and two DENIED tests.", "group": "Module 5 exercises"}, {"id": "m05-lockout-recovery", "title": "m05-lockout-recovery: Sudo broke after a bad edit - recover and fix it", "md": "### Ticket\n**SEC-5003** - *From: Change Advisory Board* - \"A colleague added a rule for Internal Audit by editing `/etc/sudoers.d/60-auditors-logs` with a normal editor. Since then `sudo` prints errors. Restore a valid policy and implement what they intended: members of `auditors` may run **exactly** `journalctl -u ssh.service --no-pager` as root.\"\n\n### Objective\nRecognise and locate a sudoers syntax error, recover safely (including the break-glass path if sudo refuses to work), and implement the intended rule correctly with `visudo`.\n\n### Before you start\nThis exercise **breaks sudo on purpose**. Press **Start scenario** (or run `lab reset m05-lockout-recovery`) to create the faulty file. Open a second Linux terminal tab as a safety net (the portal's \"pop out\" link, or `ssh linux-iam-lab` from Windows Terminal).\n\n### Concepts and commands\n```linux\nsudo -v\n```\n`-v` just refreshes your sudo credentials - a harmless way to test sudo.\n```text\n>>> /etc/sudoers.d/60-auditors-logs: syntax error near line 2 <<<\nsudo: parse error in /etc/sudoers.d/60-auditors-logs near line 2\n```\nDepending on the sudo version, sudo then either continues without the broken rule or refuses to run at all.\n\n```linux\nsudo visudo -c\n```\nLists every file and marks the broken one.\n\n```linux\nsudo visudo -f /etc/sudoers.d/60-auditors-logs\n```\nOpens the file safely. Find the mistake, fix it, save; visudo re-checks before writing.\n\n```linux\nlab rescue sudoers\n```\n**Break-glass** (only if `sudo` itself refuses to run): the lab agent - standing in for \"console access as root\" - runs `visudo -c` on every file and moves invalid ones to `/var/lib/linux-iam-lab/quarantine/`. Everything it does is logged. After that, re-create the intended rule properly.\n\n```linux\nsudo -l -U rmorgan /usr/bin/journalctl -u ssh.service --no-pager; echo \"exit $?\"\nsudo -l -U rmorgan /usr/bin/journalctl; echo \"exit $?\"\n```\nThe first must print the command and exit 0; the second (no arguments = the whole journal) must exit 1.\n\n### Your task\n1. Start the scenario, observe the error, find the faulty file and line.\n2. Recover: fix it with `visudo -f` (preferred) or use the break-glass path if sudo does not work.\n3. Make sure `/etc/sudoers.d/60-auditors-logs` exists, is valid, mode `0440`, and allows `%auditors` to run exactly `/usr/bin/journalctl -u ssh.service --no-pager` as root (with password).\n\n### Verify\n`sudo visudo -c` parses OK, `sudo -v` is silent, and the two `sudo -l -U rmorgan` tests behave as described. **Check my work** also runs the command as `rmorgan` with his password.\n\n### If it fails\n- *still a syntax error*: compare brackets: `ALL=(root) /usr/bin/...` - every `(` needs a `)`.\n- *rmorgan may run journalctl with any arguments*: you dropped the arguments; list them exactly.\n- *file missing after rescue*: rescue moves broken files away; re-create the rule with `sudo visudo -f /etc/sudoers.d/60-auditors-logs`.\n\n### Hint 1\n`sudo visudo -c` names the file and line. Open exactly that file with `sudo visudo -f`.\n\n### Hint 2\nLook at the part after `ALL=`. The \"run as\" user must be in brackets: `(root)`.\n\n### Hint 3\nCorrect line: `%auditors ALL=(root) /usr/bin/journalctl -u ssh.service --no-pager`.\n\n### Walkthrough\n```linux\nlab reset m05-lockout-recovery\nsudo -v\nsudo visudo -c\nsudo visudo -f /etc/sudoers.d/60-auditors-logs\n```\nThe file contains:\n```text\n# AUD-5003: auditors may read the SSH service log\n%auditors ALL=(root /usr/bin/journalctl -u ssh.service --no-pager\n```\nChange the second line to:\n```text\n%auditors ALL=(root) /usr/bin/journalctl -u ssh.service --no-pager\n```\nSave and exit, then:\n```linux\nsudo visudo -c\nls -l /etc/sudoers.d/60-auditors-logs\nsudo -l -U rmorgan /usr/bin/journalctl -u ssh.service --no-pager; echo \"exit $?\"\nsudo -l -U rmorgan /usr/bin/journalctl; echo \"exit $?\"\nlab check m05-lockout-recovery\n```\nIf `sudo` refused to run at all: `lab rescue sudoers`, then `sudo visudo -f /etc/sudoers.d/60-auditors-logs` and type the corrected two lines.\n\n**Lesson:** never edit sudoers files with a plain editor, always keep a second root session open while changing privileged access, and know your break-glass procedure *before* you need it.", "group": "Module 5 exercises"}, {"id": "m06", "title": "Module 6: Secure remote access (SSH)", "md": "*Key pairs, authorized_keys, fingerprints, StrictModes, sshd configuration with validation, restricting who may log in, revoking keys and recovering from failed SSH access.*\n\nSSH is how administrators and automation reach Linux servers. For IAM, SSH **keys are credentials**: they must be issued, inventoried, reviewed and revoked like passwords.\n\n## Keys in one minute\n\n- `ssh-keygen -t ed25519` creates a **key pair**: a *private key* (`~/.ssh/id_ed25519`, never leaves its owner, ideally protected by a passphrase) and a *public key* (`id_ed25519.pub`, safe to share).\n- The server lists accepted public keys, one per line, in the user's `~/.ssh/authorized_keys`.\n- On login, the client proves it holds the private key; the server checks the public key is listed. No password crosses the network.\n- A key's **fingerprint** (`ssh-keygen -lf key.pub`) is a short hash used to verify it over another channel (\"read me the fingerprint\").\n\n```text\n256 SHA256:3xR9...kQ btran@laptop (ED25519)\n```\n\n## Permissions matter (StrictModes)\n\nsshd ignores `authorized_keys` if anyone other than the user (or root) could change it:\n\n| Path | Owner | Mode |\n|---|---|---|\n| home directory | the user | not group/world-writable (e.g. `750` or `755`) |\n| `~/.ssh` | the user | `700` |\n| `~/.ssh/authorized_keys` | the user | `600` |\n\nThe client side has the same rule for private keys (`chmod 600`). Windows OpenSSH checks the file's ACL instead.\n\n## Host keys and fingerprints\n\nThe **server** also has a key pair. The first time you connect, your client shows the server's fingerprint and asks you to confirm it; afterwards it is remembered in `~/.ssh/known_hosts`. A changed host key produces a loud `REMOTE HOST IDENTIFICATION HAS CHANGED` warning - possibly an attack; never just delete the line without checking. On the server: `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub`.\n\n> **Windows** This lab pinned the VM's host key for you at install. In Windows Terminal, `ssh linux-iam-lab` uses it; the fingerprint is shown on the portal's *Progress & lab tools* page.\n\n## Server configuration\n\n- Main file `/etc/ssh/sshd_config`; drop-in files `/etc/ssh/sshd_config.d/*.conf` are read first, in name order, and **the first value found for a setting wins**.\n- `sudo sshd -t` validates the configuration (no output = OK). **Always run it before reloading.**\n- `sudo sshd -T` prints the *effective* configuration; `sudo sshd -T -C user=btran,host=laptop,addr=10.0.2.2` evaluates `Match` blocks for a hypothetical connection.\n- `sudo systemctl reload ssh` applies changes; existing sessions stay connected.\n\nUseful settings: `PermitRootLogin no`, `PasswordAuthentication no`, `PubkeyAuthentication yes`, `MaxAuthTries 3`, `AllowGroups ssh-users`, `LoginGraceTime 30`, `X11Forwarding no`, `RevokedKeys /etc/ssh/revoked_keys`.\n\n## Diagnosing failed SSH logins\n\n| Symptom | Look at |\n|---|---|\n| `Permission denied (publickey)` | server log: `sudo journalctl -u ssh -n 30` (or `/var/log/auth.log`) |\n| `Authentication refused: bad ownership or modes` | home / `.ssh` / `authorized_keys` permissions |\n| `User x from y not allowed because not in any group` | `AllowGroups` / `AllowUsers` |\n| `User account has expired` / `account locked` | `chage -l`, `passwd -S` |\n| `This account is currently not available` | shell is `nologin` |\n| client side details | `ssh -v user@host` (more `v` = more detail) |\n\n> **Careful** Before changing sshd on a remote server, keep an existing session open and test a **new** login from a second window. If you lock yourself out in this lab you still have the portal's web terminal (it does not use SSH) and `lab rescue sshd`.\n", "group": "Lessons"}, {"id": "m06-key-login", "title": "m06-key-login: Set up SSH key login (for Ben and for yourself)", "md": "### Ticket\n**IAM-6001** - *From: Ben Tran* - \"Please enable key login for my account `btran`. My public key is in `/opt/lab-data/keys/btran_laptop.pub`. Its fingerprint is in the attached note `/opt/lab-data/tickets/IAM-6001.txt` - please verify before installing.\" *Team lead adds:* \"And while you're at it, set up your own key so you can log in to this server as `student` without a password.\"\n\n### Objective\nVerify a public key by fingerprint, install it with correct ownership and modes, create your own key pair, and log in with it.\n\n### Before you start\nLinux terminal with `sudo`. You do not have Ben's private key (only Ben does); **Check my work** tests his login with the copy the lab holds.\n\n### Concepts and commands\n```linux\ncat /opt/lab-data/tickets/IAM-6001.txt\nssh-keygen -lf /opt/lab-data/keys/btran_laptop.pub\n```\n`-l` shows the fingerprint, `-f` names the key file. Compare it character by character with the ticket. A mismatch means the key file was swapped - stop and ask.\n```text\n256 SHA256:Q9b1...uM btran_laptop (ED25519)\n```\n\n```linux\nsudo install -d -m 700 -o btran -g btran /home/btran/.ssh\nsudo install -m 600 -o btran -g btran /opt/lab-data/keys/btran_laptop.pub /home/btran/.ssh/authorized_keys\nsudo ls -la /home/btran/.ssh\n```\n`install` copies a file (or creates a folder with `-d`) and sets mode (`-m`), owner (`-o`) and group (`-g`) in one step - fewer chances to forget a `chown`. If `authorized_keys` already had keys you would **append** instead: `cat key.pub | sudo tee -a /home/btran/.ssh/authorized_keys`.\n\n```linux\nssh-keygen -t ed25519 -C \"student@iamlab01\"\n```\nCreates your own pair. Press Enter to accept `~/.ssh/id_ed25519`; set a passphrase (recommended in real life; for this lab you may leave it empty).\n```text\nYour identification has been saved in /home/student/.ssh/id_ed25519\nYour public key has been saved in /home/student/.ssh/id_ed25519.pub\n```\n\n```linux\ncat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys\nchmod 600 ~/.ssh/authorized_keys\nssh -i ~/.ssh/id_ed25519 student@localhost hostname\n```\n`>>` appends your public key to your own `authorized_keys` (the Windows lab key is already there - do not overwrite it with `>`). The first connection to `localhost` shows the server's fingerprint: compare it with `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub` before typing `yes`.\n\n### Your task\n1. Verify Ben's key fingerprint against the ticket.\n2. Install it as Ben's only authorized key with correct owner and modes (`700` folder, `600` file, owned by `btran`).\n3. Create your own ed25519 key pair and add **its public key** to `~/.ssh/authorized_keys` (keep the existing line).\n4. Log in to `student@localhost` with your new key.\n\n### Verify\n`sudo ls -la /home/btran/.ssh`, `ls -la ~/.ssh`, and your successful `ssh` command. **Check my work** really logs in as btran with his key.\n\n### If it fails\n- *btran's login refused*: read `sudo journalctl -u ssh -n 20`. \"bad ownership or modes\" = fix modes/owner.\n- *your own login asks for a password*: the public key is not in `~/.ssh/authorized_keys`, or you used `>` and overwrote it - re-add both keys.\n- *\"lost\" the Windows key*: you overwrote `authorized_keys`. Use **Reset Linux IAM Lab** if `ssh linux-iam-lab` from Windows stops working, or re-add the line from `C:\\Users\\you\\.ssh\\linux-iam-lab_student_ed25519.pub`.\n\n### Hint 1\nFingerprint: `ssh-keygen -lf FILE`. Installing for another user needs `sudo` plus the right owner - `install` does both.\n\n### Hint 2\n`sudo install -d -m 700 -o btran -g btran /home/btran/.ssh` then `sudo install -m 600 -o btran -g btran /opt/lab-data/keys/btran_laptop.pub /home/btran/.ssh/authorized_keys`.\n\n### Hint 3\nFor yourself: `ssh-keygen -t ed25519` (Enter for defaults), `cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys`, `ssh -i ~/.ssh/id_ed25519 student@localhost hostname`.\n\n### Walkthrough\n```linux\ncat /opt/lab-data/tickets/IAM-6001.txt\nssh-keygen -lf /opt/lab-data/keys/btran_laptop.pub\nsudo install -d -m 700 -o btran -g btran /home/btran/.ssh\nsudo install -m 600 -o btran -g btran /opt/lab-data/keys/btran_laptop.pub /home/btran/.ssh/authorized_keys\nsudo ls -la /home/btran/.ssh\nssh-keygen -t ed25519 -C \"student@iamlab01\" -f ~/.ssh/id_ed25519 -N \"\"\ncat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys\nchmod 600 ~/.ssh/authorized_keys\nssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub\nssh -i ~/.ssh/id_ed25519 student@localhost hostname\nlab check m06-key-login\n```\n```text\nThe authenticity of host 'localhost (127.0.0.1)' can't be established.\nED25519 key fingerprint is SHA256:....\nAre you sure you want to continue connecting (yes/no/[fingerprint])? yes\niamlab01\n```\n`-N \"\"` sets an empty passphrase non-interactively (lab only).", "group": "Module 6 exercises"}, {"id": "m06-broken-ssh", "title": "m06-br
