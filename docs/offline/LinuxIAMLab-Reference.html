<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux IAM Lab Reference</title>
<style>:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --text: #1d2330; --muted: #5d6676; --line: #dde1e7;
  --accent: #0e7c86; --accent-ink: #ffffff; --accent-soft: #e2f3f4;
  --linux: #1f8a3b; --linux-soft: #e6f4ea; --win: #1f5fbf; --win-soft: #e7eefb; --out: #6b5b95; --out-soft: #efecf6;
  --ok: #1f8a3b; --bad: #c0392b; --warn: #b7791f; --code-bg: #0f1520; --code-ink: #e3e8ef;
  --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
  --mono: ui-monospace, "Cascadia Code", "Cascadia Mono", Consolas, "Ubuntu Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131a; --panel: #161b24; --panel-2: #1c2330; --text: #e5e9f0; --muted: #9aa4b2; --line: #2a3240;
    --accent: #3cb7c1; --accent-ink: #061417; --accent-soft: #123036;
    --linux: #4cc06a; --linux-soft: #12291a; --win: #6aa0ff; --win-soft: #14223b; --out: #b3a3e0; --out-soft: #221d33;
    --code-bg: #0a0e14; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131a; --panel: #161b24; --panel-2: #1c2330; --text: #e5e9f0; --muted: #9aa4b2; --line: #2a3240;
  --accent: #3cb7c1; --accent-ink: #061417; --accent-soft: #123036;
  --linux: #4cc06a; --linux-soft: #12291a; --win: #6aa0ff; --win-soft: #14223b; --out: #b3a3e0; --out-soft: #221d33;
  --code-bg: #0a0e14; --shadow: none;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--font); }
a { color: var(--accent); }
code, kbd, pre { font-family: var(--mono); }
code { background: var(--panel-2); padding: .1em .35em; border-radius: 5px; font-size: .92em; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 .35em; font-size: .85em; background: var(--panel); }

.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-weight: 700; white-space: nowrap; }
.brand svg { color: var(--accent); }
.search-wrap { position: relative; flex: 1; max-width: 560px; }
#search { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
.search-results { position: absolute; top: 42px; left: 0; right: 0; max-height: 70vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.search-results a { display: block; padding: 8px 12px; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line); }
.search-results a:hover, .search-results a.sel { background: var(--accent-soft); }
.search-results small { color: var(--muted); display: block; }
.progress-pill { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.progress-pill .bar { width: 110px; height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
#progress-fill { height: 100%; width: 0; background: var(--accent); transition: width .4s; }
.status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
.st-label { margin-right: 6px; }
.btn { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .55; cursor: progress; }

.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr) 520px; height: calc(100vh - 53px); }
body.dock-hidden .layout { grid-template-columns: 270px minmax(0, 1fr) 0; }
body.dock-hidden .dock { display: none; }
.sidebar { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 12px 8px 40px; }
.sidebar h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 10px 6px; }
.nav-link { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; color: var(--text); text-decoration: none; font-size: 14px; }
.nav-link:hover { background: var(--panel-2); }
.nav-link.active { background: var(--accent-soft); color: var(--text); font-weight: 600; }
.nav-mod .num { font: 600 11px var(--mono); color: var(--muted); width: 22px; }
.nav-mod .ring { margin-left: auto; font-size: 11px; color: var(--muted); }
.nav-ex { padding-left: 38px; font-size: 13px; }
.mark { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.mark.passed { background: var(--ok); border-color: var(--ok); }
.mark.in_progress { border-color: var(--warn); }

main { overflow: auto; padding: 28px 40px 80px; }
main > .content { max-width: 860px; margin: 0 auto; }
main h1 { font-size: 28px; line-height: 1.25; margin: 0 0 6px; }
main h2 { font-size: 20px; margin: 32px 0 10px; padding-top: 8px; border-top: 1px solid var(--line); }
main h3 { font-size: 16px; margin: 22px 0 8px; }
.lead { color: var(--muted); font-size: 16px; margin-top: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 20px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.tag.passed { background: var(--linux-soft); color: var(--ok); border-color: transparent; }
.tag.in_progress { color: var(--warn); }

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin: 18px 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); text-decoration: none; color: var(--text); display: block; }
.card:hover { border-color: var(--accent); }
.card .num { font: 600 12px var(--mono); color: var(--accent); }
.card h4 { margin: 4px 0 6px; font-size: 16px; }
.card p { margin: 0; color: var(--muted); font-size: 13px; }
.card .cbar { height: 5px; background: var(--panel-2); border-radius: 99px; margin-top: 12px; overflow: hidden; }
.card .cbar div { height: 100%; background: var(--accent); }

.where-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 16px 0; }
.where-card { border-radius: var(--radius); padding: 14px 16px; border: 1px solid var(--line); }
.where-card.linux { background: var(--linux-soft); border-color: transparent; }
.where-card.windows { background: var(--win-soft); border-color: transparent; }
.where-card b { display: block; margin-bottom: 4px; }

.code { margin: 12px 0; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
.code-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 4px 10px; background: var(--panel-2); }
.code pre { margin: 0; padding: 12px 14px; background: var(--code-bg); color: var(--code-ink); overflow-x: auto; font-size: 13.5px; line-height: 1.5; }
.code pre code { background: none; padding: 0; color: inherit; }
.code-linux { border-left: 4px solid var(--linux); } .code-windows { border-left: 4px solid var(--win); } .code-output { border-left: 4px solid var(--out); }
.badge { font: 700 11px var(--font); letter-spacing: .06em; padding: 2px 8px; border-radius: 5px; }
.badge-linux { background: var(--linux); color: #fff; } .badge-windows { background: var(--win); color: #fff; }
.badge-output { background: var(--out-soft); color: var(--out); } .badge-file { background: var(--panel); color: var(--muted); border: 1px solid var(--line); }
.code-tools { display: flex; gap: 6px; }
.mini { font: 12px var(--font); padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
.mini:hover { border-color: var(--accent); }

.table-wrap { overflow-x: auto; margin: 12px 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
th { background: var(--panel-2); }
.callout { margin: 14px 0; padding: 10px 16px; border-radius: var(--radius); border-left: 4px solid var(--accent); background: var(--accent-soft); }
.callout.warn { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--panel)); }
.callout.tip { border-color: var(--ok); background: var(--linux-soft); }
.callout.win { border-color: var(--win); background: var(--win-soft); }
.callout p { margin: 6px 0; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 16px; margin: 24px 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.result { margin: 12px 0; padding: 12px 14px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); font: 13px/1.6 var(--mono); white-space: pre-wrap; }
.result .pass { color: var(--ok); } .result .fail { color: var(--bad); } .result .hint, .result .info { color: var(--warn); } .result .res { font-weight: 700; }
.result.passed { border-color: var(--ok); } .result.failed { border-color: var(--bad); }
.hintbox { border: 1px dashed var(--warn); border-radius: var(--radius); padding: 6px 14px; margin: 10px 0; background: var(--panel); }
details.walk { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px; background: var(--panel); margin: 12px 0; }
details.walk > summary { cursor: pointer; font-weight: 600; }

.dock { display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--panel); min-width: 0; }
.dock-tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab { flex: 1; padding: 10px; border: 0; background: transparent; color: var(--muted); font: 600 14px var(--font); cursor: pointer; border-bottom: 2px solid transparent; }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.dock-pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.where { font-size: 12.5px; padding: 6px 10px; }
.where-linux { background: var(--linux-soft); color: var(--text); }
.where a { float: right; }
#terminal { flex: 1; width: 100%; border: 0; background: #000; min-height: 200px; }
.term-help { font-size: 12px; color: var(--muted); padding: 6px 10px; border-top: 1px solid var(--line); }
.tutor-head { padding: 10px; border-bottom: 1px solid var(--line); }
.tutor-modes { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 12.5px var(--font); padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
.chip.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tutor-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
.chat { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 10px 12px; border-radius: 10px; font-size: 14px; max-width: 95%; }
.msg.user { align-self: flex-end; background: var(--accent-soft); }
.msg.assistant { align-self: flex-start; background: var(--panel-2); }
.msg.system { align-self: center; color: var(--muted); font-size: 12.5px; background: transparent; text-align: center; }
.msg .code pre { font-size: 12.5px; }
.msg p { margin: 4px 0; }
.share { padding: 6px 12px; border-top: 1px solid var(--line); font-size: 13px; }
.share textarea, .ask textarea { width: 100%; font: 13px var(--mono); padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); resize: vertical; }
.ask { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.ask textarea { font-family: var(--font); font-size: 14px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--panel); padding: 8px 16px; border-radius: 8px; z-index: 50; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 14px; }
.ref-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 18px; }
mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 3px; }
@media (max-width: 1200px) { .layout { grid-template-columns: 230px minmax(0,1fr) 420px; } }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  .sidebar { display: none; } .dock { height: 70vh; } main { padding: 20px 16px; }
  .progress-pill, .st-label { display: none; } .where-grid { grid-template-columns: 1fr; }
}

body{display:grid;grid-template-columns:300px 1fr;height:100vh;margin:0}
nav{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:12px}
nav input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;margin-bottom:8px}
nav a{display:block;padding:4px 8px;border-radius:6px;color:var(--text);text-decoration:none;font-size:14px}
nav a:hover,nav a.active{background:var(--accent-soft)}
nav h4{margin:12px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#doc{overflow:auto;padding:28px 40px} #doc>div{max-width:860px;margin:0 auto}
.mini{display:none}
@media (max-width:800px){body{grid-template-columns:1fr;height:auto} nav{max-height:40vh} #doc{padding:16px}}
</style></head>
<body><nav><strong>Linux IAM Lab - offline reference</strong><p style="font-size:12px;color:var(--muted)">Works without the lab or the internet. Same content as the course portal.</p>
<input id="q" type="search" placeholder="Search everything (e.g. chmod, faillock, AllowGroups)"><div id="list"></div></nav>
<main id="doc"><div id="body"></div></main>
<script>/* Tiny Markdown renderer for the Linux IAM Lab (offline, no dependencies).
   Supports: headings, paragraphs, **bold**, *italic*, `code`, [links](url), fenced code with a
   language tag, ordered/unordered lists (one nesting level), tables, blockquotes, hr. */
(function (global) {
  'use strict';
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function inline(s) {
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = esc(s);
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?!\w)/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => {
      const safe = /^(https?:|#|\/)/.test(u) ? u : '#';
      const ext = /^https?:/.test(u) ? ' target="_blank" rel="noopener noreferrer"' : '';
      return `<a href="${safe}"${ext}>${t}</a>`;
    });
    s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[+i])}</code>`);
    return s;
  }

  const WHERE = {
    linux: ['linux', 'LINUX VM', 'type in the Linux terminal (student@iamlab01)'],
    bash: ['linux', 'LINUX VM', 'type in the Linux terminal (student@iamlab01)'],
    sh: ['linux', 'LINUX VM', 'type in the Linux terminal (student@iamlab01)'],
    powershell: ['windows', 'WINDOWS POWERSHELL', 'type on Windows, in PowerShell / Windows Terminal'],
    ps: ['windows', 'WINDOWS POWERSHELL', 'type on Windows, in PowerShell / Windows Terminal'],
    text: ['output', 'EXAMPLE OUTPUT', 'what you should roughly see'],
    output: ['output', 'EXAMPLE OUTPUT', 'what you should roughly see'],
    ini: ['file', 'FILE CONTENT', 'text inside a file'],
    conf: ['file', 'FILE CONTENT', 'text inside a file'],
  };

  function codeBlock(lang, lines) {
    const w = WHERE[lang] || ['file', (lang || 'TEXT').toUpperCase(), ''];
    const body = esc(lines.join('\n'));
    const runnable = w[0] === 'linux' || w[0] === 'windows';
    return `<div class="code code-${w[0]}"><div class="code-head"><span class="badge badge-${w[0]}" title="${w[2]}">${w[1]}</span>` +
      `<span class="code-tools">${runnable ? '<button class="mini explain" title="Ask the tutor to explain this before you run it">Explain</button>' : ''}` +
      `<button class="mini copy" title="Copy">Copy</button></span></div><pre><code>${body}</code></pre></div>`;
  }

  function table(rows) {
    const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));
    const head = cells(rows[0]);
    const body = rows.slice(2).map(cells);
    return '<div class="table-wrap"><table><thead><tr>' + head.map((h) => `<th>${h}</th>`).join('') +
      '</tr></thead><tbody>' + body.map((r) => '<tr>' + r.map((c) => `<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
  }

  function render(md) {
    const lines = (md || '').replace(/\r\n/g, '\n').split('\n');
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const fence = line.match(/^```\s*([\w-]*)/);
      if (fence) {
        const buf = [];
        i++;
        while (i < lines.length && !lines[i].startsWith('```')) buf.push(lines[i++]);
        i++;
        out.push(codeBlock(fence[1].toLowerCase(), buf));
        continue;
      }
      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        const lvl = Math.min(6, h[1].length + 1);
        const id = h[2].toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        out.push(`<h${lvl} id="h-${id}">${inline(h[2])}</h${lvl}>`);
        i++;
        continue;
      }
      if (/^\s*(---|\*\*\*)\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
      if (/^\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\|?\s*:?-+/.test(lines[i + 1])) {
        const rows = [];
        while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
        out.push(table(rows));
        continue;
      }
      if (/^>\s?/.test(line)) {
        const buf = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
        let cls = 'note';
        const first = buf[0] || '';
        if (/^\*\*(warning|careful|danger)/i.test(first)) cls = 'warn';
        else if (/^\*\*(tip|why)/i.test(first)) cls = 'tip';
        else if (/^\*\*(windows)/i.test(first)) cls = 'win';
        out.push(`<blockquote class="callout ${cls}">${render(buf.join('\n'))}</blockquote>`);
        continue;
      }
      if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
        const ordered = /^\s*\d+\./.test(line);
        const items = [];
        while (i < lines.length && (/^\s*([-*]|\d+\.)\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
          const l = lines[i];
          const m = l.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
          if (m && m[1].length < 2) items.push({ text: m[3], sub: [] });
          else if (m) items[items.length - 1].sub.push(m[3]);
          else items[items.length - 1].text += ' ' + l.trim();
          i++;
        }
        const tag = ordered ? 'ol' : 'ul';
        out.push(`<${tag}>` + items.map((it) => `<li>${inline(it.text)}${it.sub.length ? '<ul>' + it.sub.map((s) => `<li>${inline(s)}</li>`).join('') + '</ul>' : ''}</li>`).join('') + `</${tag}>`);
        continue;
      }
      if (!line.trim()) { i++; continue; }
      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^(```|#{1,6}\s|>|\s*([-*]|\d+\.)\s+|\|)/.test(lines[i])) buf.push(lines[i++]);
      if (buf.length) out.push(`<p>${inline(buf.join(' '))}</p>`);
      else i++;
    }
    return out.join('\n');
  }

  global.LabMarkdown = { render, inline, esc };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
const DOCS = [{"id": "1-glossary", "title": "Glossary", "md": "Linux and IAM terms used in this course, A to Z. Use the filter box to jump to a term.\n\n### ACL (access control list)\nExtra permission entries on a file or folder for named users or groups, beyond owner/group/others. Set with `setfacl`, read with `getfacl`. A `+` after the mode in `ls -l` shows a file has one.\n\n### Access review (recertification)\nA periodic check that every account still needs every entitlement it has. Evidence: reports of users, groups, sudo rules and keys, plus the reviewer's decisions.\n\n### Account expiry\nThe date after which an account cannot log in at all (any method). Set with `chage -E YYYY-MM-DD`; `chage -E 0` expires now. Different from **password** expiry.\n\n### AllowGroups / AllowUsers\nsshd settings that restrict which accounts may log in over SSH. Anyone not matched is refused even with a valid key.\n\n### auid (audit user ID)\nThe login user recorded by the audit system. It stays the same after `sudo` or `su`, so it shows who really acted.\n\n### auditd\nThe Linux audit daemon. Records kernel-level events (file watches, commands, logins) to `/var/log/audit/audit.log`. Tools: `auditctl`, `augenrules`, `ausearch`, `aureport`.\n\n### Authentication (authN)\nProving who you are: password, key, token, MFA. In Linux: the PAM `auth` phase.\n\n### Authorization (authZ)\nDeciding what an authenticated identity may do: log in here, read this file, run that command. In Linux: PAM `account` phase, sshd `AllowGroups`, sudo rules, file permissions.\n\n### authorized_keys\n`~/.ssh/authorized_keys`: the list of public keys allowed to log in as that user. One key per line.\n\n### Break-glass\nA controlled, logged emergency path to regain administrative access when normal paths fail. In the lab: `lab rescue ...`.\n\n### Directory (LDAP directory)\nA central database of people, groups and devices (Active Directory, OpenLDAP, FreeIPA). Servers look identities up instead of keeping their own copies.\n\n### DN (distinguished name)\nThe full name of an LDAP entry, read right to left from the top of the tree: `uid=pshah,ou=people,dc=iamlab,dc=test`.\n\n### Entitlement\nA specific permission or role granted to an identity (a group membership, a sudo rule, an ACL entry).\n\n### Expiry (password)\nWhen a password must be changed. `chage -M` (max days), `chage -d 0` (must change now).\n\n### faillock (pam_faillock)\nThe PAM module that counts failed passwords and locks an account after a threshold. `faillock --user NAME [--reset]`.\n\n### Fingerprint\nA short hash of a public key (`SHA256:...`) used to verify it over another channel. `ssh-keygen -lf FILE`.\n\n### GECOS / comment\nThe 5th field of `/etc/passwd`, normally the full name and role. Use it to document who an account belongs to.\n\n### GID (group ID)\nThe number the kernel uses for a group. Primary GID is in `/etc/passwd`; group names and members in `/etc/group`.\n\n### Group (primary vs supplementary)\n**Primary**: one per user, owns the files they create. **Supplementary**: extra groups listed in `/etc/group`; used as roles.\n\n### Home directory\nA user's personal folder, usually `/home/NAME`. Should not be writable by others (sshd StrictModes checks this).\n\n### Host key\nThe SSH server's own key pair. Clients remember its fingerprint in `known_hosts` to detect impersonation.\n\n### IAM (identity and access management)\nThe discipline of making sure the right identities have the right access, for the right reasons, for the right time - and that it is provably so.\n\n### Joiner-Mover-Leaver (JML)\nThe identity lifecycle: create with correct access (joiner), change roles and remove old ones (mover), disable promptly and completely (leaver).\n\n### Least privilege\nGrant only the access needed for the task, for only as long as needed.\n\n### Locked account / locked password\n`passwd -l` / `usermod -L` puts `!` before the password hash: password logins fail. **SSH keys may still work** - expire the account to stop everything.\n\n### Login shell\nThe program started when a user logs in interactively (field 7 of `/etc/passwd`). `/usr/sbin/nologin` refuses interactive logins.\n\n### LDIF\nText format for LDAP entries and changes, used by `ldapadd` / `ldapmodify`.\n\n### Mask (ACL mask)\nThe ACL entry that limits the maximum permissions of named users, named groups and the owning group.\n\n### Non-human identity (service account)\nAn account used by software, not a person. Should have a system UID, no login shell, no usable password, a documented owner.\n\n### NSS (Name Service Switch)\nHow Linux finds users and groups. `/etc/nsswitch.conf` lists sources (`files`, `systemd`, `sss`). `getent` queries it.\n\n### Orphaned file\nA file whose owner UID no longer matches any account (shown as a number in `ls -l`). Find with `find -nouser`.\n\n### PAM (Pluggable Authentication Modules)\nThe framework programs use to authenticate users, check accounts, open sessions and change passwords. Config in `/etc/pam.d/`.\n\n### Permission bits\n`r` read, `w` write, `x` execute/traverse, for owner, group and others. Octal: r=4, w=2, x=1.\n\n### Privilege creep\nAccumulating access over time (usually via moves) that is no longer needed.\n\n### Private key / public key\nA key pair: the private key stays with its owner and proves identity; the public key is shared and placed in `authorized_keys`.\n\n### Revocation\nRemoving access: deleting a key, a group membership, a sudo rule, or expiring an account. Must be complete and verified.\n\n### RevokedKeys\nsshd setting pointing to a file of public keys that are refused for every account.\n\n### Root\nThe superuser, UID 0. Can do anything. Use `sudo` for specific tasks instead of logging in as root.\n\n### Service\nA background program managed by systemd (`systemctl status NAME`). Runs as the account in its unit file's `User=`.\n\n### setgid (directory)\nBit `2xxx` / `g+s`: new files in the folder inherit the folder's group. Used for team folders.\n\n### Shadow file\n`/etc/shadow`: password hashes and ageing data. Readable only by root and group `shadow`.\n\n### SSSD\nSystem Security Services Daemon: connects NSS and PAM to a directory, caches identities, enforces access rules.\n\n### StartTLS / TLS\nEncryption for network protocols. `ldapsearch -ZZ` requires StartTLS; SSSD verifies the directory's certificate.\n\n### Sticky bit\nBit `1xxx` / `+t` on a folder: only a file's owner can delete it (e.g. `/tmp`).\n\n### StrictModes\nsshd setting (default yes) that ignores `authorized_keys` if the home, `.ssh` or the file are writable by others.\n\n### sudo\nRuns a command as another user (usually root) according to rules in `/etc/sudoers` and `/etc/sudoers.d/`, and logs it.\n\n### sudoers / visudo\nThe sudo policy files and the safe editor that refuses to save syntax errors.\n\n### UID (user ID)\nThe number the kernel uses for a user. `0` root, `1-999` system, `1000+` people (Ubuntu). This lab: staff `2001+`, directory `10001+`.\n\n### umask\nThe permission bits removed from newly created files. `022` \u2192 files `644`; `027` \u2192 files `640`.\n\n### UPG (user private group)\nUbuntu creates a primary group with the same name as each new user.\n\n### World-writable\nWritable by \"others\" (any account): mode ends in `2`, `3`, `6` or `7`. Almost always a finding for data files.\n", "group": "Reference"}, {"id": "2-commands", "title": "Command dictionary", "md": "Every command used in the course: what it does, the flags you will use most, and an example. All run in the **Linux VM** unless marked otherwise. `sudo` in front means it needs administrator rights.\n\n### ls - list files\n`-l` long format, `-a` include hidden, `-h` human sizes, `-d` the folder itself not its content, `-R` recursive, `-t` newest first.\n```linux\nls -lah ~/lab\nls -ld /srv/hr\n```\n\n### cd / pwd - change / print folder\n`cd DIR`, `cd ..` up, `cd ~` home, `cd -` previous. `pwd` prints where you are.\n\n### mkdir / rmdir - make / remove folders\n`mkdir -p a/b/c` creates parents, no error if it exists. `rmdir` removes only empty folders.\n\n### cp / mv / rm - copy, move/rename, remove\n`cp -r` folders, `cp -p` keep mode/owner/time, `mv -i` / `rm -i` ask first, `rm -r` folder tree, `--` ends options (`rm -- -file`).\n```linux\ncp /opt/lab-data/handbook/welcome.txt ~/\nmv old.txt new.txt\nrm -i 'draft.txt~'\n```\n\n### cat / less / head / tail - read files\n`cat FILE`; `less FILE` (`q` quit, `/` search); `head -n 5`; `tail -n 20`; `tail -f` follow a growing log.\n\n### nano - edit text\n`Ctrl+O` save, `Ctrl+X` exit, `Ctrl+W` search. `sudo nano FILE` for system files (prefer `sudoedit FILE`).\n\n### man / --help / apropos - documentation\n`man ls`, `man 5 passwd` (file formats), `man -k keyword` search titles, `CMD --help` short usage.\n\n### echo / printf - print text\n`echo \"text\" > file` write, `>> file` append. `printf 'a=%s\\n' \"$x\"` formatted, reliable newlines.\n\n### grep - search text\n`-i` ignore case, `-v` invert, `-c` count, `-n` line numbers, `-r` recursive, `-E` extended regex, `-o` only the match, `-q` quiet (just exit code), `-l` file names only, `-x` whole line.\n```linux\nsudo grep -c 'authentication failure' /var/log/auth.log\ngrep -E '^(passwd|group):' /etc/nsswitch.conf\n```\n\n### sort / uniq / wc / cut / tr / paste - shape text\n`sort -n` numeric, `-r` reverse, `-u` unique, `-t: -k3,3n` by field 3; `uniq -c` count adjacent duplicates; `wc -l` lines; `cut -d: -f1,7` fields; `tr ' ' '\\n'` translate characters; `paste -sd, -` join lines with commas.\n```linux\ncut -d: -f1,7 /etc/passwd | sort | head\n```\n\n### awk - fields and conditions\n`-F:` field separator, `$1..$NF` fields, `NF` number of fields, conditions before `{...}`.\n```linux\nawk -F: '$3>=1000 && $3<60000 {print $1, $3}' /etc/passwd\n```\n\n### find - find files by attributes\n`-type f|d`, `-name '*.csv'`, `-user U`, `-group G`, `-nouser`, `-perm -o+w`, `-perm -4000` (setuid), `-mtime -1`, `-exec CMD {} +`, `-ls`.\n```linux\nsudo find /srv -type f -perm -o+w -ls\nsudo find /srv/hr -user cdiaz -exec chown hlopez {} +\n```\n\n### tar - archive\n`-c` create, `-x` extract, `-t` list, `-z` gzip, `-f FILE`, `-C DIR` change folder first.\n```linux\nsudo tar -czf /srv/archive/offboarded/u-home.tar.gz -C /home u\ntar -tzf archive.tar.gz | head\n```\n\n### sha256sum - checksums\n`sha256sum files > SHA256SUMS`, verify with `sha256sum -c SHA256SUMS`.\n\n### whoami / id / groups - who am I, which groups\n`id USER` UID, GID and groups; `id -nG USER` group names; `id -u` numeric UID.\n\n### getent - look up identities (all sources)\n`getent passwd USER`, `getent group GROUP`, `getent -s files passwd USER` (one source), `sudo getent shadow USER`.\n\n### useradd - create a user\n`-m` home, `-c \"comment\"`, `-s SHELL`, `-G g1,g2` supplementary groups, `-g GROUP` primary, `-e YYYY-MM-DD` expiry, `-u UID`, `--system` service account, `-d DIR` home path, `-M` no home.\n```linux\nsudo useradd -m -c \"Jane Doe - Analyst\" -s /bin/bash -G finance -e 2027-12-31 jdoe\n```\n\n### usermod - change a user\n`-aG g` **append** group (without `-a`, `-G` replaces all), `-G \"\"` remove all supplementary groups, `-L`/`-U` lock/unlock password, `-e DATE` expiry (`-e 1` expired), `-s SHELL`, `-c COMMENT`, `-l NEW` rename.\n\n### userdel - delete a user\n`-r` also delete home and mail. Prefer disabling first; delete after retention.\n\n### groupadd / groupdel / gpasswd - groups\n`sudo groupadd webops`; `sudo gpasswd -a USER GROUP` add, `-d USER GROUP` remove.\n\n### passwd - passwords\n`sudo passwd USER` set; `-l`/`-u` lock/unlock; `-S USER` status (`P` usable, `L` locked, `NP` none); `-e USER` expire now.\n\n### chage - password and account ageing\n`-l USER` show; `-E YYYY-MM-DD` account expiry (`-E -1` none, `-E 0` now); `-d 0` must change at next login; `-M DAYS` max password age.\n```linux\nsudo chage -l kwright\n```\n\n### faillock - failed-login counter\n`sudo faillock --user USER` show, `--reset` clear. Policy in `/etc/security/faillock.conf`.\n\n### su / sudo - act as another user\n`sudo CMD` as root; `sudo -u USER CMD` as USER; `sudo -i` root shell; `sudo -l` your rights; `sudo -l -U USER [CMD]` someone else's rights; `sudo -n` never prompt; `sudo -k` forget cached credentials. `su - USER` full login as USER (needs their password, or root).\n\n### visudo - edit sudo policy safely\n`sudo visudo` main file; `-f /etc/sudoers.d/NAME` a drop-in; `-c` check all; `-cf FILE` check one file.\n\n### chmod - change permissions\nOctal `640`, `2770`; symbolic `u+x`, `g-w`, `o=`, `g+s`, `+t`; `-R` recursive; `X` execute only on folders.\n```linux\nsudo chmod 640 payroll.csv\nsudo chmod -R g+rX /srv/team\n```\n\n### chown / chgrp - change owner / group\n`sudo chown USER:GROUP FILE`, `-R` recursive, `chgrp GROUP FILE`.\n\n### umask - default permission mask\n`umask` show (`0022`), `umask 027` set for this shell.\n\n### stat / namei - inspect a path\n`stat -c '%A %a %U:%G %n' FILE`; `namei -l /full/path` owners and modes of every component.\n\n### getfacl / setfacl - ACLs\n`setfacl -m u:USER:rX FILE`, `-x u:USER` remove entry, `-b` remove all, `-R` recursive, `-d` default (inherited) ACL. `getfacl -p PATH`.\n\n### ps / pgrep / pkill - processes\n`ps aux`, `ps -o user,pid,cmd -p PID`, `pgrep -u USER -l`, `sudo pkill -KILL -u USER`.\n\n### systemctl - services\n`status NAME`, `start|stop|restart|reload NAME`, `enable|disable NAME`, `is-active NAME`, `show -p User,MainPID NAME`, `list-units --type=service`.\n\n### journalctl - system journal\n`-u UNIT`, `_COMM=sudo`, `-t TAG`, `--since \"1 hour ago\"`, `-n 50`, `-f` follow, `-p warning`, `--no-pager`, `-o short-iso`.\n```linux\nsudo journalctl -u ssh -n 30 --no-pager\n```\n\n### ss - sockets and ports\n`sudo ss -ltnp` listening TCP ports with processes; `ss -tn` established connections.\n\n### ssh - connect\n`ssh USER@HOST`, `-p PORT`, `-i KEY`, `-v` verbose diagnostics, `-o BatchMode=yes` never prompt. From Windows: `ssh linux-iam-lab`.\n\n### ssh-keygen - keys and fingerprints\n`-t ed25519` create, `-C comment`, `-f FILE`, `-N ''` empty passphrase (lab only), `-lf FILE` fingerprint(s), `-R HOST` remove a known host entry.\n\n### sshd - SSH server checks\n`sudo sshd -t` validate config; `sudo sshd -T` effective config; `sudo sshd -T -C user=U,host=H,addr=A` with Match evaluation.\n\n### install - copy with mode and owner\n`sudo install -m 600 -o U -g G SRC DEST`; `install -d -m 700 -o U -g G DIR`.\n\n### crontab - scheduled jobs\n`crontab -l` list yours; `sudo crontab -l -u USER`; `sudo crontab -r -u USER` remove.\n\n### ldapsearch / ldapmodify - directory\n`-x` simple bind, `-ZZ` require StartTLS, `-H ldap://ldap.iamlab.test`, `-b BASE`, `-D BINDDN -y PWFILE`, filter `'(uid=pshah)'`, `-f FILE.ldif` (ldapmodify).\n\n### sssctl / sss_cache - SSSD\n`sudo sssctl domain-status iamlab.test`, `sudo sssctl user-checks USER`, `sudo sss_cache -E` (expire all cached entries).\n\n### auditctl / augenrules / ausearch / aureport - audit\n`sudo auditctl -l` active rules; `sudo augenrules --load` load `/etc/audit/rules.d/`; `sudo ausearch -k KEY -i --start today`; `sudo aureport -au` / `-m` / `--summary`.\n\n### last / lastlog - login history\n`last -n 10` recent logins; `sudo lastb` failed logins (sshd); `lastlog` last login per user.\n\n### lab - this course's helper (Linux)\n`lab list`, `lab show ID`, `lab hint ID [1-3]`, `lab check ID`, `lab reset ID`, `lab rescue sudoers|sshd|faillock|sssd|terminal`, `lab capstone status|evidence`, `lab where`.\n\n### Start/Stop/Reset scripts (Windows host)\nDesktop shortcuts run these in Windows PowerShell; you can also run them directly:\n```powershell\n& \"$env:LOCALAPPDATA\\LinuxIAMLab\\app\\windows\\Start-LinuxIAMLab.ps1\"\n& \"$env:LOCALAPPDATA\\LinuxIAMLab\\app\\windows\\Export-LinuxIAMLabWork.ps1\"\n```\n", "group": "Reference"}, {"id": "3-shortcuts", "title": "Shortcuts", "md": "Keyboard shortcuts for Windows Terminal (on the Windows host), the Bash shell (in Linux), the portal's web terminal, and the editors used in this course.\n\n### Windows Terminal: tabs and panes (Windows host)\n| Keys | Action |\n|---|---|\n| `Ctrl+Shift+T` | new tab (default profile) |\n| `Ctrl+Shift+1..9` | new tab with profile 1..9 |\n| `Ctrl+Tab` / `Ctrl+Shift+Tab` | next / previous tab |\n| `Ctrl+Shift+W` | close pane/tab |\n| `Alt+Shift+D` | split pane (duplicate) |\n| `Alt+Shift+-` / `Alt+Shift++` | split horizontally / vertically |\n| `Alt+Arrow` | move between panes |\n| `Ctrl+Shift+F` | find in the scrollback |\n| `Ctrl+Shift+P` | command palette |\n| `Ctrl+,` | settings |\n\n### Windows Terminal: copy and paste (Windows host)\n| Keys | Action |\n|---|---|\n| select with mouse, then `Ctrl+C` or `Enter` | copy (when text is selected) |\n| `Ctrl+V` or `Ctrl+Shift+V` | paste |\n| right-click | paste (or context menu, depending on settings) |\n| `Ctrl+=` / `Ctrl+-` / `Ctrl+0` | zoom in / out / reset |\nNote: `Ctrl+C` with **no** selection sends \"interrupt\" to the program, just like in Linux.\n\n### Connecting from Windows Terminal to the lab\n```powershell\nssh linux-iam-lab\n```\nWorks after install because the installer added a `Host linux-iam-lab` entry to `C:\\Users\\you\\.ssh\\config` with the lab key and the pinned host key. Equivalent long form: `ssh -p 2422 -i $HOME\\.ssh\\linux-iam-lab_student_ed25519 student@127.0.0.1`. Type `exit` or press `Ctrl+D` to return to Windows.\n\n### Bash: moving on the command line (Linux)\n| Keys | Action |\n|---|---|\n| `Ctrl+A` / `Ctrl+E` | start / end of line |\n| `Alt+B` / `Alt+F` | back / forward one word |\n| `Ctrl+Left` / `Ctrl+Right` | back / forward one word (most terminals) |\n| `Ctrl+XX` | toggle between start of line and cursor |\n\n### Bash: editing (Linux)\n| Keys | Action |\n|---|---|\n| `Ctrl+U` | cut from cursor to start of line |\n| `Ctrl+K` | cut from cursor to end of line |\n| `Ctrl+W` | cut previous word |\n| `Alt+D` | cut next word |\n| `Ctrl+Y` | paste what you cut |\n| `Ctrl+_` | undo |\n| `Alt+.` | insert last argument of the previous command (repeat to go further back) |\n| `Tab` / `Tab Tab` | complete / list completions |\n\n### Bash: history (Linux)\n| Keys / command | Action |\n|---|---|\n| `Up` / `Down` | previous / next command |\n| `Ctrl+R` | reverse search; `Ctrl+R` again for older match; `Enter` run; `Esc` or `Right` to edit; `Ctrl+G` cancel |\n| `history` / `history 20` | list history / last 20 |\n| `!!` | repeat last command (e.g. `sudo !!`) - read it before pressing Enter |\n| `!42` | run history entry 42 |\n| `!$` | last argument of previous command |\n| `HISTTIMEFORMAT` | set in this lab, so `history` shows timestamps |\n\n### Bash: control (Linux)\n| Keys | Action |\n|---|---|\n| `Ctrl+C` | interrupt (stop) the running command |\n| `Ctrl+D` | end of input; on an empty prompt: log out |\n| `Ctrl+Z` | suspend the running command (`fg` resumes, `bg` continues in background, `jobs` lists) |\n| `Ctrl+L` | clear the screen |\n| `Ctrl+S` / `Ctrl+Q` | freeze / unfreeze output (if the screen \"hangs\", try `Ctrl+Q`) |\n\n### Portal web terminal (browser)\n| Keys | Action |\n|---|---|\n| select text | copies automatically in many browsers; otherwise right-click > Copy |\n| `Ctrl+Shift+V` / right-click | paste |\n| `Ctrl+Shift+C` | copy (where supported) |\nBrowser shortcuts such as `Ctrl+W` may close the browser tab - use the pop-out terminal or `ssh linux-iam-lab` if you rely on Bash's `Ctrl+W`.\n\n### nano editor (Linux)\n| Keys | Action |\n|---|---|\n| `Ctrl+O`, `Enter` | save |\n| `Ctrl+X` | exit (asks to save if changed) |\n| `Ctrl+W` | search |\n| `Ctrl+K` / `Ctrl+U` | cut line / paste |\n| `Alt+U` | undo |\n| `Ctrl+_` | go to line number |\n| `Alt+#` | toggle line numbers |\n\n### less and man pages (Linux)\n| Keys | Action |\n|---|---|\n| `Space` / `b` | page down / up |\n| `/pattern` `Enter` | search forward; `n` next, `N` previous |\n| `g` / `G` | top / bottom |\n| `q` | quit |\n\n### vim survival (Linux)\n`Esc` then `:q!` `Enter` quits without saving. `Esc` then `:wq` `Enter` saves and quits. `i` starts typing (insert mode).\n", "group": "Reference"}, {"id": "4-troubleshooting", "title": "IAM troubleshooting guide", "md": "A symptom-first guide for access tickets on Linux. Always: **reproduce as the user**, **read the log**, **change the smallest thing**, **re-test allowed and denied**.\n\n### Method: the five questions\n1. **Who exactly?** `id USER`, `getent passwd USER` - right account, right UID, local or directory?\n2. **Is the account usable?** `sudo passwd -S USER`, `sudo chage -l USER`, `sudo faillock --user USER`, shell in `getent passwd`.\n3. **Is it authentication or authorization?** Wrong password/key (auth) vs \"not allowed\" (account phase, AllowGroups, sudo rule, file permission).\n4. **What does the server log say?** `sudo journalctl -u ssh -n 50`, `sudo grep USER /var/log/auth.log | tail`, `sudo journalctl _COMM=sudo`, `sudo journalctl -u sssd`.\n5. **What changed?** Recent tickets, `sudo ausearch -k identity -i --start today`, file modification times (`ls -l --time-style=full-iso`).\n\n### \"Permission denied\" reading or writing a file\n- Reproduce: `sudo -u USER cat FILE` / `sudo -u USER touch DIR/test`.\n- `namei -l /full/path/FILE`: every directory needs `x` for the user's class (owner/group/other); the file needs `r` (read) or `w` (write).\n- `id USER`: is the user in the file's group? Group changes need a **new login** for interactive users.\n- `getfacl FILE`: an ACL `mask` can reduce effective rights (`#effective:` in the output).\n- Fix narrowly (`chmod g+x DIR`, `setfacl -m u:USER:r FILE`), never `chmod 777`.\n\n### New files in a team folder are not editable by teammates\nMissing setgid on the folder (files get the creator's group) and/or users' `umask 022`. Fix: `chmod 2770 DIR` and `setfacl -d -m g:GROUP:rwX DIR`.\n\n### SSH: \"Permission denied (publickey)\"\nRead the server log first: `sudo journalctl -u ssh -n 30 --no-pager`.\n\n| Log line | Cause | Fix |\n|---|---|---|\n| `Authentication refused: bad ownership or modes for ...` | home / `.ssh` / `authorized_keys` writable by others, or wrong owner | `chmod go-w ~USER`, `chmod 700 ~/.ssh`, `chmod 600 authorized_keys`, `chown USER:` |\n| `User X from Y not allowed because none of user's groups are listed in AllowGroups` | not in the SSH access group | add to the group (if approved) |\n| `User account has expired` / `Account X has expired` | account expiry in the past | renew only with approval: `chage -E DATE` |\n| no line about the user's key at all | key not in `authorized_keys`, or a different key | compare `ssh-keygen -lf` of both |\n| `Failed publickey ... ED25519 SHA256:...` then `refusing previously-used key`/`revoked` | key in `RevokedKeys` | by design |\n| `User X not allowed because shell /usr/sbin/nologin does not exist`/ client: `This account is currently not available` | nologin shell | intended for disabled/service accounts |\nClient side detail: `ssh -v USER@HOST` shows which keys were offered.\n\n### SSH: \"REMOTE HOST IDENTIFICATION HAS CHANGED\"\nThe server's host key differs from the remembered one. Verify the new fingerprint with the server owner (`ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub` on the server) **before** removing the old entry (`ssh-keygen -R HOST`). For this lab the key is pinned by the installer; this message after a reinstall means the VM was rebuilt - re-run the installer.\n\n### SSH: locked yourself out after changing sshd_config\nUse a console path (here: the portal web terminal, which does not use SSH). `sudo sshd -t` shows the error; `sudo sshd -T -C user=YOU,host=x,addr=10.0.2.2` shows effective `allowgroups`/`allowusers`. Lab break-glass: `lab rescue sshd`.\n\n### Password login fails\n- `sudo faillock --user USER`: locked by failures? Reset after verifying identity.\n- `sudo passwd -S USER`: `L` = locked password.\n- `sudo chage -l USER`: expired account or expired password (`password must be changed`).\n- Directory user: `sudo sssctl user-checks USER`; `journalctl -u sssd`.\n\n### Correct password but \"access denied\" (directory user)\nAuthorization in the PAM account phase. Check `/etc/sssd/sssd.conf` `access_provider` / `simple_allow_groups`, the user's groups in the directory (`ldapsearch ... '(memberUid=USER)'`), then `sudo sss_cache -E`.\n\n### Directory user not found by `id` / `getent`\n`grep sss /etc/nsswitch.conf`; `systemctl status sssd`; `sudo sssctl domain-status iamlab.test`; TLS problems appear as `Could not start TLS encryption` in `journalctl -u sssd` (certificate name must match `ldap.iamlab.test`). Clear the cache: `sudo sss_cache -E`.\n\n### sudo: \"USER is not in the sudoers file\" / \"not allowed to execute\"\n`sudo -l -U USER` lists rules; check group rules (`%group`) with `id USER`. Commands match **exact paths and arguments** - `/usr/bin/systemctl restart x` does not cover `systemctl restart x.service` unless written that way.\n\n### sudo: \"parse error\" / \"syntax error\"\n`sudo visudo -c` names the file and line; fix with `sudo visudo -f FILE`. If sudo refuses to run: console/root access, or in the lab `lab rescue sudoers`.\n\n### sudo asks for a password in a script\nUse `sudo -n` to fail instead of hanging; grant `NOPASSWD:` only for narrowly scoped automation commands.\n\n### Leaver can still log in with an SSH key\nA password lock does not stop keys. Expire the account (`chage -E 0`), set shell `nologin`, remove `authorized_keys`, kill sessions (`pkill -KILL -u USER`).\n\n### Account changes \"don't apply\"\nThe user's existing session keeps its old groups - log out/in, or check with a fresh `sudo -u USER id`. For directory users, SSSD caches: `sudo sss_cache -E`.\n\n### Audit rules not recording\n`sudo auditctl -l` (rules active?), `systemctl status auditd`, rules files in `/etc/audit/rules.d/` loaded with `sudo augenrules --load`. Search by key: `sudo ausearch -k KEY -i`.\n\n### Lab-specific: the portal or terminal is not working\nOn Windows: run **Start Linux IAM Lab** again (it waits for all services). In Linux: `lab status`, `lab rescue terminal`. Still broken: **Reset Linux IAM Lab** (exports your work first). Install/Start logs: `%LOCALAPPDATA%\\LinuxIAMLab\\logs`.\n\n### Lab-specific: the tutor says it is offline\nLessons, hints and checks keep working. In Linux: `systemctl status ollama`, `ollama list` (model present?), `sudo lab tutor-pull` (needs internet once). The tutor runs on CPU: answers can take 10-60 seconds.\n", "group": "Reference"}, {"id": "m01", "title": "Module 1: First day at the Linux terminal", "md": "*The prompt, commands, paths, files, editing, help pages, Tab, history, Ctrl+R and recovering from mistakes.*\n\nMost IAM work on Linux happens in a **terminal**: a text window where you type a command, press Enter and read the answer. This module makes you comfortable there.\n\n## Two places you can type\n\n> **Windows** The Windows PowerShell prompt looks like `PS C:\\Users\\you>`. You use it only to start, stop and reset the lab, or to connect with `ssh linux-iam-lab`. Linux commands such as `ls -l /etc` will not work there.\n\nThe Linux prompt looks like this:\n\n```text\nstudent@iamlab01:~$\n```\n\n| Part | Meaning |\n|---|---|\n| `student` | the account you are logged in as |\n| `iamlab01` | the computer (host) you are on: the lab VM |\n| `~` | your current folder; `~` is short for your home folder `/home/student` |\n| `$` | you are a normal user. Root, the all-powerful admin account, sees `#` instead |\n\n## Anatomy of a command\n\n```linux\nls -l /etc/passwd\n```\n\n- `ls` is the **command** (list files).\n- `-l` is an **option** (also called a flag): long format. Options change how a command behaves. Short options use one dash (`-l`); long options use two (`--all`). Short options can be combined: `ls -la` is `ls -l -a`.\n- `/etc/passwd` is an **argument**: what the command works on.\n\n```text\n-rw-r--r-- 1 root root 2401 Nov 11 09:12 /etc/passwd\n```\n\nLinux is **case-sensitive**: `ls` works, `LS` does not; `Report.txt` and `report.txt` are different files.\n\n## Paths\n\n- An **absolute path** starts at the root folder `/`, for example `/home/student/lab`.\n- A **relative path** starts where you are: in `/home/student`, `lab/m01` means `/home/student/lab/m01`.\n- `.` is the current folder, `..` the parent folder, `~` your home folder.\n\n## Core file commands\n\n| Command | Does | Example |\n|---|---|---|\n| `cd DIR` | change directory | `cd /etc`, `cd ..`, `cd ~`, `cd -` (previous folder) |\n| `ls` | list | `ls -la` (long, include hidden files that start with `.`) |\n| `mkdir -p` | make folders (and parents) | `mkdir -p ~/lab/m01/tickets` |\n| `cp` | copy | `cp file copy.txt`, `cp -r dir1 dir2` (folders need `-r`) |\n| `mv` | move or rename | `mv old.txt new.txt`, `mv a.txt dir/` |\n| `rm` | delete files | `rm -i file` (ask first); `rm -r dir` deletes a folder tree |\n| `rmdir` | delete an **empty** folder | `rmdir ~/lab/old` |\n| `cat` / `less` | show a file / page through it | `less /etc/passwd` (`q` quits, `/word` searches) |\n| `nano` | edit text | `Ctrl+O` save, `Ctrl+X` exit |\n\n## Keys that save you time\n\n| Keys | What they do |\n|---|---|\n| `Tab` | complete a command or file name; press twice to list choices |\n| `Up` / `Down` | walk through previous commands |\n| `Ctrl+R` | search history: type part of an old command; `Ctrl+R` again for older matches; `Enter` runs it, `Esc` lets you edit it |\n| `Ctrl+C` | cancel the running command: your \"get me out of here\" key |\n| `Ctrl+D` | end input, or log out of a shell |\n| `Ctrl+L` | clear the screen |\n| `Ctrl+A` / `Ctrl+E` | jump to start / end of the line |\n| `Ctrl+U` / `Ctrl+W` | delete to start of line / delete previous word |\n| `q` | quit `less` and `man` |\n\n`history` lists what you typed; `!42` re-runs entry 42 (read it first!).\n\n## Getting help\n\n- `man ls` opens the manual page. Inside: `/pattern` searches, `n` next match, `q` quits.\n- Manual **sections** matter: `man 1 passwd` is the command, `man 5 passwd` is the **file format** of `/etc/passwd`.\n- `ls --help` prints a short summary. `type cd` tells you whether something is a builtin, alias or program. `man -k keyword` searches all page titles.\n\n## Recovering from common mistakes\n\n- **No prompt comes back**: the command is waiting for input (for example `cat` with no file). Press `Ctrl+C`.\n- **`command not found`**: check spelling and case; `sl` is not `ls`.\n- **`No such file or directory`**: check where you are with `pwd` and `ls`; use Tab so you cannot misspell.\n- **A `>` prompt appears**: you opened a quote and did not close it. `Ctrl+C` and retype.\n- **Stuck in `vim`**: press `Esc`, type `:q!`, Enter. This course uses `nano`.\n- **File name with spaces**: quote it: `cat \"my report.txt\"` or escape the space: `cat my\\ report.txt`.\n- **File name starting with a dash**: `rm -- -notes.txt` or `rm ./-notes.txt` (`--` means \"no more options\").\n- **`Permission denied`**: you are not allowed to do that as `student`. That is often *correct*; later modules teach when `sudo` is appropriate.\n\n> **Careful** `rm` deletes immediately - there is no Recycle Bin on Linux. Use `rm -i` while learning.\n", "group": "Lessons"}, {"id": "m01-orientation", "title": "m01-orientation: Your first login to the jump host", "md": "### Ticket\n**HELP-1001** - *From: IT Onboarding* - \"Welcome to the IAM team! Before you get production access, confirm you can work on the jump host `iamlab01`. Record who you are logged in as and some basic facts about the server in `~/lab/m01/orientation.txt`.\"\n\n### Objective\nRead the Linux prompt, run your first commands, and create a small text file with the `nano` editor.\n\n### Before you start\nOpen the **Linux terminal** (right-hand panel, or `ssh linux-iam-lab` in Windows Terminal). Everything in this exercise is typed in Linux. No previous exercise is needed.\n\n### Concepts and commands\n```linux\nwhoami\n```\nPrints the account you are logged in as.\n```text\nstudent\n```\n\n```linux\nhostname\n```\nPrints the computer's name.\n```text\niamlab01\n```\n\n```linux\npwd\n```\n**P**rint **w**orking **d**irectory: where you are right now.\n```text\n/home/student\n```\n\n```linux\nid\n```\nYour user ID (UID), primary group (GID) and every group you belong to. IAM analysts read this output all the time.\n```text\nuid=1001(student) gid=1001(student) groups=1001(student),4(adm),27(sudo),...\n```\nYour numbers may differ: read yours, do not copy these. `id -u` prints only the numeric UID.\n\n```linux\necho $SHELL\nuname -r\n```\n`echo` prints text; `$SHELL` is a variable holding your login shell. `uname -r` prints the Linux kernel **r**elease (`uname -a` prints everything).\n```text\n/bin/bash\n6.8.0-87-generic\n```\n\n```linux\nmkdir -p ~/lab/m01\nnano ~/lab/m01/orientation.txt\n```\n`mkdir -p` makes the folder and any missing parents, and does not complain if it exists. `nano` opens a simple editor: type text, `Ctrl+O` then Enter saves, `Ctrl+X` exits. The bottom two lines of nano list its shortcuts (`^` means Ctrl).\n\n```linux\ncat ~/lab/m01/orientation.txt\n```\n`cat` prints a file.\n\n### Your task\nCreate `~/lab/m01/orientation.txt` containing these six lines, with the real values from **your** VM:\n```text\nuser=<output of whoami>\nhost=<output of hostname>\nhome=<your home folder>\nuid=<your numeric uid>\nshell=<your login shell>\nkernel=<output of uname -r>\n```\nCreate it as `student` (no `sudo`).\n\n### Verify\n`cat ~/lab/m01/orientation.txt` and compare each value with the command that produces it. Then press **Check my work** or run `lab check m01-orientation`.\n\n### If it fails\n- *no line 'uid=...'*: check the key spelling; keys are lowercase with no spaces before `=`.\n- *uid is not right*: you probably copied the example. Run `id -u`.\n- *file does not exist*: `ls ~/lab/m01` - the name must be exactly `orientation.txt` (Linux is case-sensitive).\n- *should be created by student*: you used `sudo nano`. Delete it with `sudo rm ~/lab/m01/orientation.txt` and create it again without sudo.\n\n### Hint 1\nRun each command on its own first and read the output: `whoami`, `hostname`, `pwd`, `id`, `echo $SHELL`, `uname -r`.\n\n### Hint 2\n`id -u` prints just the number for `uid=`. In nano: `Ctrl+O`, Enter to save; `Ctrl+X` to leave.\n\n### Hint 3\nThe file looks like `user=student`, `host=iamlab01`, `home=/home/student`, `uid=` plus the number from `id -u`, `shell=/bin/bash`, `kernel=` plus the text from `uname -r`.\n\n### Walkthrough\n```linux\nwhoami\nhostname\npwd\nid -u\necho $SHELL\nuname -r\nmkdir -p ~/lab/m01\nnano ~/lab/m01/orientation.txt\n```\nType the six lines with your values, for example:\n```text\nuser=student\nhost=iamlab01\nhome=/home/student\nuid=1001\nshell=/bin/bash\nkernel=6.8.0-87-generic\n```\nSave with `Ctrl+O`, Enter, exit with `Ctrl+X`, then:\n```linux\ncat ~/lab/m01/orientation.txt\nlab check m01-orientation\n```\n**Why it matters:** every access investigation starts with \"which account, on which machine, with which IDs and groups\".", "group": "Module 1 exercises"}, {"id": "m01-files", "title": "m01-files: Organise the ticket workspace", "md": "### Ticket\n**HELP-1002** - *From: Team lead* - \"Your ticket inbox at `~/lab/m01/inbox` is a mess. Sort the tickets into `open` and `closed` folders under `~/lab/m01/tickets`, delete the editor junk file, keep a copy of the onboarding checklist from the handbook in `~/lab/m01`, and remove the empty inbox when you are done.\"\n\n### Objective\nNavigate with `cd`, `ls` and Tab completion; read files with `cat`/`less`; create, copy, move and delete files and folders safely.\n\n### Before you start\nLinux terminal. The lab created `~/lab/m01/inbox` with three tickets and one junk file, and the read-only handbook in `/opt/lab-data/handbook`.\n\n### Concepts and commands\n```linux\ncd ~/lab/m01/inbox\nls -la\n```\n`cd` changes folder (use Tab after typing `~/lab/m` to complete). `ls -l` shows details; `-a` also shows hidden files (names starting with `.`).\n```text\ntotal 24\ndrwxr-xr-x 2 student student 4096 Nov 11 10:00 .\ndrwxr-xr-x 3 student student 4096 Nov 11 10:00 ..\n-rw-r--r-- 1 student student   12 Nov 11 10:00 draft.txt~\n-rw-r--r-- 1 student student  140 Nov 11 10:00 ticket-1001.txt\n-rw-r--r-- 1 student student  138 Nov 11 10:00 ticket-1002.txt\n-rw-r--r-- 1 student student  151 Nov 11 10:00 ticket-1003.txt\n```\n\n```linux\ncat ticket-1001.txt\nless ticket-1002.txt\n```\n`cat` prints the whole file; `less` pages through long files (Space = next page, `q` = quit). Each ticket has a `Status:` line.\n\n```linux\nmkdir -p ~/lab/m01/tickets/open ~/lab/m01/tickets/closed\n```\nCreates both folders (and `tickets` itself) in one command.\n\n```linux\nmv ticket-1001.txt ~/lab/m01/tickets/closed/\n```\n`mv SOURCE DEST/` moves a file into a folder. The trailing `/` makes it clear `DEST` is a folder. `mv old new` in the same folder renames.\n\n```linux\ncp /opt/lab-data/handbook/onboarding-checklist.txt ~/lab/m01/\n```\n`cp` copies. The original stays where it is. Use `cp -r` for folders.\n\n```linux\nrm -i 'draft.txt~'\nrmdir ~/lab/m01/inbox\n```\n`rm -i` asks before deleting (`y` to confirm). `rmdir` only removes an **empty** folder, which makes it a safe way to tidy up: if it refuses with `Directory not empty`, something is still inside.\n\n```linux\nls -R ~/lab/m01/tickets\n```\n`-R` lists recursively, folder by folder.\n\n### Your task\n1. Read each ticket in `~/lab/m01/inbox` and move it to `~/lab/m01/tickets/open/` or `~/lab/m01/tickets/closed/` according to its `Status:` line. Keep the file names.\n2. Delete the junk file `draft.txt~`.\n3. Copy `/opt/lab-data/handbook/onboarding-checklist.txt` into `~/lab/m01/` (leave the original in place).\n4. Remove the now-empty `~/lab/m01/inbox` folder.\n\n### Verify\n```linux\nls -R ~/lab/m01\n```\nYou should see the two ticket folders, the checklist and no inbox. Then **Check my work**.\n\n### If it fails\n- *ticket in the wrong folder*: `cat` it again and read `Status:`. Move it with `mv`.\n- *`rmdir: failed to remove ... Directory not empty`*: run `ls -la ~/lab/m01/inbox`; something (perhaps the junk file) is still inside.\n- *`cannot stat`*: the path is misspelled. Use Tab completion.\n- Made a mess? Press **Retry exercise** to get a fresh inbox.\n\n### Hint 1\nStart with `cd ~/lab/m01/inbox`, then `ls -la`, then `cat` each ticket and look for the word `Status`.\n\n### Hint 2\nCreate both destination folders at once with `mkdir -p` and move tickets with `mv ticket-XXXX.txt ~/lab/m01/tickets/open/` (or `closed/`). The junk file name contains `~`, so quote it.\n\n### Hint 3\nTwo tickets are OPEN and one is CLOSED. After moving all three and deleting `'draft.txt~'`, `cd ~/lab/m01` and run `rmdir inbox`.\n\n### Walkthrough\n```linux\ncd ~/lab/m01/inbox\nls -la\ncat ticket-1001.txt ticket-1002.txt ticket-1003.txt\n```\n```text\nTicket: HELP-1001 ... Status: CLOSED\nTicket: HELP-1002 ... Status: OPEN\nTicket: HELP-1003 ... Status: OPEN\n```\n```linux\nmkdir -p ~/lab/m01/tickets/open ~/lab/m01/tickets/closed\nmv ticket-1001.txt ~/lab/m01/tickets/closed/\nmv ticket-1002.txt ticket-1003.txt ~/lab/m01/tickets/open/\nrm -i 'draft.txt~'\ncp /opt/lab-data/handbook/onboarding-checklist.txt ~/lab/m01/\ncd ~/lab/m01\nrmdir inbox\nls -R ~/lab/m01\nlab check m01-files\n```\n`mv` accepts several sources when the last argument is a folder. `cd ~/lab/m01` first, because you cannot remove the folder you are standing in.", "group": "Module 1 exercises"}, {"id": "m01-help-mistakes", "title": "m01-help-mistakes: Use the manual and fix awkward file names", "md": "### Ticket\n**HELP-1003** - *From: Team lead* - \"Someone left badly named files in `~/lab/m01/messy`. Rename `quarterly report.txt` to `quarterly-report.txt` and delete the file called `-old-notes.txt`. While you are at it, use the built-in manual to answer the questions in the task - I want you to be able to look things up yourself.\"\n\n### Objective\nUse `man`, `--help`, Tab completion, history and `Ctrl+R`; handle file names containing spaces or starting with `-`; recover when a command misbehaves.\n\n### Before you start\nLinux terminal. The folder `~/lab/m01/messy` was prepared for you.\n\n### Concepts and commands\n```linux\nman ls\n```\nOpens the manual for `ls`. Move with the arrow keys or Space, search with `/human` then Enter, jump to the next match with `n`, quit with `q`.\n\n```linux\nls --help | less\n```\nMost commands print a short usage summary with `--help`. Piping it into `less` lets you scroll (pipes are module 2; for now, read it as \"show it page by page\").\n\n```linux\nman 5 passwd\n```\nManual pages are grouped in **sections**. Section 1 is commands (`man 1 passwd` documents the `passwd` command); section 5 is file formats (`man 5 passwd` documents the `/etc/passwd` file). `man man` lists the sections.\n\n```linux\ncd ~/lab/m01/messy\nls -l\n```\n```text\n-rw-r--r-- 1 student student 25 Nov 11 10:00 -old-notes.txt\n-rw-r--r-- 1 student student 31 Nov 11 10:00 quarterly report.txt\n```\n\n```linux\nmv \"quarterly report.txt\" quarterly-report.txt\n```\nThe shell splits words on spaces, so a name with a space must be **quoted** (or the space escaped: `quarterly\\ report.txt`). Tip: type `quar` and press Tab - completion escapes it for you.\n\n```linux\nrm -- -old-notes.txt\n```\n`rm -old-notes.txt` fails because `rm` thinks `-o...` are options (`rm: invalid option -- 'o'`). `--` tells a command \"everything after this is a file name\". `rm ./-old-notes.txt` also works.\n\n```linux\nhistory | tail -5\n```\nShows your last commands with numbers. Press `Ctrl+R` and type `quar` to find the `mv` command again without retyping it.\n\n### Your task\n1. In `~/lab/m01/messy`: rename `quarterly report.txt` to `quarterly-report.txt` and delete `-old-notes.txt`. Do not touch `keep-me.txt`.\n2. Create `~/lab/m01/help.txt` with these lines, filling each answer from `man` or `--help`:\n```text\nhuman=<the ls option that prints sizes like 1K 234M 2G>\nhidden=<the ls option that also shows names starting with .>\ninteractive=<the rm option that asks before every removal>\npasswd_section=<the man section number that documents the /etc/passwd FILE format>\ncancel=<the key combination that cancels a running command, written like ctrl+x>\n```\n\n### Verify\n`ls -l ~/lab/m01/messy` should show `keep-me.txt` and `quarterly-report.txt` only. `cat ~/lab/m01/help.txt`. Then **Check my work**.\n\n### If it fails\n- *`mv: target 'report.txt' is not a directory`*: the space was not quoted, so `mv` saw three arguments.\n- *`rm: invalid option -- 'o'`*: add `--` before the name.\n- *An answer is wrong*: search the man page with `/` (for example `/human` in `man ls`).\n- Stuck inside `man` or `less`? Press `q`. Stuck with no prompt? `Ctrl+C`.\n\n### Hint 1\nFor the renames: quotes protect spaces, and `--` protects names that start with a dash. For the questions: `man ls` then type `/human` and Enter.\n\n### Hint 2\n`ls -h` alone does nothing visible; it changes sizes in long format (`ls -lh`). Look in `man rm` for \"prompt before every removal\". `man man` lists the sections: 5 is file formats.\n\n### Hint 3\nThe answers are `-h`, `-a`, `-i`, `5` and `ctrl+c`.\n\n### Walkthrough\n```linux\ncd ~/lab/m01/messy\nls -l\nmv \"quarterly report.txt\" quarterly-report.txt\nrm -- -old-notes.txt\nls -l\n```\n```text\n-rw-r--r-- 1 student student 18 Nov 11 10:00 keep-me.txt\n-rw-r--r-- 1 student student 31 Nov 11 10:00 quarterly-report.txt\n```\n```linux\nman ls        # type /human  -> -h, --human-readable ; q to quit\nman rm        # -i  prompt before every removal\nman man       # section 5 = File formats and conventions\nnano ~/lab/m01/help.txt\n```\n```text\nhuman=-h\nhidden=-a\ninteractive=-i\npasswd_section=5\ncancel=ctrl+c\n```\n```linux\nlab check m01-help-mistakes\n```\nNow try `Ctrl+R` and type `mv \"q` - the shell finds your earlier command. Press `Ctrl+C` to leave the search without running it.", "group": "Module 1 exercises"}, {"id": "m02", "title": "Module 2: Read and investigate a system", "md": "*Pipes, redirection, grep/sort/uniq/awk, find, processes, services, logs and your first Bash scripts - used to answer access questions.*\n\nAn IAM analyst spends a lot of time **answering questions**: who logged in, who failed, who owns these files, which account runs this service. Linux answers them when you combine small commands.\n\n## Redirection: where output goes\n\n| Syntax | Meaning |\n|---|---|\n| `cmd > file` | write output to a file (**replaces** the file) |\n| `cmd >> file` | **append** output to a file |\n| `cmd 2> errors.txt` | write error messages (stream 2, *stderr*) to a file |\n| `cmd > out.txt 2>&1` | send output and errors to the same file |\n| `cmd 2>/dev/null` | throw error messages away |\n| `cmd < file` | read input from a file |\n\n## Pipes: chain commands\n\n`cmd1 | cmd2` feeds the output of `cmd1` into `cmd2`. Each command does one small job:\n\n```linux\ngrep \"Failed password\" /opt/lab-data/logs/auth-2026-11-10.log | wc -l\n```\n`grep PATTERN FILE` keeps only matching lines; `wc -l` counts lines. Together: \"how many failed passwords?\"\n\n| Command | Job | Useful options |\n|---|---|---|\n| `grep` | keep matching lines | `-i` ignore case, `-v` invert, `-c` count, `-E` extended regex, `-o` print only the match, `-r` recurse into folders |\n| `sort` | sort lines | `-n` numeric, `-r` reverse, `-u` unique, `-t: -k3` sort by field 3 split on `:` |\n| `uniq` | collapse **adjacent** duplicates (so `sort` first) | `-c` count each |\n| `cut` | pick columns | `-d: -f1,7` split on `:` and keep fields 1 and 7 |\n| `awk` | pick and test fields | `awk '{print $9}'` prints the 9th space-separated word; `awk -F: '$3>=1000'` |\n| `head` / `tail` | first / last lines | `-n 5`; `tail -f` follows a growing file (Ctrl+C stops) |\n| `wc` | count | `-l` lines, `-w` words |\n| `tee` | show **and** save | `cmd | tee out.txt` |\n\nA classic \"top talkers\" pipeline:\n```linux\ngrep \"Failed password\" auth.log | grep -oE 'from [0-9.]+' | sort | uniq -c | sort -rn | head -3\n```\n```text\n     41 from 203.0.113.45\n     12 from 198.51.100.7\n      3 from 192.0.2.77\n```\n\n## Finding files\n\n```linux\nfind /srv -type f -perm -o+w -ls\n```\n`find START TESTS ACTIONS`. Tests: `-type f` (files) / `-type d` (folders), `-name '*.csv'`, `-user btran`, `-group finance`, `-nouser` (owner no longer exists), `-perm -o+w` (writable by everyone), `-mtime -1` (changed in the last day). Actions: print (default), `-ls`, `-exec cmd {} +`. Add `2>/dev/null` to hide \"Permission denied\" noise.\n\n## Processes, services and ports\n\n| Command | Answers |\n|---|---|\n| `ps aux` / `ps -ef` | every process with its owner (USER column) |\n| `ps -o user,pid,cmd -C python3` | processes named python3, chosen columns |\n| `pgrep -u btran -l` | processes owned by a user |\n| `systemctl status NAME` | is a service running, its main PID, last log lines |\n| `systemctl show -p User,MainPID NAME` | one property at a time - script-friendly |\n| `systemctl list-units --type=service` | all services |\n| `journalctl -u NAME -n 20` | the service's last 20 log lines (`-f` follows, `--since \"1 hour ago\"`) |\n| `ss -ltnp` | listening TCP ports (`-l` listening, `-t` TCP, `-n` numbers, `-p` process; needs `sudo` to see other users' processes) |\n\n## Small Bash scripts\n\nA script is a text file of commands:\n```linux\n#!/usr/bin/env bash\nset -euo pipefail\nfor u in btran jkim; do\n  echo \"$u: $(id -nG \"$u\")\"\ndone\n```\n- The first line (**shebang**) says which program runs the file.\n- `set -euo pipefail`: stop on errors (`-e`), on unset variables (`-u`), and when any part of a pipe fails (`pipefail`). It makes scripts fail loudly instead of doing damage quietly.\n- Make it executable with `chmod +x script.sh`, run it as `./script.sh` or put it in `~/bin` (already on your `PATH`).\n- Quote variables: `\"$u\"`, not `$u`.\n", "group": "Lessons"}, {"id": "m02-pipes-logs", "title": "m02-pipes-logs: Count failed logins in last night's log", "md": "### Ticket\n**SEC-2001** - *From: Security Operations* - \"We saw a spike of SSH failures on a server overnight. A copy of its auth log is in `/opt/lab-data/logs/auth-2026-11-10.log`. Tell us: how many failed password attempts were there, which username was tried most, which source IP was the noisiest, and which real users logged in successfully. Put the answers in `~/lab/m02/failed-logins.txt`.\"\n\n### Objective\nAnswer access questions from a log with `grep`, `cut`/`awk`, `sort`, `uniq -c`, `wc -l`, pipes and redirection.\n\n### Before you start\nLinux terminal. The log is a fictional copy; IP addresses are from documentation ranges (`192.0.2.x`, `198.51.100.x`, `203.0.113.x`).\n\n### Concepts and commands\n```linux\nLOG=/opt/lab-data/logs/auth-2026-11-10.log\nhead -5 \"$LOG\"\n```\n`LOG=...` stores the path in a shell variable so you do not retype it. `head -5` shows the first 5 lines. Typical lines:\n```text\nNov 10 01:02:11 web01 sshd[2101]: Failed password for root from 203.0.113.45 port 50122 ssh2\nNov 10 01:02:15 web01 sshd[2103]: Failed password for invalid user oracle from 198.51.100.7 port 40022 ssh2\nNov 10 08:01:44 web01 sshd[3001]: Accepted publickey for btran from 192.0.2.10 port 50100 ssh2: ED25519 SHA256:...\n```\nNote the two shapes of failure: a real account (`for root`) and a non-existent one (`for invalid user oracle`). That shifts the word positions, so counting \"the 9th word\" is not reliable.\n\n```linux\ngrep -c \"Failed password\" \"$LOG\"\n```\n`-c` counts matching lines instead of printing them.\n\n```linux\ngrep \"Failed password\" \"$LOG\" | grep -oE 'for (invalid user )?[^ ]+' | awk '{print $NF}' | sort | uniq -c | sort -rn | head -3\n```\n- `grep -oE '...'` prints only the matched part, using an extended regular expression. `(invalid user )?` means \"optionally this text\"; `[^ ]+` means \"one or more non-space characters\".\n- `awk '{print $NF}'` prints the last word (`NF` = number of fields), which is the username.\n- `sort | uniq -c` counts each distinct name; `sort -rn` puts the biggest count first.\n```text\n     41 root\n     12 oracle\n      8 admin\n```\n\n```linux\ngrep \"Accepted\" \"$LOG\" | awk '{print $9}' | sort -u\n```\nFor `Accepted ... for USER from ...` lines the username is always word 9. `sort -u` sorts and removes duplicates.\n\n```linux\nmkdir -p ~/lab/m02\necho \"total_failed=57\" > ~/lab/m02/failed-logins.txt\necho \"top_user=root\" >> ~/lab/m02/failed-logins.txt\n```\n`>` creates/replaces the file, `>>` appends. (These numbers are only examples.)\n\n### Your task\nCreate `~/lab/m02/failed-logins.txt` with:\n```text\ntotal_failed=<number of \"Failed password\" lines>\ntop_user=<username with the most failed passwords>\ntop_ip=<source IP with the most failed passwords>\naccepted_users=<users with an \"Accepted\" login, sorted, comma-separated, e.g. alice,bob>\n```\n\n### Verify\n`cat ~/lab/m02/failed-logins.txt`, re-run your pipelines and compare. Then **Check my work**.\n\n### If it fails\n- *total_failed is wrong*: make sure you search for exactly `Failed password` (capital F) and count with `-c` or `wc -l`.\n- *top_user is wrong*: did you handle `invalid user NAME` lines? Print the usernames before counting to see what you are counting.\n- *top_ip is wrong*: extract the address after `from`, not the port.\n- *accepted_users*: commas, no spaces, alphabetical.\n\n### Hint 1\nBuild pipelines step by step: run `grep \"Failed password\" \"$LOG\" | head` first, then add one command at a time and look at the output.\n\n### Hint 2\nFor IPs: `grep \"Failed password\" \"$LOG\" | grep -oE 'from [0-9.]+' | sort | uniq -c | sort -rn | head -1`. For accepted users, `paste -sd, -` joins lines with commas.\n\n### Hint 3\nUsernames: `grep \"Failed password\" \"$LOG\" | grep -oE 'for (invalid user )?[^ ]+' | awk '{print $NF}' | sort | uniq -c | sort -rn | head -1`. Accepted: `grep Accepted \"$LOG\" | awk '{print $9}' | sort -u | paste -sd, -`.\n\n### Walkthrough\n```linux\nLOG=/opt/lab-data/logs/auth-2026-11-10.log\nmkdir -p ~/lab/m02\nTOTAL=$(grep -c \"Failed password\" \"$LOG\")\nTOPUSER=$(grep \"Failed password\" \"$LOG\" | grep -oE 'for (invalid user )?[^ ]+' | awk '{print $NF}' | sort | uniq -c | sort -rn | head -1 | awk '{print $2}')\nTOPIP=$(grep \"Failed password\" \"$LOG\" | grep -oE 'from [0-9.]+' | awk '{print $2}' | sort | uniq -c | sort -rn | head -1 | awk '{print $2}')\nACCEPTED=$(grep \"Accepted\" \"$LOG\" | awk '{print $9}' | sort -u | paste -sd, -)\nprintf 'total_failed=%s\\ntop_user=%s\\ntop_ip=%s\\naccepted_users=%s\\n' \"$TOTAL\" \"$TOPUSER\" \"$TOPIP\" \"$ACCEPTED\" > ~/lab/m02/failed-logins.txt\ncat ~/lab/m02/failed-logins.txt\nlab check m02-pipes-logs\n```\n`$(command)` runs a command and substitutes its output. `printf` writes the four lines in one go.\n\n**Why it matters:** \"which accounts are being attacked, from where, and did anyone get in\" is the first question in every authentication incident.", "group": "Module 2 exercises"}, {"id": "m02-find-files", "title": "m02-find-files: Find risky files on the shared drive", "md": "### Ticket\n**SEC-2002** - *From: Internal Audit* - \"Before the quarterly review, list (1) every file under `/srv/lab02/share` that **anyone** on the server can modify, and (2) every file there whose owner account **no longer exists**. Save the lists, one absolute path per line, sorted, in `~/lab/m02/world-writable.txt` and `~/lab/m02/orphans.txt`.\"\n\n### Objective\nUse `find` with permission and ownership tests, sort its output and save it with redirection.\n\n### Before you start\nLinux terminal. `/srv/lab02/share` is readable by everyone, so no `sudo` is needed.\n\n### Concepts and commands\n```linux\nls -l /srv/lab02/share/reports\n```\n```text\n-rw-rw-rw- 1 btran  btran  44 Nov 11 10:00 q3-summary.txt\n-rw-r--r-- 1   2999   2999 51 Nov 11 10:00 vendor-contacts.csv\n```\nThe last `w` in `rw-rw-rw-` means **others** (everyone) can write. A **number instead of a name** in the owner column means the UID has no account any more: an *orphaned* file. Orphans are an audit finding because a new account that later receives UID 2999 would silently own them.\n\n```linux\nfind /srv/lab02/share -type f -perm -o+w\n```\n- `-type f` regular files only (not folders).\n- `-perm -o+w` files where the \"others write\" bit is set. The leading `-` means \"at least these bits\", so `666` and `777` both match.\n```text\n/srv/lab02/share/reports/q3-summary.txt\n/srv/lab02/share/tmp/upload.sh\n```\n\n```linux\nfind /srv/lab02/share -type f -nouser\n```\n`-nouser` matches files whose owner UID is not in the account database (`-nogroup` does the same for groups).\n\n```linux\nfind /srv/lab02/share -type f -perm -o+w | sort > ~/lab/m02/world-writable.txt\n```\nPipe to `sort` for a stable order, then `>` to save. `wc -l FILE` counts the lines.\n\n```linux\nfind /srv/lab02/share -type f -perm -o+w -ls\n```\n`-ls` prints details like `ls -l` - useful for the report.\n\n### Your task\n1. `~/lab/m02/world-writable.txt`: absolute paths of all **regular files** under `/srv/lab02/share` that are writable by others, sorted, one per line.\n2. `~/lab/m02/orphans.txt`: absolute paths of all **regular files** under `/srv/lab02/share` whose owner does not exist, sorted, one per line.\nDo not change the files - this is an investigation only.\n\n### Verify\n`cat` both files and spot-check a few entries with `ls -l`. Then **Check my work**.\n\n### If it fails\n- *extra entries*: you forgot `-type f` and listed folders too.\n- *missing entries*: start `find` at `/srv/lab02/share`, not a subfolder.\n- *relative paths*: start the search with the absolute path so the output is absolute.\n- *the file changed permissions*: you were asked not to fix them yet. Press **Retry exercise**.\n\n### Hint 1\nTwo `find` commands, both starting at `/srv/lab02/share` with `-type f`. One test checks a permission bit, the other checks ownership.\n\n### Hint 2\n`-perm -o+w` finds files writable by others; `-nouser` finds files with no owner account.\n\n### Hint 3\n`find /srv/lab02/share -type f -perm -o+w | sort > ~/lab/m02/world-writable.txt` and `find /srv/lab02/share -type f -nouser | sort > ~/lab/m02/orphans.txt`.\n\n### Walkthrough\n```linux\nmkdir -p ~/lab/m02\nfind /srv/lab02/share -type f -perm -o+w -ls\nfind /srv/lab02/share -type f -perm -o+w | sort > ~/lab/m02/world-writable.txt\nfind /srv/lab02/share -type f -nouser -ls\nfind /srv/lab02/share -type f -nouser | sort > ~/lab/m02/orphans.txt\nwc -l ~/lab/m02/world-writable.txt ~/lab/m02/orphans.txt\nlab check m02-find-files\n```\nIn a real review you would now open a remediation ticket: remove the world-write bit (`chmod o-w`) and reassign orphans to the data owner (`chown`), which module 4 teaches.", "group": "Module 2 exercises"}, {"id": "m02-processes-services", "title": "m02-processes-services: Which account runs the Falcon web app?", "md": "### Ticket\n**OPS-2003** - *From: Application owner* - \"For the service-account inventory, tell us which Linux account runs the **falcon-web** service, its main process ID, the TCP port it listens on, whether it is running, and whether it starts at boot. Answers in `~/lab/m02/falcon.txt`.\"\n\n### Objective\nInspect services with `systemctl`, processes with `ps`, ports with `ss`, and service logs with `journalctl`.\n\n### Before you start\nLinux terminal. `falcon-web` is a small demo web app installed by the lab.\n\n### Concepts and commands\n```linux\nsystemctl status falcon-web\n```\nShows whether the service is `active (running)`, whether it is `enabled` (starts at boot), its **Main PID** and recent log lines. Press `q` if it opens in a pager.\n```text\n\u25cf falcon-web.service - Falcon web demo app (Linux IAM Lab)\n     Loaded: loaded (/etc/systemd/system/falcon-web.service; enabled; preset: enabled)\n     Active:
