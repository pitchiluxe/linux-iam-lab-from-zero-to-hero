oken-ssh: \"Permission denied (publickey)\" for Hana", "md": "### Ticket\n**HELP-6002** - *From: Hana Lopez* - \"My SSH key worked last week. Now I get `Permission denied (publickey)`. Someone 'fixed' my home folder permissions over the weekend so the team could drop files in. I haven't changed my key.\"\n\n### Objective\nDiagnose a failed key login from the **server-side log**, and fix the root cause without weakening security.\n\n### Before you start\nLinux terminal with `sudo`. Hana's key is installed in `/home/hlopez/.ssh/authorized_keys`. **Check my work** logs in with her key.\n\n### Concepts and commands\n```linux\nsudo journalctl -u ssh -n 30 --no-pager | grep -i hlopez\n```\nThe server tells you exactly why it ignored the key (the client only says \"Permission denied\"):\n```text\nsshd[4242]: Authentication refused: bad ownership or modes for directory /home/hlopez\n```\n\n```linux\nsudo namei -l /home/hlopez/.ssh/authorized_keys\n```\nShows owner and mode of every step - the home folder, `.ssh`, and the file.\n```text\ndrwxrwxrwx hlopez hlopez hlopez\ndrwxrwxrwx hlopez hlopez .ssh\n-rw-rw-rw- root   root   authorized_keys\n```\nThree problems: world-writable home, world-writable `.ssh`, and a world-writable key file owned by root. Anyone on the server could add their own key and become Hana.\n\n```linux\nsudo chmod 750 /home/hlopez\nsudo chmod 700 /home/hlopez/.ssh\nsudo chown hlopez:hlopez /home/hlopez/.ssh/authorized_keys\nsudo chmod 600 /home/hlopez/.ssh/authorized_keys\n```\n\n### Your task\n1. Find the reason in the server log.\n2. Fix ownership and modes so StrictModes accepts the key: home not group/world-writable, `.ssh` `700`, `authorized_keys` `600`, both owned by `hlopez`.\n3. Do **not** disable `StrictModes`. Team file drops belong in a shared folder (module 4), not in someone's home.\n\n### Verify\n`sudo namei -l /home/hlopez/.ssh/authorized_keys`, then **Check my work** (real login with her key).\n\n### If it fails\n- *still refused*: read the newest log line again - it names the next bad path.\n- *you changed sshd_config*: undo it; the fix is file permissions.\n\n### Hint 1\nThe client never says why; the server log does. Search the ssh service log for hlopez.\n\n### Hint 2\nThree paths are involved: `/home/hlopez`, `/home/hlopez/.ssh`, `/home/hlopez/.ssh/authorized_keys`. Check owner and mode of each.\n\n### Hint 3\n`chmod 750` on the home, `chmod 700` on `.ssh`, `chown hlopez:hlopez` and `chmod 600` on `authorized_keys`.\n\n### Walkthrough\n```linux\nsudo journalctl -u ssh -n 50 --no-pager | grep -i 'hlopez'\nsudo namei -l /home/hlopez/.ssh/authorized_keys\nsudo chmod 750 /home/hlopez\nsudo chmod 700 /home/hlopez/.ssh\nsudo chown hlopez:hlopez /home/hlopez/.ssh/authorized_keys\nsudo chmod 600 /home/hlopez/.ssh/authorized_keys\nsudo namei -l /home/hlopez/.ssh/authorized_keys\nlab check m06-broken-ssh\n```\n```text\ndrwxr-x--- hlopez hlopez hlopez\ndrwx------ hlopez hlopez .ssh\n-rw------- hlopez hlopez authorized_keys\n```\n**Why sshd is strict:** if others can write your `authorized_keys`, they can log in as you. Weak permissions on credential files are an identity compromise waiting to happen.", "group": "Module 6 exercises"}, {"id": "m06-sshd-hardening", "title": "m06-sshd-hardening: Harden the SSH server and restrict who may log in", "md": "### Ticket\n**SEC-6003** - *Approved by: CISO* - \"Apply the SSH baseline to `iamlab01`: no root login, at most 3 authentication attempts, 30-second login grace time, no X11 forwarding, and **only members of `ssh-users` may log in over SSH**. Amara Okafor (`aokafor`) needs remote access from now on; Jae Kim (`jkim`) must not have it. Put the settings in `/etc/ssh/sshd_config.d/10-hardening.conf`.\"\n\n### Objective\nChange sshd safely: write a drop-in file, validate with `sshd -t`, inspect the effective config with `sshd -T`, reload, and prove allowed and denied logins - without locking out administrators.\n\n### Before you start\nLinux terminal with `sudo`. **Safety first:** keep this terminal open. Check that the accounts that must keep access are in `ssh-users`: `getent group ssh-users`. The lab's automation account `labctl` and your `student` account already are.\n\n### Concepts and commands\n```linux\ngetent group ssh-users\nsudo usermod -aG ssh-users aokafor\n```\nAdd people **before** turning on `AllowGroups`, otherwise you deny them.\n\n```linux\nsudo nano /etc/ssh/sshd_config.d/10-hardening.conf\n```\n```conf\n# SEC-6003 SSH baseline\nPermitRootLogin no\nMaxAuthTries 3\nLoginGraceTime 30\nX11Forwarding no\nAllowGroups ssh-users\n```\nDrop-in files are read in name order and **the first value wins**, so `10-...` beats the lab's `50-...` and Ubuntu's `60-...` files.\n\n```linux\nsudo sshd -t && echo \"config OK\"\n```\n`-t` test mode: prints errors such as `/etc/ssh/sshd_config.d/10-hardening.conf line 3: Bad configuration option: MaxAuthTry` and exits non-zero. Never reload an invalid config.\n\n```linux\nsudo sshd -T -C user=jkim,host=laptop,addr=10.0.2.2 | grep -Ei 'permitrootlogin|maxauthtries|logingracetime|x11forwarding|allowgroups'\n```\n`-T` prints the effective settings; `-C` evaluates them for a hypothetical connection (user, client host name, address).\n```text\npermitrootlogin no\nmaxauthtries 3\nlogingracetime 30\nx11forwarding no\nallowgroups ssh-users\n```\n\n```linux\nsudo systemctl reload ssh\nsudo journalctl -u ssh -n 5 --no-pager\n```\n`reload` re-reads the config without dropping existing connections.\n\n```linux\nssh -i ~/.ssh/id_ed25519 student@localhost hostname\n```\nTest that **you** can still get in, from a new connection, before you close anything.\n\n### Your task\n1. Add `aokafor` to `ssh-users`. Do not add `jkim`.\n2. Create `/etc/ssh/sshd_config.d/10-hardening.conf` with the five settings.\n3. Validate, reload, and confirm with `sshd -T`.\n4. Confirm you (student) can still log in over SSH.\n\n### Verify\n**Check my work** validates the config and performs real key logins: `aokafor` allowed, `jkim` denied, `labctl` still allowed.\n\n### If it fails\n- *`sshd -t` error*: the message names the file and line; fix the spelling.\n- *aokafor denied*: `id aokafor` must show `ssh-users`.\n- *`ssh linux-iam-lab` from Windows stopped working*: your account is not in `ssh-users` or the file has a typo in the group name. Use the portal terminal (it does not use SSH) to fix it, or `lab rescue sshd`.\n\n### Hint 1\nOrder matters: group membership first, config second, `sshd -t` third, reload last.\n\n### Hint 2\nThe five settings are `PermitRootLogin no`, `MaxAuthTries 3`, `LoginGraceTime 30`, `X11Forwarding no`, `AllowGroups ssh-users`.\n\n### Hint 3\n`sudo usermod -aG ssh-users aokafor`, write the file with `sudo nano`, then `sudo sshd -t && sudo systemctl reload ssh`.\n\n### Walkthrough\n```linux\ngetent group ssh-users\nsudo usermod -aG ssh-users aokafor\nsudo tee /etc/ssh/sshd_config.d/10-hardening.conf > /dev/null <<'EOF'\n# SEC-6003 SSH baseline\nPermitRootLogin no\nMaxAuthTries 3\nLoginGraceTime 30\nX11Forwarding no\nAllowGroups ssh-users\nEOF\nsudo sshd -t && echo \"config OK\"\nsudo sshd -T -C user=jkim,host=laptop,addr=10.0.2.2 | grep -Ei 'permitrootlogin|maxauthtries|logingracetime|x11forwarding|allowgroups'\nsudo systemctl reload ssh\nssh -i ~/.ssh/id_ed25519 student@localhost hostname\nlab check m06-sshd-hardening\n```\n`sudo tee FILE > /dev/null` writes text as root (a plain `sudo cat > FILE` would not work, because the `>` redirection runs as you). After the check, look at the denial in the log: `sudo journalctl -u ssh -n 20 --no-pager | grep jkim`.\n```text\nsshd[5120]: User jkim from 127.0.0.1 not allowed because none of user's groups are listed in AllowGroups\n```", "group": "Module 6 exercises"}, {"id": "m06-revoke-key", "title": "m06-revoke-key: A laptop was stolen - revoke its SSH key", "md": "### Ticket\n**SEC-6004** - *Priority: High* - \"Eli Novak's laptop was stolen at the airport. Revoke the key on it (`enovak_laptop`, fingerprint in `/opt/lab-data/tickets/SEC-6004.txt`) on `iamlab01` **now**. His tablet key must keep working. Make sure the stolen key cannot be re-added by mistake later.\"\n\n### Objective\nIdentify a specific key among several by fingerprint, remove it, block it server-wide with `RevokedKeys`, and prove the stolen key is denied while the legitimate one works.\n\n### Before you start\nLinux terminal with `sudo`. Eli has two keys in `/home/enovak/.ssh/authorized_keys`. The lab holds copies of both private keys to test them.\n\n### Concepts and commands\n```linux\ncat /opt/lab-data/tickets/SEC-6004.txt\nsudo ssh-keygen -lf /home/enovak/.ssh/authorized_keys\n```\nRun against an `authorized_keys` file, `ssh-keygen -lf` prints one fingerprint per line, in file order - so you can match line numbers to fingerprints.\n```text\n256 SHA256:aaaa... enovak_laptop (ED25519)\n256 SHA256:bbbb... enovak_tablet (ED25519)\n```\n\n```linux\nsudo grep -n enovak_laptop /home/enovak/.ssh/authorized_keys\nsudo sed -i '/enovak_laptop$/d' /home/enovak/.ssh/authorized_keys\n```\n`grep -n` shows line numbers. `sed -i '/PATTERN/d'` deletes matching lines **in place**. Comments can be edited by anyone who can edit the file, so confirm by fingerprint afterwards, not only by comment.\n\n```linux\nsudo install -m 644 /dev/null /etc/ssh/revoked_keys\nsudo cp /opt/lab-data/keys/enovak_laptop.pub /tmp/stolen.pub\ncat /tmp/stolen.pub | sudo tee -a /etc/ssh/revoked_keys\n```\n`RevokedKeys` is a server-wide deny list of public keys: a listed key is refused for **every** account, even if someone adds it back to an `authorized_keys` file.\n\n```linux\necho 'RevokedKeys /etc/ssh/revoked_keys' | sudo tee /etc/ssh/sshd_config.d/20-revoked-keys.conf\nsudo sshd -t && sudo systemctl reload ssh\nsudo sshd -T | grep -i revokedkeys\n```\n\n### Your task\n1. Identify the stolen key by fingerprint and remove it from enovak's `authorized_keys`; keep the tablet key.\n2. Add the stolen public key to `/etc/ssh/revoked_keys` and enable `RevokedKeys /etc/ssh/revoked_keys` in a drop-in config file. Validate and reload.\n\n### Verify\n`sudo ssh-keygen -lf /home/enovak/.ssh/authorized_keys` shows only the tablet. **Check my work** tries both keys for real, and also tries the stolen key after temporarily re-adding it (it must still be refused).\n\n### If it fails\n- *tablet key also denied*: you removed both lines, or `enovak` is not allowed by `AllowGroups` (he is in `ssh-users` - check `id enovak`).\n- *stolen key still works after re-adding*: `RevokedKeys` is not active - check `sudo sshd -T | grep -i revokedkeys` and that the file contains the key.\n\n### Hint 1\nFingerprints first (`ssh-keygen -lf` on the ticket's key and on the authorized_keys file), then delete exactly one line.\n\n### Hint 2\nFor the \"cannot be re-added\" part look at the sshd setting `RevokedKeys` (`man sshd_config`).\n\n### Hint 3\n`sudo sed -i '/enovak_laptop$/d' /home/enovak/.ssh/authorized_keys`; `cat /opt/lab-data/keys/enovak_laptop.pub | sudo tee -a /etc/ssh/revoked_keys`; `echo 'RevokedKeys /etc/ssh/revoked_keys' | sudo tee /etc/ssh/sshd_config.d/20-revoked-keys.conf`; `sudo sshd -t && sudo systemctl reload ssh`.\n\n### Walkthrough\n```linux\ncat /opt/lab-data/tickets/SEC-6004.txt\nsudo ssh-keygen -lf /home/enovak/.ssh/authorized_keys\nsudo sed -i '/enovak_laptop$/d' /home/enovak/.ssh/authorized_keys\nsudo ssh-keygen -lf /home/enovak/.ssh/authorized_keys\ncat /opt/lab-data/keys/enovak_laptop.pub | sudo tee -a /etc/ssh/revoked_keys\nsudo chmod 644 /etc/ssh/revoked_keys\necho 'RevokedKeys /etc/ssh/revoked_keys' | sudo tee /etc/ssh/sshd_config.d/20-revoked-keys.conf\nsudo sshd -t && sudo systemctl reload ssh\nsudo sshd -T | grep -i revokedkeys\nlab check m06-revoke-key\n```\n```text\nrevokedkeys /etc/ssh/revoked_keys\n```\n**Also in a real incident:** check the auth log for logins with that fingerprint since the theft (`sudo journalctl -u ssh | grep 'SHA256:...'`), revoke the same key on every other server (automation!), and record it all in the ticket.", "group": "Module 6 exercises"}, {"id": "m07", "title": "Module 7: Authentication and centralized identity", "md": "*Authentication vs authorization, where PAM and NSS fit, and how Linux resolves identities from a directory through SSSD - with the lab's own disposable LDAP directory.*\n\nLarge organisations do not create accounts on every server. People live in a **directory** (Active Directory, FreeIPA, OpenLDAP, Entra ID via a bridge) and Linux servers **look them up**. This module uses the lab's own small OpenLDAP directory `dc=iamlab,dc=test` running **inside the lab VM** - it is disposable, contains only fictional people, and is completely separate from any other lab or server you have.\n\n## Three questions on every login\n\n| Question | Called | Linux component |\n|---|---|---|\n| *Who is \"pshah\"? What UID, groups, home?* | identity lookup | **NSS** (Name Service Switch), `/etc/nsswitch.conf` |\n| *Is this really pshah?* (password, key, MFA) | **authentication** (authN) | **PAM** `auth` phase, `/etc/pam.d/` |\n| *Is pshah allowed in here, now?* | **authorization** (authZ) | PAM `account` phase, sshd `AllowGroups`, sudo rules, file permissions |\n\nA correct password with \"access denied\" is an **authorization** failure, not an authentication failure - an important distinction when you triage tickets.\n\n## NSS\n\n```linux\ngrep -E '^(passwd|group|shadow)' /etc/nsswitch.conf\n```\n```text\npasswd:         files systemd sss\ngroup:          files systemd sss\nshadow:         files systemd sss\n```\nSources are tried left to right: local files, then systemd's dynamic users, then **sss** (SSSD). `getent passwd NAME` uses this chain; `getent -s files passwd NAME` or `-s sss` asks one source only.\n\n## PAM\n\nEach program that authenticates has a file in `/etc/pam.d/` (`sshd`, `sudo`, `login`, `su`...). Most include the shared stacks:\n\n| Stack | Typical modules here |\n|---|---|\n| `common-auth` | `pam_faillock` (lockout), `pam_unix` (local passwords), `pam_sss` (directory passwords) |\n| `common-account` | `pam_unix` (expiry), `pam_sss` (SSSD access rules) |\n| `common-session` | `pam_mkhomedir` (create home at first login), `pam_systemd` |\n| `common-password` | password changes |\n\nEach line has a **control** (`required`, `requisite`, `sufficient`, `[success=1 default=ignore]`) that decides what happens on success or failure. Do not hand-edit these stacks on Ubuntu; use `pam-auth-update`. A broken PAM stack can lock **everyone** out.\n\n## SSSD\n\n**SSSD** (System Security Services Daemon) connects NSS and PAM to the directory, caches results, and enforces access rules. Config: `/etc/sssd/sssd.conf` (must be mode `600`). In this lab:\n\n```ini\n[domain/iamlab.test]\nid_provider = ldap            # identities from LDAP\nauth_provider = ldap          # passwords checked by binding to LDAP\naccess_provider = simple      # authorization rule:\nsimple_allow_groups = linux-login   # only this directory group may log in\nldap_uri = ldap://ldap.iamlab.test\nldap_id_use_start_tls = true  # encrypt (StartTLS) and verify the server certificate\n```\n\nUseful commands: `sudo sssctl domain-status iamlab.test`, `sudo sssctl user-checks USER` (runs the PAM checks for a user), `sudo sss_cache -E` (forget cached entries - after directory changes), `sudo journalctl -u sssd`.\n\n## LDAP in brief\n\nThe directory is a tree of entries, each with a **DN** (distinguished name), e.g. `uid=pshah,ou=people,dc=iamlab,dc=test`. Users have `uid`, `uidNumber`, `gidNumber`, `homeDirectory`, `loginShell`; POSIX groups list members as `memberUid`.\n\n```linux\nldapsearch -x -ZZ -H ldap://ldap.iamlab.test -b dc=iamlab,dc=test '(uid=pshah)' uid uidNumber title\n```\n- `-x` simple authentication (here anonymous), `-ZZ` require StartTLS, `-H` server URI, `-b` search base, then a **filter** and the attributes to return.\n\nChanges are written as **LDIF** with `ldapmodify`, binding as an administrator (`-D DN -y passwordfile`). In this lab, members of `diradmins` (you) can read the directory admin password file `/etc/linux-iam-lab/ldap-admin.pw`. Never paste it into chats or tickets.\n", "group": "Lessons"}, {"id": "m07-authn-authz", "title": "m07-authn-authz: Map how Linux decides who you are", "md": "### Ticket\n**IAM-7001** - *From: IAM Architect* - \"Before we connect more servers to the directory, document how `iamlab01` resolves and authenticates users. Answer the questions in `~/lab/m07/stack.txt`.\"\n\n### Objective\nRead `nsswitch.conf` and the PAM stack, tell local and directory users apart, and explain the difference between an authentication and an authorization failure.\n\n### Before you start\nLinux terminal; `sudo` for logs and `sssctl`. Directory users: `nwalker`, `pshah`, `tcole`, `mfischer`.\n\n### Concepts and commands\n```linux\ngrep '^passwd' /etc/nsswitch.conf\ngetent passwd nwalker\ngetent -s files passwd nwalker; echo \"files: exit $?\"\ngetent -s sss passwd nwalker\n```\n`getent -s SOURCE` asks one source. Exit code `2` = not found there.\n```text\nnwalker:*:10001:10000:Nadia Walker:/home/nwalker:/bin/bash\nfiles: exit 2\nnwalker:*:10001:10000:Nadia Walker:/home/nwalker:/bin/bash\n```\n`nwalker` exists only in the directory (via SSSD), not in `/etc/passwd`.\n\n```linux\ngrep -v '^#' /etc/pam.d/sshd | grep -v '^$'\ngrep -v '^#' /etc/pam.d/common-auth | grep -v '^$'\n```\n```text\n@include common-auth\naccount    required     pam_nologin.so\n@include common-account\n...\nauth    requisite                       pam_faillock.so preauth\nauth    [success=2 default=ignore]      pam_unix.so nullok\nauth    [success=1 default=ignore]      pam_sss.so use_first_pass\nauth    [default=die]                   pam_faillock.so authfail\n...\n```\nRead top-down: lockout check first, then local passwords, then the directory.\n\n```linux\nsudo sssctl user-checks tcole\n```\nRuns the account (authorization) checks for `tcole` through PAM and shows the result:\n```text\npam_acct_mgmt: Permission denied\n```\n```linux\nsudo grep -E 'pam_sss.*tcole' /var/log/auth.log | tail -3\n```\n```text\npam_sss(sshd:account): Access denied for user tcole: 6 (Permission denied)\n```\n`tcole` typed the right password (the auth phase succeeded - the lab's self-test does this) but the **account** phase denied him: `simple_allow_groups = linux-login` in `/etc/sssd/sssd.conf`.\n\n### Your task\nCreate `~/lab/m07/stack.txt`:\n```text\npasswd_sources=<the sources on the passwd: line of nsswitch.conf, space-separated, in order>\nnwalker_source=<files or sss: where nwalker is defined>\nnwalker_uid=<nwalker's UID>\nsshd_auth_stack=<the stack file /etc/pam.d/sshd includes for authentication, e.g. common-xxx>\nlockout_module=<the PAM module that locks accounts after failed passwords>\ntcole_failure=<authentication or authorization>\ntcole_rule=<the sssd.conf setting that denies tcole>\n```\n\n### Verify\nRe-run the commands; **Check my work** reads the live files.\n\n### If it fails\n- *passwd_sources*: copy the words after `passwd:` exactly, single spaces.\n- *sshd_auth_stack*: look for `@include` lines in `/etc/pam.d/sshd`.\n- *tcole_rule*: the setting name only (left of `=`).\n\n### Hint 1\nEverything is in three places: `/etc/nsswitch.conf`, `/etc/pam.d/sshd` + `common-auth`, and `/etc/sssd/sssd.conf` (`sudo cat`).\n\n### Hint 2\n`getent -s files passwd nwalker` returns nothing - so where does `getent passwd nwalker` get him from? The lockout module's name contains \"fail\".\n\n### Hint 3\n`passwd_sources=files systemd sss`, `nwalker_source=sss`, `nwalker_uid=10001`, `sshd_auth_stack=common-auth`, `lockout_module=pam_faillock`, `tcole_failure=authorization`, `tcole_rule=simple_allow_groups`.\n\n### Walkthrough\n```linux\ngrep '^passwd' /etc/nsswitch.conf\ngetent -s files passwd nwalker; getent -s sss passwd nwalker\ngrep '@include' /etc/pam.d/sshd\ngrep faillock /etc/pam.d/common-auth\nsudo sssctl user-checks tcole\nsudo grep simple_allow /etc/sssd/sssd.conf\nmkdir -p ~/lab/m07\ncat > ~/lab/m07/stack.txt <<'EOF'\npasswd_sources=files systemd sss\nnwalker_source=sss\nnwalker_uid=10001\nsshd_auth_stack=common-auth\nlockout_module=pam_faillock\ntcole_failure=authorization\ntcole_rule=simple_allow_groups\nEOF\nlab check m07-authn-authz\n```", "group": "Module 7 exercises"}, {"id": "m07-directory-lookup", "title": "m07-directory-lookup: Look up a person in the directory", "md": "### Ticket\n**IAM-7002** - *From: Service Desk* - \"Priya Shah says Linux shows her with the wrong title. Pull her record from the directory and from Linux, and tell us her username, UID, title, and directory groups. Answers in `~/lab/m07/pshah.txt`.\"\n\n### Objective\nQuery an LDAP directory with `ldapsearch` (over StartTLS), compare it with what Linux sees through SSSD (`getent`, `id`), and read POSIX group membership.\n\n### Before you start\nLinux terminal. Anonymous read of names and groups is allowed in the lab directory; passwords are never returned.\n\n### Concepts and commands\n```linux\nldapsearch -x -ZZ -H ldap://ldap.iamlab.test -b ou=people,dc=iamlab,dc=test '(cn=Priya*)' uid uidNumber gidNumber title mail\n```\n- `-x` simple bind (anonymous here), `-ZZ` StartTLS and **fail** if TLS cannot be established, `-H` server, `-b` where to start searching.\n- `'(cn=Priya*)'` is the filter: common name starting with Priya. Other filters: `'(uid=pshah)'`, `'(&(objectClass=posixAccount)(uidNumber>=10000))'`.\n- The words after the filter are the attributes to show.\n```text\ndn: uid=pshah,ou=people,dc=iamlab,dc=test\nuid: pshah\nuidNumber: 10002\ngidNumber: 10000\ntitle: Finance Systems Analyst\nmail: pshah@iamlab.test\n```\n\n```linux\nldapsearch -x -ZZ -H ldap://ldap.iamlab.test -b ou=groups,dc=iamlab,dc=test '(memberUid=pshah)' cn\n```\nWhich groups list her as a member. Her **primary** group is the one whose `gidNumber` matches hers.\n\n```linux\ngetent passwd pshah\nid pshah\n```\n```text\npshah:*:10002:10000:Priya Shah:/home/pshah:/bin/bash\nuid=10002(pshah) gid=10000(dir-staff) groups=10000(dir-staff),10012(dir-finance)\n```\nThe same identity, as Linux resolves it via SSSD. If the directory changes and Linux still shows old data, the SSSD **cache** is the usual cause: `sudo sss_cache -E`.\n\n### Your task\nCreate `~/lab/m07/pshah.txt`:\n```text\nuid=<her username>\nuidnumber=<her UID>\ntitle=<her title, exactly as in the directory>\ngroups=<ALL her groups as id shows them (primary and supplementary), sorted, comma-separated>\ndn=<her full distinguished name>\n```\n\n### Verify\nCompare `ldapsearch` and `id pshah`. **Check my work** queries the directory live.\n\n### If it fails\n- *`ldap_start_tls: Connect error`*: use the host name `ldap.iamlab.test` (the certificate is issued for it), not an IP.\n- *groups wrong*: include the primary group (`dir-staff`), sort alphabetically.\n\n### Hint 1\nSearch people with a filter on `cn` or `uid`, then search groups with `(memberUid=pshah)`. `id pshah` shows the combined result.\n\n### Hint 2\n`id -nG pshah | tr ' ' '\\n' | sort | paste -sd, -` gives the groups line.\n\n### Hint 3\n`uid=pshah`, `uidnumber=10002`, `title=Finance Systems Analyst`, `groups=dir-finance,dir-staff`, `dn=uid=pshah,ou=people,dc=iamlab,dc=test`.\n\n### Walkthrough\n```linux\nldapsearch -x -ZZ -H ldap://ldap.iamlab.test -b ou=people,dc=iamlab,dc=test '(uid=pshah)' uid uidNumber title\nldapsearch -x -ZZ -H ldap://ldap.iamlab.test -b ou=groups,dc=iamlab,dc=test '(memberUid=pshah)' cn\nid pshah\nmkdir -p ~/lab/m07\nprintf 'uid=pshah\\nuidnumber=10002\\ntitle=Finance Systems Analyst\\ngroups=%s\\ndn=uid=pshah,ou=people,dc=iamlab,dc=test\\n' \"$(id -nG pshah | tr ' ' '\\n' | sort | paste -sd, -)\" > ~/lab/m07/pshah.txt\ncat ~/lab/m07/pshah.txt\nlab check m07-directory-lookup\n```", "group": "Module 7 exercises"}, {"id": "m07-directory-access", "title": "m07-directory-access: Priya can't log in - grant access in the directory", "md": "### Ticket\n**IAM-7003** - *Approved by: Finance Systems owner* - \"Priya Shah (`pshah`) needs to log in to `iamlab01` to run finance reports. She says her password is right but she is refused. Grant **login** access the standard way (directory group `linux-login`). Do not create a local account and do not change SSSD settings. Tomas Cole (`tcole`) must stay without access.\"\n\n### Objective\nProve a failure is authorization, not authentication; fix it at the source (directory group membership) with `ldapmodify`; flush the SSSD cache; verify allowed and denied users.\n\n### Before you start\nLinux terminal with `sudo`. You are in `diradmins`, so you can read the directory admin password file `/etc/linux-iam-lab/ldap-admin.pw`. Use it with `-y` - never print it, never paste it anywhere.\n\n### Concepts and commands\n```linux\nsudo sssctl user-checks pshah\nsudo grep 'pam_sss.*pshah' /var/log/auth.log | tail -2\n```\n```text\npam_sss(sshd:account): Access denied for user pshah: 6 (Permission denied)\n```\n`account` phase + \"Access denied\" = **authorization**. Her password is not the problem.\n\n```linux\nsudo grep -E 'access_provider|simple_allow' /etc/sssd/sssd.conf\nldapsearch -x -ZZ -H ldap://ldap.iamlab.test -b ou=groups,dc=iamlab,dc=test '(cn=linux-login)' memberUid\n```\nWho is allowed, and who is currently in that group.\n\n```linux\ncat > /tmp/add-pshah.ldif <<'EOF'\ndn: cn=linux-login,ou=groups,dc=iamlab,dc=test\nchangetype: modify\nadd: memberUid\nmemberUid: pshah\nEOF\nldapmodify -x -ZZ -H ldap://ldap.iamlab.test -D cn=admin,dc=iamlab,dc=test -y /etc/linux-iam-lab/ldap-admin.pw -f /tmp/add-pshah.ldif\n```\n- An **LDIF** change: which entry (`dn:`), what kind of change (`changetype: modify`), the operation (`add:` attribute) and the value.\n- `-D` the DN to bind as, `-y` read its password from a file (so it never appears on the command line or in history), `-f` the LDIF file.\n```text\nmodifying entry \"cn=linux-login,ou=groups,dc=iamlab,dc=test\"\n```\n\n```linux\nsudo sss_cache -E\nsudo sssctl user-checks pshah\n```\nSSSD caches group membership; `-E` expires everything so the next lookup asks the directory. The second check should now say `pam_acct_mgmt: Success`.\n\n### Your task\n1. Confirm from the logs/`sssctl` that `pshah`'s problem is authorization.\n2. Add `pshah` to the directory group `linux-login` with `ldapmodify` (bind as `cn=admin,dc=iamlab,dc=test` using `-y`).\n3. Flush the SSSD cache and verify.\n4. Do not add `tcole`; do not change `/etc/sssd/sssd.conf`; do not create a local `pshah`.\n\n### Verify\n`sudo sssctl user-checks pshah` succeeds and `sudo sssctl user-checks tcole` is still denied. **Check my work** performs real password logins for both through the same PAM stack sshd uses.\n\n### If it fails\n- *`ldap_bind: Invalid credentials (49)`*: wrong `-D` DN or password file path.\n- *`Type or value exists (20)`*: she is already a member - fine, move on.\n- *still denied after the change*: you skipped `sss_cache -E`, or misspelled `memberUid: pshah`.\n- *`ldap_start_tls: Connect error`*: use `ldap.iamlab.test`, keep `-ZZ`.\n\n### Hint 1\nThe fix is one attribute value on one directory entry: the group `cn=linux-login,ou=groups,dc=iamlab,dc=test`.\n\n### Hint 2\nWrite an LDIF with `changetype: modify` / `add: memberUid` / `memberUid: pshah` and apply it with `ldapmodify ... -D cn=admin,dc=iamlab,dc=test -y /etc/linux-iam-lab/ldap-admin.pw -f FILE`. Then `sudo sss_cache -E`.\n\n### Hint 3\nSee the Walkthrough. Afterwards remove the LDIF from `/tmp`.\n\n### Walkthrough\n```linux\nsudo sssctl user-checks pshah\ncat > /tmp/add-pshah.ldif <<'EOF'\ndn: cn=linux-login,ou=groups,dc=iamlab,dc=test\nchangetype: modify\nadd: memberUid\nmemberUid: pshah\nEOF\nldapmodify -x -ZZ -H ldap://ldap.iamlab.test -D cn=admin,dc=iamlab,dc=test -y /etc/linux-iam-lab/ldap-admin.pw -f /tmp/add-pshah.ldif\nrm /tmp/add-pshah.ldif\nsudo sss_cache -E\nsudo sssctl user-checks pshah\nsudo sssctl user-checks tcole\nlab check m07-directory-access\n```\n**Why fix it in the directory:** a local exception on one server is invisible to access reviews and is forgotten when Priya leaves. A directory group is reviewed centrally and removed by the leaver process everywhere at once.", "group": "Module 7 exercises"}, {"id": "m08", "title": "Module 8: Audit and automate IAM work", "md": "*Investigate failed logins, privileged activity and account changes with journald, auth.log and auditd; write a safe, rerunnable access-report script; export evidence for an access review.*\n\nAccess you cannot **see** you cannot govern. This module turns logs into answers and turns repeated checks into scripts that produce evidence.\n\n## Where Linux records identity events\n\n| Source | Contains | Read with |\n|---|---|---|\n| `/var/log/auth.log` (rsyslog) | logins, `sudo`, `su`, PAM messages, `useradd`/`usermod`, SSH | `sudo grep`, `sudo less` |\n| systemd journal | everything above plus service logs, with structured fields | `journalctl` |\n| audit log `/var/log/audit/audit.log` | kernel-level audit events: file watches, executed commands, logins | `ausearch`, `aureport` |\n| `last` / `lastb` / `lastlog` | login history (`wtmp`), failed logins (`btmp`, sshd only), last login per user | `last -n 10`, `sudo lastb`, `lastlog` |\n\n## journalctl essentials\n\n```linux\nsudo journalctl -u ssh --since today --no-pager\nsudo journalctl _COMM=sudo --since \"2 hours ago\"\nsudo journalctl -t useradd -t usermod -t userdel -t passwd -t chage\nsudo journalctl -p warning -b\n```\n- `-u UNIT` one service; `_COMM=NAME` messages from a program; `-t TAG` syslog identifier.\n- `--since/--until` accept `today`, `\"2026-11-11 09:00\"`, `\"1 hour ago\"`. `-b` current boot. `-p` priority.\n- `-o short-iso` ISO timestamps; `-o json` for scripts; `--no-pager` to pipe.\n\nTypical lines worth knowing:\n```text\npam_unix(sshd:auth): authentication failure; logname= uid=0 euid=0 tty= ruser= rhost=  user=aokafor\nsudo:   dpatel : command not allowed ; TTY=pts/1 ; PWD=/home/dpatel ; USER=root ; COMMAND=/usr/bin/cat /etc/shadow\nuseradd[2311]: new user: name=fgarcia, UID=2010, GID=2010, home=/home/fgarcia, shell=/bin/bash, from=/dev/pts/0\nusermod[2400]: add 'btran' to group 'webops'\n```\n\n## auditd\n\nThe Linux **audit** subsystem records events in the kernel, so they are hard to bypass. Rules:\n```text\n-w /etc/passwd -p wa -k identity\n```\n- `-w PATH` watch a file or directory; `-p wa` on **w**rite or **a**ttribute change (`r` read, `x` execute also exist); `-k KEY` a label you search by.\n- Persistent rules go in `/etc/audit/rules.d/*.rules`; load them with `sudo augenrules --load`; list active rules with `sudo auditctl -l`.\n- Search: `sudo ausearch -k identity -i` (`-i` turns numeric IDs into names, `--start today`). Summaries: `sudo aureport -au` (authentications), `sudo aureport -m` (account modifications), `sudo aureport --summary`.\n\nThe audit record shows **auid** - the *original* login user - even after `sudo`, so you can tell that `student` (not \"root\") changed `/etc/passwd`.\n\n## Scripts that are safe to rerun\n\nAn access report runs every month and is evidence, so it must be predictable:\n- `set -euo pipefail`; check prerequisites (are we root?) and fail clearly.\n- **Read-only**: never change accounts or files you report on.\n- Write to a **new, timestamped** file (`report-$(date +%Y%m%d-%H%M%S).csv`) and update a `latest` copy, so reruns never overwrite earlier evidence.\n- Quote every variable, handle \"no data\" without crashing, keep the output format stable (header row, same column order).\n- Exit status `0` only when the report is complete.\n\n## Evidence for an access review\n\nAuditors want to know **what** was reviewed, **when**, **by whom**, and that it was **not altered**: the report files, the commands that produced them, a timestamp, and checksums (`sha256sum * > SHA256SUMS`, verified later with `sha256sum -c SHA256SUMS`), packaged together (`tar -czf`).\n", "group": "Lessons"}, {"id": "m08-failed-logins", "title": "m08-failed-logins: Investigate failed logins and a sudo denial", "md": "### Ticket\n**SEC-8001** - *From: SOC* - \"Our SIEM flagged `iamlab01`: repeated password failures and a blocked privileged command in the last hour. Find which account had the failed passwords, who tried to use sudo for something they are not allowed to, and what exactly they tried. Also confirm the lockout threshold. Answers in `~/lab/m08/investigation.txt`.\"\n\n### Objective\nFind authentication failures and sudo denials in `auth.log` and the journal, and extract exact facts for an incident ticket.\n\n### Before you start\nLinux terminal with `sudo`. **Start scenario** generates the events now (or `lab reset m08-failed-logins`).\n\n### Concepts and commands\n```linux\nsudo grep 'authentication failure' /var/log/auth.log | tail -5\n```\n```text\n2026-11-11T10:20:01 iamlab01 pamtester: pam_unix(sshd:auth): authentication failure; logname= uid=0 euid=0 tty= ruser= rhost=  user=aokafor\n```\n(The lab simulates the attempts with a PAM test tool, so the program name is `pamtester`; on a real server it would be `sshd`.)\n\n```linux\nsudo grep 'authentication failure' /var/log/auth.log | grep -oE 'user=[^ ]+' | sort | uniq -c | sort -rn\n```\nCounts failures per user - the pipeline skills from module 2.\n\n```linux\nsudo journalctl _COMM=sudo --since \"1 hour ago\" --no-pager | grep -iE 'not allowed|NOT in sudoers'\n```\n```text\nsudo[3210]:   dpatel : command not allowed ; TTY=unknown ; PWD=/ ; USER=root ; COMMAND=/usr/bin/cat /etc/shadow\n```\nFormat: `WHO : RESULT ; TTY ; PWD ; USER=target ; COMMAND=what`.\n\n```linux\ngrep -E '^(deny|fail_interval|unlock_time)' /etc/security/faillock.conf\n```\n\n### Your task\nCreate `~/lab/m08/investigation.txt`:\n```text\nmost_failed_user=<account with the most password failures in this scenario>\nsudo_denied_user=<who was refused by sudo>\nsudo_denied_command=<the exact command they tried, full path and arguments>\nfaillock_deny=<how many failures lock an account on this server>\n```\n\n### Verify\nRe-check each fact in the log. **Check my work** compares with the generated events.\n\n### If it fails\n- *most_failed_user*: count only `authentication failure` lines; earlier exercises may have added other users' failures, so count, do not guess.\n- *sudo_denied_command*: copy everything after `COMMAND=`.\n\n### Hint 1\nTwo searches: one for `authentication failure` (count per `user=`), one for `not allowed` in sudo's messages.\n\n### Hint 2\nThe `COMMAND=` field holds the exact command. The threshold is the `deny` line in `/etc/security/faillock.conf`.\n\n### Hint 3\nIn this scenario: `most_failed_user=aokafor`, `sudo_denied_user=dpatel`, `sudo_denied_command=/usr/bin/cat /etc/shadow`, `faillock_deny=5`.\n\n### Walkthrough\n```linux\nsudo grep 'authentication failure' /var/log/auth.log | grep -oE 'user=[^ ]+' | sort | uniq -c | sort -rn | head -3\nsudo journalctl _COMM=sudo --since \"1 hour ago\" --no-pager | grep -iE 'not allowed|NOT in sudoers'\ngrep '^deny' /etc/security/faillock.conf\nmkdir -p ~/lab/m08\ncat > ~/lab/m08/investigation.txt <<'EOF'\nmost_failed_user=aokafor\nsudo_denied_user=dpatel\nsudo_denied_command=/usr/bin/cat /etc/shadow\nfaillock_deny=5\nEOF\nlab check m08-failed-logins\n```\n**Next steps a SOC would expect:** was there a success after the failures (`grep 'Accepted\\|session opened' ...`), is the account now locked (`faillock --user aokafor`), and does dpatel's manager know he tried to read password hashes?", "group": "Module 8 exercises"}, {"id": "m08-auditd", "title": "m08-auditd: Watch identity and sudo files with auditd", "md": "### Ticket\n**SEC-8002** - *From: Compliance* - \"Control AC-7 requires that every change to local identities and to sudo policy is recorded with **who** did it. Add persistent audit rules on `iamlab01` for `/etc/passwd`, `/etc/group`, `/etc/shadow`, `/etc/gshadow` (key `identity`) and `/etc/sudoers` plus `/etc/sudoers.d/` (key `privilege`). Prove it by recording a test account creation.\"\n\n### Objective\nWrite persistent auditd rules, load them, generate a test event, and find it with `ausearch` - including the original login user (auid).\n\n### Before you start\nLinux terminal with `sudo`. auditd is running (`systemctl status auditd`).\n\n### Concepts and commands\n```linux\nsudo auditctl -l\n```\nLists the rules currently active in the kernel (`No rules` at first).\n\n```linux\nsudo nano /etc/audit/rules.d/50-iam.rules\n```\n```conf\n## SEC-8002 identity and privilege changes\n-w /etc/passwd -p wa -k identity\n-w /etc/group -p wa -k identity\n-w /etc/shadow -p wa -k identity\n-w /etc/gshadow -p wa -k identity\n-w /etc/sudoers -p wa -k privilege\n-w /etc/sudoers.d/ -p wa -k privilege\n```\n`-w` watch path, `-p wa` write or attribute change, `-k` key to search by. A trailing `/` watches a directory tree.\n\n```linux\nsudo augenrules --load\nsudo auditctl -l\n```\n`augenrules` merges `/etc/audit/rules.d/*.rules` into `/etc/audit/audit.rules` and loads them. Files in `rules.d` are what survive a reboot.\n```text\n-w /etc/passwd -p wa -k identity\n...\n-w /etc/sudoers.d -p wa -k privilege\n```\n\n```linux\nsudo useradd -M -s /usr/sbin/nologin audit-test-user\nsudo userdel audit-test-user\nsudo ausearch -k identity -i --start recent | tail -20\n```\n`-M` no home folder. `ausearch -k KEY` finds events by key; `-i` interprets numbers into names; `--start recent` = last 10 minutes.\n```text\ntype=SYSCALL ... auid=student uid=root ... comm=useradd exe=/usr/sbin/useradd key=identity\n```\n`uid=root` (sudo made it root) but `auid=student`: the audit trail remembers **who logged in**.\n\n```linux\nsudo aureport -m --start today\n```\nAccount-modification summary.\n\n### Your task\n1. Create `/etc/audit/rules.d/50-iam.rules` with the six watches and keys above.\n2. Load the rules and confirm with `auditctl -l`.\n3. Create and delete a test user, then find the events with `ausearch -k identity`.\n\n### Verify\n`sudo auditctl -l` lists six watches; `sudo ausearch -k identity -i --start today` shows events with `auid=student`. **Check my work** also changes a watched file itself and looks for the event.\n\n### If it fails\n- *rules not active*: run `sudo augenrules --load`. If it says `The audit system is in immutable mode`, rules can only change after a reboot (not set in this lab).\n- *ausearch: <no matches>*: create the test user **after** loading the rules.\n- *auditd not running*: `sudo systemctl status auditd`.\n\n### Hint 1\nOne file in `/etc/audit/rules.d/`, six lines, each `-w PATH -p wa -k KEY`.\n\n### Hint 2\nLoad with `sudo augenrules --load`, check with `sudo auditctl -l`, search with `sudo ausearch -k identity -i`.\n\n### Hint 3\nCopy the six lines from \"Concepts and commands\" into `/etc/audit/rules.d/50-iam.rules`, then `sudo augenrules --load && sudo useradd -M audit-test-user && sudo userdel audit-test-user && sudo ausearch -k identity -i --start recent`.\n\n### Walkthrough\n```linux\nsudo tee /etc/audit/rules.d/50-iam.rules > /dev/null <<'EOF'\n## SEC-8002 identity and privilege changes\n-w /etc/passwd -p wa -k identity\n-w /etc/group -p wa -k identity\n-w /etc/shadow -p wa -k identity\n-w /etc/gshadow -p wa -k identity\n-w /etc/sudoers -p wa -k privilege\n-w /etc/sudoers.d/ -p wa -k privilege\nEOF\nsudo augenrules --load\nsudo auditctl -l\nsudo useradd -M -s /usr/sbin/nologin audit-test-user\nsudo userdel audit-test-user\nsudo ausearch -k identity -i --start recent | grep -E 'SYSCALL' | tail -3\nsudo aureport -m --start today\nlab check m08-auditd\n```", "group": "Module 8 exercises"}, {"id": "m08-access-report", "title": "m08-access-report: Script a repeatable access report", "md": "### Ticket\n**AUD-8003** - *From: Internal Audit* - \"We want the same access report every month, produced by a script, not by hand. Write `~/bin/access-report.sh`. Run with sudo, it writes a CSV of every **human** local account (UID 1000-59999) to a new timestamped file in the folder given as its first argument (default `~/reports`), updates `access-report-latest.csv` there, and prints the path of the new report. It must never change the system and must be safe to run again and again.\"\n\nCSV header, exactly:\n```text\nuser,uid,primary_group,groups,shell,password_status,account_expires,sudo\n```\n| Column | Value |\n|---|---|\n| `groups` | supplementary groups, sorted, separated by `;` (a comma would break the CSV) |\n| `password_status` | 2nd field of `passwd -S`: `P`, `L` or `NP` |\n| `account_expires` | `never`, or the date as `YYYY-MM-DD` |\n| `sudo` | `yes` if `sudo -l -U USER` lists any rule for the user, else `no` |\n\n### Objective\nWrite a robust, read-only, rerunnable Bash script that turns identity data into audit evidence.\n\n### Before you start\nLinux terminal with `sudo`. Review module 2 (scripts) and module 3 (identity files). This is the longest exercise so far - build it step by step.\n\n### Concepts and commands\n```linux\ngetent passwd | awk -F: '$3>=1000 && $3<60000 {print $1}'\n```\nHuman accounts by UID range. `getent` (not `cat /etc/passwd`) so directory users configured to enumerate would be included too.\n\n```linux\nsudo passwd -S btran | awk '{print $2}'\nsudo chage -l kwright | awk -F': ' '/Account expires/ {print $2}'\ndate -d \"Dec 31, 2025\" +%F\n```\n```text\nP\nDec 31, 2025\n2025-12-31\n```\n\n```linux\nsudo -l -U dpatel >/dev/null 2>&1; sudo -l -U dpatel | grep -q 'may run the following' && echo yes || echo no\n```\n`sudo -l -U` prints `User X may run the following commands` when the user has any rule, or `User X is not allowed to run sudo` otherwise.\n\n```linux\nid -nG btran | tr ' ' '\\n' | grep -vx \"$(id -gn btran)\" | sort | paste -sd';' -\n```\nSupplementary groups joined with `;`.\n\nA skeleton to start from:\n```linux\n#!/usr/bin/env bash\n# access-report.sh - AUD-8003 monthly local access report (read-only)\nset -euo pipefail\n[ \"$(id -u)\" -eq 0 ] || { echo \"run with sudo\" >&2; exit 1; }\noutdir=\"${1:-$HOME/reports}\"\nmkdir -p \"$outdir\"\nout=\"$outdir/access-report-$(date +%Y%m%d-%H%M%S).csv\"\necho \"user,uid,primary_group,groups,shell,password_status,account_expires,sudo\" > \"$out\"\ngetent passwd | awk -F: '$3>=1000 && $3<60000' | sort -t: -k1,1 | while IFS=: read -r user _ uid gid _ _ shell; do\n  # ... compute each column here ...\n  echo \"$user,$uid,...\" >> \"$out\"\ndone\ncp \"$out\" \"$outdir/access-report-latest.csv\"\necho \"$out\"\n```\n- `while IFS=: read -r ...` splits each passwd line into variables; `_` throws away fields you do not need.\n- With sudo, `$HOME` is still `/home/student` on Ubuntu, so the default lands in your home.\n\n### Your task\n1. Complete `~/bin/access-report.sh` to the specification. Make it executable.\n2. Run it twice with `sudo`; you should get two timestamped files and one `latest` copy.\n3. Read the CSV. Do you spot anything a reviewer should question?\n\n### Verify\n```linux\nsudo ~/bin/access-report.sh ~/reports\ncolumn -s, -t ~/reports/access-report-latest.csv | less -S\n```\n**Check my work** runs your script twice into a temporary folder and compares every row with the live system, and confirms the script changed nothing.\n\n### If it fails\n- *header mismatch*: copy the header exactly; no spaces.\n- *row wrong for kwright*: expiry must be `2025-12-31`, not `Dec 31, 2025`.\n- *script modified the system*: the check hashes `/etc/passwd`, `/etc/group`, `/etc/shadow` before and after - do not call `usermod`, `chage -E`, etc.\n- *second run overwrote the first*: include seconds in the timestamp (`%H%M%S`).\n- *`sudo: unable to execute ... Permission denied`*: `chmod +x ~/bin/access-report.sh`.\n\n### Hint 1\nStart from the skeleton; add one column at a time and run the script after each change.\n\n### Hint 2\nPer user: `primary=$(id -gn \"$user\")`, `groups=$(id -nG \"$user\" | tr ' ' '\\n' | grep -vx \"$primary\" | sort | paste -sd';' -)`, `pw=$(passwd -S \"$user\" | awk '{print $2}')`, `exp=$(chage -l \"$user\" | awk -F': ' '/Account expires/ {print $2}')` then convert unless it is `never`.\n\n### Hint 3\nFor sudo: `if sudo -l -U \"$user\" 2>/dev/null | grep -q 'may run the following'; then s=yes; else s=no; fi`. The full script is in the Walkthrough.\n\n### Walkthrough\n```linux\nmkdir -p ~/bin\ncat > ~/bin/access-report.sh <<'EOF'\n#!/usr/bin/env bash\n# access-report.sh - AUD-8003 monthly local access report. Read-only; safe to rerun.\nset -euo pipefail\n[ \"$(id -u)\" -eq 0 ] || { echo \"access-report: run with sudo\" >&2; exit 1; }\noutdir=\"${1:-$HOME/reports}\"\nmkdir -p \"$outdir\"\nout=\"$outdir/access-report-$(date +%Y%m%d-%H%M%S).csv\"\necho \"user,uid,primary_group,groups,shell,password_status,account_expires,sudo\" > \"$out\"\ngetent passwd | awk -F: '$3>=1000 && $3<60000' | sort -t: -k1,1 | while IFS=: read -r user _ uid _ _ _ shell; do\n  primary=$(id -gn \"$user\")\n  groups=$(id -nG \"$user\" | tr ' ' '\\n' | grep -vx \"$primary\" | sort | paste -sd';' - || true)\n  pw=$(passwd -S \"$user\" | awk '{print $2}')\n  exp=$(chage -l \"$user\" | awk -F': ' '/Account expires/ {print $2}')\n  [ \"$exp\" = \"never\" ] || exp=$(date -d \"$exp\" +%F)\n  if sudo -l -U \"$user\" 2>/dev/null | grep -q 'may run the following'; then s=yes; else s=no; fi\n  echo \"$user,$uid,$primary,$groups,$shell,$pw,$exp,$s\" >> \"$out\"\ndone\ncp \"$out\" \"$outdir/access-report-latest.csv\"\necho \"$out\"\nEOF\nchmod +x ~/bin/access-report.sh\nsudo ~/bin/access-report.sh ~/reports\nsleep 1; sudo ~/bin/access-report.sh ~/reports\nls -l ~/reports\ncolumn -s, -t ~/reports/access-report-latest.csv\nlab check m08-access-report\n```\nThings a reviewer should question: `kwright` (expired contractor) still exists, `student` is a full admin, which accounts have `sudo=yes`, any account with `NP` (no password).\n\nThe files are owned by root (the script ran with sudo); `sudo chown -R student: ~/reports` if you want to edit them.", "group": "Module 8 exercises"}, {"id": "m08-evidence", "title": "m08-evidence: Package evidence for the quarterly access review", "md": "### Ticket\n**AUD-8004** - *From: Internal Audit* - \"For the Q4 access review of `iamlab01`, give us one archive `~/evidence/access-review-2026Q4.tar.gz` containing a folder `access-review-2026Q4/` with: the access report CSV, the sudo rules, the members of every role group, the SSH keys authorized for each user (fingerprints only), and a `SHA256SUMS` file so we can prove nothing was changed after collection.\"\n\nRequired files inside `access-review-2026Q4/`:\n| File | Content |\n|---|---|\n| `access-report.csv` | output of your `access-report.sh` (module 8) |\n| `sudo-rules.txt` | every effective sudo rule (from `/etc/sudoers` and `/etc/sudoers.d/`, comments removed) |\n| `group-members.txt` | `getent group` lines for `finance hr engineering helpdesk auditors proj-falcon webops ssh-users sudo` |\n| `ssh-keys.txt` | for each user with `~/.ssh/authorized_keys`: the user name and key fingerprints |\n| `SHA256SUMS` | checksums of the four files above |\n\n### Objective\nCollect evidence reproducibly, protect its integrity with checksums, and package it.\n\n### Before you start\nLinux terminal with `sudo`. Your `~/bin/access-report.sh` from AUD-8003 should work.\n\n### Concepts and commands\n```linux\nD=~/evidence/access-review-2026Q4\nmkdir -p \"$D\"\nsudo ~/bin/access-report.sh /tmp/q4 && cp /tmp/q4/access-report-latest.csv \"$D/access-report.csv\"\n```\n\n```linux\nsudo sh -c \"grep -hv '^\\s*#' /etc/sudoers /etc/sudoers.d/*\" | grep -v '^\\s*$' > \"$D/sudo-rules.txt\"\n```\n`-h` omit file names, `-v '^\\s*#'` drop comment lines; the second grep drops empty lines.\n\n```linux\ngetent group finance hr engineering helpdesk auditors proj-falcon webops ssh-users sudo > \"$D/group-members.txt\"\n```\n\n```linux\nsudo sh -c 'for f in /home/*/.ssh/authorized_keys; do echo \"## $f\"; ssh-keygen -lf \"$f\"; done' > \"$D/ssh-keys.txt\"\n```\nA `for` loop over every matching file. It runs inside `sudo sh -c '...'` because you (student) cannot even *see* other users' `.ssh` folders, so the `*` would not expand without root. The output is redirected once, as you, into your evidence folder.\n\n```linux\ncd \"$D\" && sha256sum access-report.csv sudo-rules.txt group-members.txt ssh-keys.txt > SHA256SUMS\nsha256sum -c SHA256SUMS\n```\n```text\naccess-report.csv: OK\nsudo-rules.txt: OK\ngroup-members.txt: OK\nssh-keys.txt: OK\n```\n\n```linux\ncd ~/evidence && tar -czf access-review-2026Q4.tar.gz access-review-2026Q4\ntar -tzf access-review-2026Q4.tar.gz\n```\n\n### Your task\nBuild `~/evidence/access-review-2026Q4/` with the five files and package it as `~/evidence/access-review-2026Q4.tar.gz`. Make sure `sha256sum -c` passes **inside the archive**.\n\n### Verify\n`tar -tzf` shows five files under `access-review-2026Q4/`. **Check my work** extracts the archive to a temporary folder and runs `sha256sum -c`.\n\n### If it fails\n- *checksum mismatch*: you edited a file after creating `SHA256SUMS` - regenerate it, then re-create the archive.\n- *paths in the archive start with /home*: run `tar` from `~/evidence` with a relative folder name.\n- *files owned by root*: fine for the check; `sudo chown -R student: ~/evidence` if you want to edit them.\n\n### Hint 1\nCollect the four data files first, then the checksum file, then the archive - in that order.\n\n### Hint 2\nThe commands in \"Concepts and commands\" do it step by step; run them in order.\n\n### Hint 3\nSee the Walkthrough for a single copy-paste sequence.\n\n### Walkthrough\n```linux\nD=~/evidence/access-review-2026Q4\nrm -rf \"$D\"; mkdir -p \"$D\"\nsudo ~/bin/access-report.sh /tmp/q4 >/dev/null && cp /tmp/q4/access-report-latest.csv \"$D/access-report.csv\"\nsudo sh -c \"grep -hv '^\\s*#' /etc/sudoers /etc/sudoers.d/*\" | grep -v '^\\s*$' > \"$D/sudo-rules.txt\"\ngetent group finance hr engineering helpdesk auditors proj-falcon webops ssh-users sudo > \"$D/group-members.txt\"\nsudo sh -c 'for f in /home/*/.ssh/authorized_keys; do echo \"## $f\"; ssh-keygen -lf \"$f\"; done' > \"$D/ssh-keys.txt\"\ncd \"$D\" && sha256sum access-report.csv sudo-rules.txt group-members.txt ssh-keys.txt > SHA256SUMS && sha256sum -c SHA256SUMS\ncd ~/evidence && tar -czf access-review-2026Q4.tar.gz access-review-2026Q4\ntar -tzf access-review-2026Q4.tar.gz\nlab check m08-evidence\n```\nIn a real review you would also record **who** collected it and **when** (a `README.txt` with your name, date and the commands), and store the archive somewhere the administrators of this server cannot modify.", "group": "Module 8 exercises"}, {"id": "m09", "title": "Module 9: Capstone - a contractor's full access lifecycle", "md": "*Onboard a contractor with exactly the approved access, fix a broken login, revoke everything at contract end, and submit evidence that allowed actions worked and unauthorized ones were denied.*\n\nThis is the job, end to end. One contractor, four tickets, no step-by-step instructions in the task - just the requirements, like at work. Everything you need was taught in modules 1-8:\n\n| Ticket | You will use |\n|---|---|\n| CAP-9001 onboard | `useradd`, `chage`, groups (m03), SSH keys (m06), `visudo` (m05), testing as the user (m04) |\n| CAP-9002 broken login | logs (m02, m08), StrictModes and sshd diagnostics (m06), account state (m03) |\n| CAP-9003 revoke | the leaver procedure (m03), sudo cleanup (m05), key removal (m06) |\n| CAP-9004 evidence | reports and evidence (m08) |\n\n## How the capstone works\n\n- Read the current ticket: `lab capstone status` (or the button on the exercise page).\n- Do the work in the Linux terminal.\n- Run **Check my work** (`lab check m09-capstone`). When the current ticket's requirements are met, the check **records the test results as evidence** and the next ticket arrives.\n- CAP-9002 is different for every learner: something will break, and you have to find out what.\n- At the end, `lab capstone evidence` generates a signed-off test report from everything that was recorded; you add your own notes.\n\n## A professional's checklist\n\n1. **Read the approval.** Grant exactly what is approved - no more, no \"while I'm at it\".\n2. **Change, then test both directions.** Every allowed action works; every action outside the approval is denied.\n3. **Diagnose from evidence, not guesses.** Server logs first, then account state, then file permissions.\n4. **Revoke completely.** Password, keys, groups, sudo rules, sessions, scheduled jobs. Keep data and the account for retention.\n5. **Leave a trail.** Ticket number in comments and file names; command output in your notes.\n\n`lab capstone status` shows where you are at any time. **Retry exercise** restarts the whole capstone from CAP-9001.\n", "group": "Lessons"}, {"id": "m09-capstone", "title": "m09-capstone: Contractor Jordan Lee - onboard, fix, revoke, evidence", "md": "### Ticket\nFour tickets arrive one after another. The check moves you to the next one when the current one is done.\n\n**CAP-9001 - Onboard contractor** - *Approved by: Ben Tran (Falcon project lead) and Head of IT Operations*\n\"Jordan Lee joins Project Falcon as a contractor until **31 March 2027**.\n- Account `jlee`, comment `Jordan Lee - Contractor (Falcon) CAP-9001`, shell `/bin/bash`, private home folder.\n- Roles: `proj-falcon` and `ssh-users`. Nothing else.\n- **Key-only** login: no usable password. Public key: `/opt/lab-data/capstone/jlee_laptop.pub` (verify the fingerprint in `/opt/lab-data/capstone/CAP-9001.txt`).\n- Jordan may restart the Falcon web service without a password (`systemctl restart falcon-web.service`) - nothing else as root. Put the rule in `/etc/sudoers.d/70-cap9001-jlee`.\n- Must be able to create and edit files in `/srv/projects/falcon`. Must **not** see Finance or HR data.\"\n\n**CAP-9002 - \"Permission denied (publickey)\"** - arrives after CAP-9001. Jordan reports that the key login stopped working. Find the cause and fix it without granting anything extra.\n\n**CAP-9003 - Contract terminated** - arrives after CAP-9002. Revoke all of Jordan's access today. Keep the account and archive the home folder to `/srv/archive/offboarded/jlee-home.tar.gz` (legal hold).\n\n**CAP-9004 - Evidence** - Write `~/capstone/evidence/notes.md` describing what you did for each ticket (mention CAP-9001, CAP-9002 including the **root cause**, and CAP-9003), then run `lab capstone evidence` to generate the test report.\n\n### Objective\nDemonstrate the full identity lifecycle on Linux for a privileged contractor: grant exactly the approved access, troubleshoot from evidence, revoke completely, and prove each step with allowed **and** denied tests.\n\n### Before you start\nLinux terminal with `sudo`. `lab capstone status` prints the current ticket. Every requirement maps to something you practised; the hints point to the module.\n\n### Concepts and commands\nThe check runs this **test matrix** as Jordan, for real:\n\n| Stage | Must be ALLOWED | Must be DENIED |\n|---|---|---|\n| after CAP-9001 / CAP-9002 | SSH login with Jordan's key; create a file in `/srv/projects/falcon`; `sudo -n systemctl restart falcon-web.service` | read `/srv/finance/budget-2027.csv`; list `/srv/hr`; `sudo -n systemctl stop falcon-web.service`; `sudo -n cat /etc/shadow`; password login |\n| after CAP-9003 | (nothing) | SSH key login; any sudo; writing to `/srv/projects/falcon` |\n\nRun the same tests yourself while you work:\n```linux\nsudo -u jlee touch /srv/projects/falcon/jlee-test.txt\nsudo -u jlee cat /srv/finance/budget-2027.csv\nsudo -l -U jlee\nsudo -u jlee sudo -n /usr/bin/systemctl restart falcon-web.service\nsudo -u jlee sudo -n /usr/bin/systemctl stop falcon-web.service\n```\n`sudo -u jlee sudo -n ...` runs sudo **as Jordan**; `-n` (non-interactive) fails instead of asking for a password, which proves the NOPASSWD scope.\n\n```linux\nlab capstone status\nlab check m09-capstone\nlab capstone evidence\n```\n\n### Your task\nComplete CAP-9001 to CAP-9004 in order. Run **Check my work** after each ticket.\n\n### Verify\nEach successful check prints the stage's ALLOWED/DENIED results and saves them under `/var/lib/linux-iam-lab/capstone-results/`. The final report lands in `~/capstone/evidence/`.\n\n### If it fails\n- *CAP-9001 groups wrong*: exactly `proj-falcon` and `ssh-users` (plus Jordan's private group).\n- *password login allowed*: lock it - `usermod -L` - and do not set one.\n- *sudo restart asks for a password*: `NOPASSWD:` must be in the rule; validate with `visudo -cf`.\n- *CAP-9002*: start with `sudo journalctl -u ssh -n 30 --no-pager`, then `sudo chage -l jlee`, `getent passwd jlee`, `sudo namei -l /home/jlee/.ssh/authorized_keys`, and compare fingerprints.\n- *CAP-9003 key login still works*: expire the account and remove the key; check `sshd` logs.\n\n### Hint 1\nCAP-9001 is module 3 (`useradd -m -c ... -s ... -G ... -e ...`, then `usermod -L`), module 6 (`install` the key with 700/600 owned by jlee) and module 5 (`visudo -f /etc/sudoers.d/70-cap9001-jlee`). CAP-9003 is the leaver procedure from m03-offboard plus deleting the sudo rule.\n\n### Hint 2\nThe sudo rule is one line: `jlee ALL=(root) NOPASSWD: /usr/bin/systemctl restart falcon-web.service`. For CAP-9002 the server log names the problem; four kinds of fault are possible (key file permissions, account expiry, login shell, wrong key).\n\n### Hint 3\nSee the Walkthrough. It covers CAP-9001 and CAP-9003 completely, and how to diagnose each possible CAP-9002 fault.\n\n### Walkthrough\n**CAP-9001**\n```linux\ncat /opt/lab-data/capstone/CAP-9001.txt\nssh-keygen -lf /opt/lab-data/capstone/jlee_laptop.pub\nsudo useradd -m -c \"Jordan Lee - Contractor (Falcon) CAP-9001\" -s /bin/bash -G proj-falcon,ssh-users -e 2027-03-31 jlee\nsudo usermod -L jlee\nsudo chmod 750 /home/jlee\nsudo install -d -m 700 -o jlee -g jlee /home/jlee/.ssh\nsudo install -m 600 -o jlee -g jlee /opt/lab-data/capstone/jlee_laptop.pub /home/jlee/.ssh/authorized_keys\necho 'jlee ALL=(root) NOPASSWD: /usr/bin/systemctl restart falcon-web.service' | sudo tee /tmp/70-cap9001-jlee\nsudo visudo -cf /tmp/70-cap9001-jlee && sudo install -m 440 -o root -g root /tmp/70-cap9001-jlee /etc/sudoers.d/70-cap9001-jlee\nsudo visudo -c\nsudo -u jlee touch /srv/projects/falcon/jlee-test.txt\nsudo -u jlee cat /srv/finance/budget-2027.csv\nsudo -u jlee sudo -n /usr/bin/systemctl restart falcon-web.service\nsudo -u jlee sudo -n /usr/bin/systemctl stop falcon-web.service\nlab check m09-capstone\n```\n**CAP-9002** - read the log, then match the symptom:\n```linux\nsudo journalctl -u ssh -n 30 --no-pager | grep -i jlee\nsudo namei -l /home/jlee/.ssh/authorized_keys\nsudo chage -l jlee | grep 'Account expires'\ngetent passwd jlee | cut -d: -f7\nsudo ssh-keygen -lf /home/jlee/.ssh/authorized_keys; ssh-keygen -lf /opt/lab-data/capstone/jlee_laptop.pub\n```\n| Log / finding | Fix |\n|---|---|\n| `bad ownership or modes` | `sudo chown -R jlee:jlee /home/jlee/.ssh && sudo chmod 700 /home/jlee/.ssh && sudo chmod 600 /home/jlee/.ssh/authorized_keys` |\n| `User account has expired` / expiry in the past | `sudo chage -E 2027-03-31 jlee` |\n| shell `/usr/sbin/nologin` | `sudo usermod -s /bin/bash jlee` |\n| fingerprints differ | `sudo install -m 600 -o jlee -g jlee /opt/lab-data/capstone/jlee_laptop.pub /home/jlee/.ssh/authorized_keys` |\n```linux\nlab check m09-capstone\n```\n**CAP-9003**\n```linux\nsudo usermod -L -e 1 -s /usr/sbin/nologin jlee\nsudo usermod -G \"\" jlee\nsudo rm /etc/sudoers.d/70-cap9001-jlee && sudo visudo -c\nsudo rm -f /home/jlee/.ssh/authorized_keys\nsudo crontab -r -u jlee 2>/dev/null; sudo pkill -KILL -u jlee\nsudo mkdir -p /srv/archive/offboarded && sudo tar -czf /srv/archive/offboarded/jlee-home.tar.gz -C /home jlee\nsudo -l -U jlee\nlab check m09-capstone\n```\n**CAP-9004**\n```linux\nmkdir -p ~/capstone/evidence\nnano ~/capstone/evidence/notes.md\n```\n```text\n# Capstone evidence - Jordan Lee (jlee)\n## CAP-9001 onboarding\nCreated jlee (expires 2027-03-31), roles proj-falcon + ssh-u const list = document.getElementById('list'), body = document.getElementById('body'), q = document.getElementById('q');
function show(id, term) {
  const d = DOCS.find(x => x.id === id) || DOCS[0];
  let md = d.md;
  if (term) {
    const parts = md.split(/\n(?=### )/);
    const hit = parts.filter(p => p.toLowerCase().includes(term));
    if (hit.length) md = hit.join('\n');
  }
  body.innerHTML = '<h1>' + LabMarkdown.esc(d.title) + '</h1>' + LabMarkdown.render(md);
  document.querySelectorAll('#list a').forEach(a => a.classList.toggle('active', a.dataset.id === d.id));
  location.hash = d.id;
}
function draw() {
  const term = q.value.trim().toLowerCase();
  let html = '', group = '';
  for (const d of DOCS) {
    if (term && !(d.title + ' ' + d.md).toLowerCase().includes(term)) continue;
    if (d.group !== group) { group = d.group; html += '<h4>' + group + '</h4>'; }
    html += '<a href="#' + d.id + '" data-id="' + d.id + '">' + LabMarkdown.esc(d.title) + '</a>';
  }
  list.innerHTML = html || '<p>No matches</p>';
  list.querySelectorAll('a').forEach(a => a.onclick = (e) => { e.preventDefault(); show(a.dataset.id, term); });
}
q.oninput = draw; draw(); show((location.hash || '').slice(1));
